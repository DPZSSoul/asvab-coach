<style>
/* ASVAB Coach - simple, high contrast, big type. No italics anywhere. */
:root{
  --bg:#FFFDF2; --card:#FFFFFF; --text:#111111; --muted:#333333; --line:#222222;
  --primary:#003A8C; --primary-text:#FFFFFF; --ok:#0B6B2B; --ok-bg:#E3F5E8; --bad:#A31515; --bad-bg:#FBE4E4;
  --hl:#FFE14D; --focus:#FFB000; --soft:#EEF3FB;
}
body.dark{ --bg:#000000; --card:#111111; --text:#FFFFFF; --muted:#EDEDED; --line:#FFFFFF;
  --primary:#FFD400; --primary-text:#000000; --ok:#6BE38C; --ok-bg:#0E2A16; --bad:#FF7B7B; --bad-bg:#2E0E0E; --hl:#FFD400; --soft:#1A1A1A; }
*{ box-sizing:border-box; font-style:normal !important; }
html{ font-size:22px; }
body{ margin:0; background:var(--bg); color:var(--text);
  font-family: Verdana, "Atkinson Hyperlegible", "DejaVu Sans", Arial, Helvetica, sans-serif;
  line-height:1.6; letter-spacing:0.02em; word-spacing:0.08em; }
body.big{ font-size:1.15rem; }
main{ max-width:820px; margin:0 auto; padding:12px 16px 80px; }
h1{ font-size:1.6rem; margin:.4em 0; } h2{ font-size:1.3rem; margin:.6em 0 .3em; } h3{ font-size:1.1rem; margin:.5em 0 .2em; }
p{ margin:.4em 0 .8em; max-width:38em; }
a{ color:var(--primary); }
header.top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; border-bottom:3px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; }
header.top .brand{ font-weight:bold; font-size:1.1rem; margin-right:auto; }
.streak{ font-weight:bold; padding:4px 12px; border:2px solid var(--line); border-radius:10px; }
button, .btn{ font:inherit; font-size:1rem; min-height:60px; padding:12px 20px; border-radius:12px; border:3px solid var(--line);
  background:var(--card); color:var(--text); cursor:pointer; text-align:left; }
button.primary{ background:var(--primary); color:var(--primary-text); border-color:var(--primary); font-weight:bold; }
button.small{ min-height:48px; padding:6px 14px; font-size:.9rem; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:5px solid var(--focus); outline-offset:2px; }
button:disabled{ opacity:.55; cursor:not-allowed; }
.choice:disabled{ opacity:.8; } .choice.correct:disabled, .choice.wrong:disabled, .choice.picked:disabled{ opacity:1; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin:12px 0; }
.tile{ font-size:1.1rem; font-weight:bold; min-height:96px; }
.tile small{ display:block; font-weight:normal; font-size:.85rem; margin-top:4px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:10px 0; }
.card{ background:var(--card); border:3px solid var(--line); border-radius:14px; padding:14px 16px; margin:12px 0; }
.passage{ background:var(--soft); }
.stem{ font-size:1.15rem; font-weight:bold; }
.choices{ display:flex; flex-direction:column; gap:12px; margin:12px 0; }
.choice-row{ display:flex; gap:8px; align-items:stretch; }
.choice{ flex:1; display:flex; gap:14px; align-items:center; font-size:1.05rem; }
.choice .letter{ display:inline-flex; justify-content:center; align-items:center; min-width:46px; height:46px; border-radius:50%;
  border:3px solid var(--line); font-weight:bold; flex-shrink:0; }
.choice.correct{ background:var(--ok-bg); border-color:var(--ok); }
.choice.wrong{ background:var(--bad-bg); border-color:var(--bad); }
.choice.picked{ outline:4px solid var(--primary); }
.say{ min-width:64px; text-align:center; font-weight:bold; font-size:.9rem; }
.say[aria-pressed="true"]{ background:var(--hl); color:#000; }
.w.hl{ background:var(--hl); color:#000; border-radius:4px; box-shadow:0 0 0 3px var(--hl); }
.feedback.ok{ border-color:var(--ok); background:var(--ok-bg); }
.feedback.bad{ border-color:var(--bad); background:var(--bad-bg); }
.big-word{ font-size:1.4rem; font-weight:bold; }
ol.steps{ padding-left:1.6em; } ol.steps li{ margin:.35em 0; }
.timer{ font-size:1.3rem; font-weight:bold; font-variant-numeric:tabular-nums; }
.bar{ height:16px; border:2px solid var(--line); border-radius:8px; overflow:hidden; }
.bar > div{ height:100%; background:var(--primary); transition:width .5s linear; }
.bar.low > div{ background:var(--bad); }
.pill{ display:inline-block; padding:2px 12px; border:2px solid var(--line); border-radius:999px; font-size:.85rem; margin:2px 4px 2px 0; }
.ok-text{ color:var(--ok); font-weight:bold; } .bad-text{ color:var(--bad); font-weight:bold; }
label{ font-weight:bold; display:block; margin:10px 0 4px; }
input[type=text], input[type=password], input[type=url], select, textarea{ font:inherit; font-size:1rem; width:100%; padding:12px; border:3px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); }
textarea{ min-height:140px; }
input[type=range]{ width:100%; height:40px; }
.toggle{ display:flex; gap:12px; align-items:center; font-weight:bold; }
.toggle input{ width:32px; height:32px; }
.chat{ display:flex; flex-direction:column; gap:10px; }
.msg{ border:3px solid var(--line); border-radius:14px; padding:10px 14px; white-space:pre-wrap; }
.msg.me{ background:var(--soft); align-self:flex-end; max-width:90%; }
.msg.bot{ background:var(--card); max-width:95%; }
.notice{ border:3px dashed var(--line); border-radius:12px; padding:10px 14px; margin:10px 0; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:640px){ html{ font-size:20px; } .two-col{ grid-template-columns:1fr; } }
table{ border-collapse:collapse; width:100%; } td,th{ border:2px solid var(--line); padding:8px; text-align:left; }
.listen-dot{ display:inline-block; width:18px; height:18px; border-radius:50%; background:var(--bad); margin-right:8px; animation:pulse 1s infinite; }
@keyframes pulse{ 50%{ opacity:.25; } }
.hidden{ display:none !important; }
svg text{ font-family: Verdana, "DejaVu Sans", Arial, sans-serif; fill:var(--text); }
.it-rule{border-top:2px solid #003A8C;padding-top:8px;margin-top:10px}
.it-rule h3{font-size:1.05rem;margin:4px 0}
.focus-list li{margin:6px 0;line-height:1.5}
.hf-start{display:block;width:100%;font-size:1.6rem;padding:26px 18px;background:#003A8C;color:#fff;border:4px solid #FFD400;border-radius:18px;font-weight:bold}
.hf-start:focus{outline:4px solid #111;outline-offset:3px}
.hf-bar{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#FFD400;color:#111;padding:10px 14px;border-bottom:3px solid #111;font-size:1rem}
.hf-bar.off{display:none}
.hf-bar #hfHeard{flex:1;min-width:160px}
.tap-layer{position:fixed;inset:0;z-index:100;width:100%;height:100%;font-size:2rem;background:rgba(0,58,140,.95);color:#fff;border:0;border-radius:0}
.lad-pre{font-family:Consolas,Menlo,monospace;font-size:1.05rem;background:#F1F0E6;padding:10px;border-radius:8px;overflow-x:auto}
body.dark .lad-pre{background:#222}
.lad-li{margin:6px 0}

</style>
</head>
<body>
<header class="top">
  <span class="brand">ASVAB Coach</span>
  <span class="streak" id="streak" aria-live="polite"></span>
  <button class="small" id="homeBtn" onclick="go('home')">Home</button>
  <button class="small" id="stopTalk" onclick="Speech.stop()">Stop voice</button>
</header>

<script>window.ASVAB_SINGLE_FILE=true;
window.ASVAB_BANK={"version": "2026-10-17b", "title": "ASVAB Coach question bank", "note": "Original ASVAB-style practice questions written to the official content areas (see build/blueprint.md). Not real ASVAB items.", "sections": {"AR": "Arithmetic Reasoning", "WK": "Word Knowledge", "PC": "Paragraph Comprehension", "MK": "Math Knowledge", "GS": "General Science", "EI": "Electronics Information"}, "cat": {"GS": [15, 12], "AR": [15, 55], "WK": [15, 9], "PC": [10, 27], "MK": [15, 31], "EI": [15, 10]}, "lessons": {"ar-rate": {"section": "AR", "name": "Distance, rate, and time", "what": ["Distance is how far you go.", "Rate is how fast. Time is how long."], "why": "AR asks rate questions on almost every test.", "example": ["A ship goes 20 miles each hour.", "After 2 hours, it went 40 miles."], "idea": "Distance equals rate times time. D = R x T.", "worked": ["A truck drives 50 miles per hour for 3 hours.", "Step 1: D = R x T.", "Step 2: D = 50 x 3.", "Step 3: D = 150 miles."]}, "ar-work": {"section": "AR", "name": "Working together", "what": ["Work problems ask how long a job takes.", "Add how much each worker does in 1 hour."], "why": "These are tricky. Many people miss them.", "example": ["You wash half the car in an hour.", "A friend washes the other half in that hour.", "Together you finish in 1 hour."], "idea": "Find the part of the job done in 1 hour. Then flip it.", "worked": ["Pump A fills a tank in 2 hours. Pump B in 2 hours.", "Step 1: Each hour, A does 1/2. B does 1/2.", "Step 2: Together: 1/2 + 1/2 = 1 tank each hour.", "Step 3: Time = 1 hour."]}, "ar-percent": {"section": "AR", "name": "Percents: sales, tax, tips", "what": ["Percent means \"out of 100\".", "25% means 25 out of 100."], "why": "Sales, tax, tips, and pay raises use percents.", "example": ["A $10 meal. You tip 20%.", "20% of 10 is 2. You pay $12."], "idea": "Change the percent to a decimal. Then multiply.", "worked": ["What is 30% of 50?", "Step 1: 30% = 0.30.", "Step 2: 0.30 x 50 = 15.", "Answer: 15."]}, "ar-interest": {"section": "AR", "name": "Simple interest", "what": ["Interest is money paid for using money.", "Simple interest: I = P x r x t."], "why": "Banks and loans use it. AR tests it often.", "example": ["You save $100 at 10% a year.", "After 1 year you earn $10."], "idea": "Interest = principal times rate times time.", "worked": ["$200 at 5% for 2 years.", "Step 1: 5% = 0.05.", "Step 2: 200 x 0.05 = 10 each year.", "Step 3: 10 x 2 years = $20."]}, "ar-ratio": {"section": "AR", "name": "Ratios and proportions", "what": ["A ratio compares two amounts.", "3 to 5 means 3 parts and 5 parts."], "why": "Recipes, maps, and mixes all use ratios.", "example": ["2 scoops of mix for 1 cup of water.", "For 3 cups, use 6 scoops."], "idea": "Add the parts. Find one part. Then multiply.", "worked": ["Red to blue is 1 to 3. There are 20 cars.", "Step 1: 1 + 3 = 4 parts.", "Step 2: 20 / 4 = 5 per part.", "Step 3: Blue = 3 x 5 = 15."]}, "ar-average": {"section": "AR", "name": "Averages", "what": ["The average is the fair share.", "Add them all. Divide by how many."], "why": "Test scores and pay use averages.", "example": ["Three friends have $2, $4, and $6.", "Total $12. Share it 3 ways: $4 each."], "idea": "Average = total divided by how many.", "worked": ["Find the average of 4, 6, and 8.", "Step 1: 4 + 6 + 8 = 18.", "Step 2: 18 / 3 = 6.", "Answer: 6."]}, "ar-units": {"section": "AR", "name": "Units and time", "what": ["Units tell what you measure.", "Hours, minutes, feet, inches, gallons."], "why": "You must match units before you do math.", "example": ["A movie is 2 hours.", "2 x 60 = 120 minutes."], "idea": "Change to the same unit first. 1 hour = 60 minutes. 1 foot = 12 inches.", "worked": ["How many minutes in 1.5 hours?", "Step 1: 1 hour = 60 minutes.", "Step 2: 1.5 x 60 = 90.", "Answer: 90 minutes."]}, "ar-fractions": {"section": "AR", "name": "Fractions in word problems", "what": ["A fraction is a part of a whole.", "3/4 means 3 of 4 equal parts."], "why": "Tanks, books, and pay often use fractions.", "example": ["A pizza has 8 slices.", "You eat 1/4 of it. That is 2 slices."], "idea": "To find a fraction of a number: divide by the bottom. Times the top.", "worked": ["What is 2/3 of 30?", "Step 1: 30 / 3 = 10.", "Step 2: 10 x 2 = 20.", "Answer: 20."]}, "ar-money": {"section": "AR", "name": "Money and totals", "what": ["Many AR problems are shopping math.", "Find the cost of each part. Then add."], "why": "This is the most common AR question.", "example": ["2 sodas at $1.50 each.", "2 x 1.50 = 3.00."], "idea": "Multiply price by how many. Then add or subtract.", "worked": ["3 shirts at $8 each and a hat for $5.", "Step 1: 3 x 8 = 24.", "Step 2: 24 + 5 = 29.", "Answer: $29."]}, "ar-number": {"section": "AR", "name": "Number puzzles", "what": ["Number puzzles describe a number in words.", "Turn the words into math."], "why": "They test clear thinking, not hard math.", "example": ["Two numbers add to 10. They differ by 2.", "The numbers are 6 and 4."], "idea": "Write what you know. Use the middle or the sum.", "worked": ["Three numbers in a row add to 30.", "Step 1: Middle = 30 / 3 = 10.", "Step 2: The numbers are 9, 10, 11.", "Smallest: 9."]}, "ar-geometry": {"section": "AR", "name": "Area and perimeter in word problems", "what": ["Area is the space inside. Perimeter is the edge.", "Area of a rectangle = length x width."], "why": "Paint, carpet, and fences use these.", "example": ["A rug is 3 feet by 2 feet.", "Area: 3 x 2 = 6 square feet."], "idea": "Area = length x width. Perimeter = add all sides.", "worked": ["A room is 10 by 12 feet. Tile covers 20 square feet a box.", "Step 1: Area = 10 x 12 = 120.", "Step 2: 120 / 20 = 6.", "Answer: 6 boxes."]}, "mk-equations": {"section": "MK", "name": "Solving equations", "what": ["An equation is a balance.", "Both sides must stay equal."], "why": "MK has many \"solve for x\" questions.", "example": ["A scale has a box and 2 pounds on one side.", "5 pounds on the other side.", "The box must weigh 3 pounds."], "idea": "Undo the steps. Do the same thing to both sides.", "worked": ["Solve 2x + 4 = 10.", "Step 1: Subtract 4 from both sides. 2x = 6.", "Step 2: Divide both sides by 2. x = 3.", "Check: 2 times 3 plus 4 is 10."]}, "mk-inequalities": {"section": "MK", "name": "Inequalities", "what": ["An inequality uses < or >.", "Solve it like an equation."], "why": "One rule trips people up. Know it.", "example": ["You need more than $5 for lunch.", "Any amount over 5 works."], "idea": "If you multiply or divide by a negative, FLIP the sign.", "worked": ["Solve -3x < 9.", "Step 1: Divide both sides by -3.", "Step 2: Flip the sign: x > -3."]}, "mk-systems": {"section": "MK", "name": "Two equations", "what": ["Two equations, two unknowns.", "Combine them to get one unknown."], "why": "Shows up a few times on MK.", "example": ["Two shirts cost $30. One costs $10 more.", "Prices: $20 and $10."], "idea": "Add or subtract the equations so one letter goes away.", "worked": ["x + y = 8 and x - y = 2.", "Step 1: Add them: 2x = 10.", "Step 2: x = 5.", "Step 3: y = 8 - 5 = 3."]}, "mk-exponents": {"section": "MK", "name": "Exponents and roots", "what": ["An exponent says how many times to multiply.", "3^2 means 3 x 3 = 9."], "why": "Exponents and square roots are common on MK.", "example": ["A square room is 4 feet on a side.", "4^2 = 16 square feet.", "The square root of 16 is 4."], "idea": "Same base: multiply means add powers. Divide means subtract powers.", "worked": ["What is 2^3 x 2^2?", "Step 1: Same base 2. Add powers: 3 + 2 = 5.", "Step 2: 2^5 = 32."]}, "mk-polynomials": {"section": "MK", "name": "Expanding and factoring", "what": ["Expanding multiplies out the parentheses.", "Factoring goes backward."], "why": "MK uses these on harder questions.", "example": ["5 boxes of (2 apples + 3 pears).", "That is 10 apples + 15 pears."], "idea": "Multiply each term by each term (FOIL). To factor, find two numbers that multiply and add.", "worked": ["Expand (x + 1)(x + 4).", "Step 1: x times x = x^2.", "Step 2: x times 4 plus 1 times x = 5x.", "Step 3: 1 times 4 = 4.", "Answer: x^2 + 5x + 4."]}, "mk-quadratics": {"section": "MK", "name": "Quadratic equations", "what": ["A quadratic has an x^2.", "It often has two answers."], "why": "MK asks to solve or factor them.", "example": ["Two numbers multiply to 6 and add to 5.", "They are 2 and 3."], "idea": "Factor. Then set each part equal to zero.", "worked": ["Solve x^2 - 7x + 10 = 0.", "Step 1: Numbers that multiply to 10, add to -7: -2 and -5.", "Step 2: (x - 2)(x - 5) = 0.", "Step 3: x = 2 or x = 5."]}, "mk-functions": {"section": "MK", "name": "Plugging in values", "what": ["f(x) is a rule. Put a number in. Get a number out."], "why": "Plug-in questions are quick points.", "example": ["A rule: double it, then add 1.", "Put in 3. Get 7."], "idea": "Replace x with the number. Then follow order of operations.", "worked": ["If f(x) = x^2 + 1, find f(2).", "Step 1: Put in 2: 2^2 + 1.", "Step 2: 4 + 1 = 5."]}, "mk-area-volume": {"section": "MK", "name": "Area, perimeter, volume", "what": ["Area is flat space inside. Volume is space in 3D.", "Each shape has a formula."], "why": "Geometry is a big part of MK.", "example": ["A shoebox is 10 by 6 by 4 inches.", "Volume: 10 x 6 x 4 = 240 cubic inches."], "idea": "Rectangle: L x W. Triangle: half of base x height. Circle: pi x r^2. Box: L x W x H.", "worked": ["A triangle has base 8 and height 5.", "Step 1: Area = 1/2 x base x height.", "Step 2: 1/2 x 8 x 5 = 20."]}, "mk-triangles-angles": {"section": "MK", "name": "Angles and right triangles", "what": ["A triangle has 180 degrees inside.", "A straight line is 180 degrees.", "Right triangles use a^2 + b^2 = c^2."], "why": "Angle and triangle questions are common.", "example": ["A ladder against a wall makes a right triangle.", "The ladder is the long side."], "idea": "Angles in a triangle add to 180. For a right triangle, a^2 + b^2 = c^2.", "worked": ["Legs are 3 and 4. Find the long side.", "Step 1: 3^2 + 4^2 = 9 + 16 = 25.", "Step 2: Square root of 25 is 5."]}, "mk-fractions": {"section": "MK", "name": "Fractions and decimals", "what": ["Fractions and decimals both show parts.", "0.5 is the same as 1/2."], "why": "MK tests adding, dividing, and changing them.", "example": ["Half a dollar is $0.50.", "A quarter is $0.25, or 1/4."], "idea": "To add: match the bottoms. To divide: flip the second and multiply.", "worked": ["What is 1/2 divided by 1/4?", "Step 1: Flip 1/4 to 4/1.", "Step 2: 1/2 x 4 = 2."]}, "mk-number": {"section": "MK", "name": "Number facts", "what": ["Primes, factors, multiples, order of operations.", "Median, rounding, absolute value."], "why": "These are quick points if you know the rules.", "example": ["12 cookies can be split by 1, 2, 3, 4, 6, or 12.", "Those are the factors of 12."], "idea": "Order of operations: parentheses, exponents, times and divide, then plus and minus.", "worked": ["What is 2 + 3 x 4?", "Step 1: Multiply first: 3 x 4 = 12.", "Step 2: 2 + 12 = 14."]}, "mk-slope": {"section": "MK", "name": "Slope and graphs", "what": ["Slope is how steep a line is.", "Rise over run."], "why": "Lines and points show up on MK.", "example": ["A ramp goes up 1 foot for every 4 feet forward.", "Slope = 1/4."], "idea": "Slope = change in y divided by change in x. In y = mx + b, m is the slope.", "worked": ["Points (1, 1) and (3, 5).", "Step 1: Rise: 5 - 1 = 4.", "Step 2: Run: 3 - 1 = 2.", "Step 3: 4 / 2 = 2."]}, "mk-probability": {"section": "MK", "name": "Probability and counting", "what": ["Probability is the chance something happens.", "Chance = good outcomes / all outcomes."], "why": "One or two MK questions use this.", "example": ["A coin has 2 sides.", "Chance of heads = 1/2."], "idea": "Count the good outcomes. Divide by all outcomes. For two events in a row, multiply.", "worked": ["A bag has 2 red, 3 blue. Pick one.", "Step 1: Good = 2 red.", "Step 2: All = 5.", "Step 3: Chance = 2/5."]}, "wk-context": {"section": "WK", "name": "Word meaning in a sentence", "what": ["You see a word in a sentence.", "Pick the word that means the same."], "why": "WK and PC make up VE. VE counts double for AFQT. It is in every IT line score.", "example": ["\"The soup was SCALDING. I burned my tongue.\"", "The clue \"burned\" tells you: very hot."], "idea": "Use the sentence as a clue. Is the mood good or bad?", "worked": ["\"The trail was ARDUOUS. We were tired.\"", "Step 1: Clue: \"tired\".", "Step 2: Mood: hard, not fun.", "Step 3: ARDUOUS means difficult."]}, "wk-synonym": {"section": "WK", "name": "Word meaning (no sentence)", "what": ["You see a word by itself.", "Pick the word closest in meaning."], "why": "About half the WK words come with no sentence.", "example": ["MERRY means happy.", "You can try \"a merry day\" in a sentence."], "idea": "Make up your own short sentence with the word. Look for word parts.", "worked": ["Word: BENEFIT.", "Step 1: Sentence: \"Sleep is a benefit to health.\"", "Step 2: Word part: \"bene\" means good.", "Step 3: BENEFIT means help or advantage."]}, "pc-main-idea": {"section": "PC", "name": "Main idea", "what": ["The main idea is what the whole passage is about.", "It is the big point, not one detail."], "why": "Almost every PC set has a main idea question.", "example": ["A text says: buy snacks, pick a movie, call friends.", "The main idea: planning a movie night."], "idea": "Ask: what is the one big point? Check the first and last lines.", "worked": ["Passage: \"Dogs need walks. Dogs need food. Dogs need care.\"", "Step 1: Every line is about caring for dogs.", "Step 2: Main idea: dogs need care."]}, "pc-detail": {"section": "PC", "name": "Finding details", "what": ["A detail question asks for one fact.", "The answer is written in the passage."], "why": "Detail questions are the easiest PC points.", "example": ["A sign says: \"Store opens at 9.\"", "Q: When does it open? Find \"9\"."], "idea": "Read the question first. Find the line that answers it.", "worked": ["Passage: \"The ship left at noon. It reached port at 6.\"", "Q: When did it reach port?", "Step 1: Look for \"port\".", "Step 2: The line says 6."]}, "pc-inference": {"section": "PC", "name": "Inference (reading between lines)", "what": ["An inference is not said out loud.", "You figure it out from clues."], "why": "Harder PC questions ask what you can infer.", "example": ["Your friend comes in wet with an umbrella.", "You infer it is raining."], "idea": "Pick the answer the passage supports. Do not add outside ideas.", "worked": ["Passage: \"Sam studied every day. He passed the test easily.\"", "Q: What can you infer?", "Step 1: Clues: studied, passed easily.", "Step 2: Study helped Sam pass."]}, "pc-vocab": {"section": "PC", "name": "Word meaning in a passage", "what": ["Some PC questions ask what a word means.", "The meaning comes from the passage."], "why": "The common meaning may be a trap.", "example": ["\"The coach will FIELD questions.\"", "Here FIELD means answer, not grass."], "idea": "Put each choice in place of the word. Pick the one that fits.", "worked": ["\"The plan was SOUND.\"", "Step 1: Try \"noisy\": does not fit.", "Step 2: Try \"solid and good\": fits.", "Answer: SOUND means solid."]}, "pc-author": {"section": "PC", "name": "Author view, tone, and purpose", "what": ["Tone is how the author feels.", "Purpose is why the author wrote it."], "why": "These test if you understand the writer.", "example": ["A text says: \"Wear a seat belt. It saves lives.\"", "Purpose: to persuade you."], "idea": "Look for feeling words. Ask: why did they write this?", "worked": ["Passage: \"Recycling is simple and helps us all.\"", "Step 1: Feeling words: simple, helps.", "Step 2: The author is in favor of recycling."]}, "pc-sequence": {"section": "PC", "name": "Steps in order", "what": ["Some passages give steps.", "Words like first, next, then, finally show order."], "why": "Tech jobs use step-by-step instructions.", "example": ["First boil water. Next add noodles. Then drain.", "Draining comes last."], "idea": "Find the order words. Number the steps.", "worked": ["\"First save the file. Next close the app. Then restart.\"", "Q: What comes after saving?", "Step 1: Find \"Next\".", "Step 2: Close the app."]}, "gs-human-body": {"section": "GS", "name": "Human body", "what": ["The body has systems.", "Heart and blood, lungs, nerves, bones."], "why": "GS often asks what each organ does.", "example": ["After a run your heart beats fast.", "It pumps more blood to your muscles."], "idea": "Match each organ to its job.", "worked": ["Q: Which organ helps you breathe?", "Step 1: Breathing means air.", "Step 2: Air goes to the lungs.", "Answer: lungs."]}, "gs-cells-life": {"section": "GS", "name": "Cells, plants, and living things", "what": ["All living things are made of cells.", "Plants make food from light."], "why": "Life science is a big part of GS.", "example": ["A houseplant by a window grows toward the light.", "It uses light to make food."], "idea": "Know the cell parts and how plants make food (photosynthesis).", "worked": ["Q: What part of a cell makes energy?", "Step 1: Energy = power plant.", "Step 2: The mitochondria is the power plant."]}, "gs-earth-space": {"section": "GS", "name": "Earth and space", "what": ["Earth science covers rocks, weather, and planets."], "why": "A few GS questions each test.", "example": ["Summer is warm because sunlight hits more directly.", "That comes from the tilt of Earth."], "idea": "Know the planets in order, the rock types, and the layers of air.", "worked": ["Q: Which planet is biggest?", "Step 1: The gas giants are big.", "Step 2: Jupiter is the biggest."]}, "gs-chemistry": {"section": "GS", "name": "Matter and chemistry", "what": ["Matter is anything with mass.", "Atoms make up elements. Elements join into compounds."], "why": "GS asks about atoms, pH, and changes of state.", "example": ["Ice melts into water. Same stuff, new form.", "That is a physical change."], "idea": "Physical change: same stuff. Chemical change: new stuff. pH under 7 is acid.", "worked": ["Q: Is burning wood a chemical change?", "Step 1: Ash and smoke are new stuff.", "Step 2: Yes, it is chemical."]}, "gs-physics": {"section": "GS", "name": "Force, energy, heat, sound, light", "what": ["Physics explains motion, energy, heat, sound, and light."], "why": "Physics also helps on EI and MC tests.", "example": ["Pushing a cart: the harder you push, the faster it goes.", "That is force."], "idea": "Know Newton's three laws and how heat moves: conduction, convection, radiation.", "worked": ["Q: A pan handle gets hot on the stove. Why?", "Step 1: Heat moves through touch.", "Step 2: That is conduction."]}, "ei-basics": {"section": "EI", "name": "Current, voltage, resistance", "what": ["Voltage is the push. Current is the flow.", "Resistance slows the flow."], "why": "EI is in the main 4-year IT rule: AR + MK + EI + VE.", "example": ["A garden hose: water pressure is voltage.", "The water flow is current. A kink is resistance."], "idea": "Volts measure push. Amps measure flow. Ohms measure resistance. Kilo = 1,000. Milli = 1/1,000.", "worked": ["Change 2.2 kilohms to ohms.", "Step 1: Kilo means 1,000.", "Step 2: 2.2 x 1,000 = 2,200 ohms."]}, "ei-ohms-law": {"section": "EI", "name": "Ohm's law", "what": ["Ohm's law links volts, amps, and ohms.", "V = I x R."], "why": "Ohm's law questions show up on almost every EI test.", "example": ["A 9 volt battery and a 3 ohm part.", "9 divided by 3 = 3 amps of flow."], "idea": "V = I x R. So I = V / R, and R = V / I.", "worked": ["A 24 volt source and a 6 ohm resistor. Find the current.", "Step 1: I = V / R.", "Step 2: I = 24 / 6.", "Step 3: I = 4 amps."]}, "ei-power": {"section": "EI", "name": "Electric power and energy", "what": ["Power is how fast energy is used.", "Power is measured in watts."], "why": "Power and energy questions are quick EI points.", "example": ["A 100 watt bulb uses more power than a 10 watt LED.", "Run it 10 hours: 1,000 watt-hours = 1 kWh."], "idea": "P = V x I. Also P = I x I x R. Energy = power x time.", "worked": ["A 12 volt fan draws 3 amps. Find the power.", "Step 1: P = V x I.", "Step 2: 12 x 3 = 36 watts."]}, "ei-series-parallel": {"section": "EI", "name": "Series and parallel circuits", "what": ["Series: one path. Parallel: many paths."], "why": "EI asks to add resistors and compare circuits.", "example": ["Old holiday lights were in series. One bulb out, all out.", "House outlets are in parallel. Each works alone."], "idea": "Series: add the resistors. Parallel: product over sum. Two equal ones: divide by 2.", "worked": ["A 6 ohm and a 12 ohm resistor in parallel.", "Step 1: Product: 6 x 12 = 72.", "Step 2: Sum: 6 + 12 = 18.", "Step 3: 72 / 18 = 4 ohms."]}, "ei-ac-dc": {"section": "EI", "name": "AC and DC", "what": ["DC flows one way, like from a battery.", "AC flips direction many times a second."], "why": "Know which is which, and what hertz means.", "example": ["A phone battery gives DC.", "A wall outlet gives AC at 60 hertz."], "idea": "AC = alternating current. DC = direct current. Hertz = cycles per second.", "worked": ["Q: A car battery gives which kind?", "Step 1: Batteries push current one way.", "Step 2: One way means DC."]}, "ei-components": {"section": "EI", "name": "Electronic parts", "what": ["Each part has one main job.", "Resistor limits. Capacitor stores charge. Diode is one-way."], "why": "EI asks what each part does.", "example": ["A fuse is like a safety valve.", "Too much current melts it and stops the flow."], "idea": "Resistor: limits current. Capacitor: stores charge. Diode: one way. Transistor: switch or amplifier. Transformer: changes AC voltage.", "worked": ["Q: Which part changes AC to DC?", "Step 1: AC to DC needs one-way flow.", "Step 2: Diodes are one-way.", "Step 3: A rectifier (made of diodes)."]}, "ei-symbols-tools": {"section": "EI", "name": "Meters, symbols, and tools", "what": ["Meters measure the circuit.", "Schematics use symbols for parts."], "why": "Tools and symbols are an official EI area.", "example": ["A voltmeter is like a pressure gauge.", "It checks the push across a part."], "idea": "Ammeter: in series. Voltmeter: in parallel. Ohmmeter: resistance. Zigzag: resistor. Long and short lines: battery.", "worked": ["Q: How do you hook up an ammeter?", "Step 1: It measures flow through the wire.", "Step 2: The current must pass through it.", "Step 3: In series."]}, "ei-magnetism": {"section": "EI", "name": "Magnetism, motors, generators", "what": ["Current makes a magnetic field.", "A moving magnet can make current."], "why": "Motors, generators, relays, and transformers all use magnetism.", "example": ["A fridge magnet sticks to the steel door.", "Like poles push apart. Opposites pull."], "idea": "Like poles repel. Motor: electricity to motion. Generator: motion to electricity.", "worked": ["Q: What does a generator do?", "Step 1: Something spins it.", "Step 2: Spinning is motion.", "Step 3: It turns motion into electricity."]}, "ei-materials": {"section": "EI", "name": "Conductors and insulators", "what": ["Conductors let current flow. Insulators block it."], "why": "Safety and wiring questions use this.", "example": ["Copper wire carries the current.", "The plastic cover keeps it from shocking you."], "idea": "Metals conduct: silver, copper, gold, aluminum. Insulators: rubber, glass, plastic, dry wood. Silicon is a semiconductor.", "worked": ["Q: Which is the best insulator: copper, iron, or glass?", "Step 1: Copper and iron are metals.", "Step 2: Metals conduct.", "Step 3: Glass is the insulator."]}}, "questions": [{"id": "AR-001", "section": "AR", "stem": "Sam buys 3 notebooks at $2.50 each and one pen for $1.25. What is the total cost?", "choices": ["$8.75", "$10.00", "$7.50", "$9.75"], "answer": 0, "difficulty": 1, "topic": "ar-money", "steps": ["The idea: Multiply price by how many. Then add or subtract.", "3 x 2.50 = 7.50.", "Add 1.25.", "Total 8.75.", "Answer: $8.75."], "explanation": "3 x 2.50 = 7.50. Add 1.25. Total 8.75.", "source": "study-pack:quiz"}, {"id": "AR-002", "section": "AR", "stem": "A car drives at 55 miles per hour for 4 hours. How far does it go?", "choices": ["165 miles", "220 miles", "59 miles", "275 miles"], "answer": 1, "difficulty": 1, "topic": "ar-rate", "steps": ["The idea: Distance equals rate times time. D = R x T.", "Distance = rate x time.", "55 x 4 = 220.", "Answer: 220 miles."], "explanation": "Distance = rate x time. 55 x 4 = 220.", "source": "study-pack:quiz"}, {"id": "AR-003", "section": "AR", "stem": "A ship has 80 sailors. 25% of them are on watch. How many sailors are on watch?", "choices": ["55", "200", "20", "25"], "answer": 2, "difficulty": 1, "topic": "ar-percent", "steps": ["The idea: Change the percent to a decimal. Then multiply.", "25% = 1/4.", "80 / 4 = 20.", "Answer: 20."], "explanation": "25% = 1/4. 80 / 4 = 20.", "source": "study-pack:quiz"}, {"id": "AR-004", "section": "AR", "stem": "A recipe uses 2 cups of flour for 12 cookies. How many cups are needed for 36 cookies?", "choices": ["4 cups", "8 cups", "12 cups", "6 cups"], "answer": 3, "difficulty": 1, "topic": "ar-ratio", "steps": ["The idea: Add the parts. Find one part. Then multiply.", "36 is 3 times 12.", "So 2 x 3 = 6 cups.", "Answer: 6 cups."], "explanation": "36 is 3 times 12. So 2 x 3 = 6 cups.", "source": "study-pack:quiz"}, {"id": "AR-005", "section": "AR", "stem": "Five sailors score 70, 80, 90, 100, and 60 on a test. What is their average score?", "choices": ["85", "80", "90", "70"], "answer": 1, "difficulty": 1, "topic": "ar-average", "steps": ["The idea: Average = total divided by how many.", "Sum = 400.", "Divide by 5 = 80.", "Answer: 80."], "explanation": "Sum = 400. Divide by 5 = 80.", "source": "study-pack:quiz"}, {"id": "AR-006", "section": "AR", "stem": "A train goes 150 miles in 2.5 hours. What is its speed?", "choices": ["60 mph", "65 mph", "50 mph", "375 mph"], "answer": 0, "difficulty": 1, "topic": "ar-rate", "steps": ["The idea: Distance equals rate times time. D = R x T.", "Speed = distance / time.", "150 / 2.5 = 60.", "Answer: 60 mph."], "explanation": "Speed = distance / time. 150 / 2.5 = 60.", "source": "study-pack:quiz"}, {"id": "AR-007", "section": "AR", "stem": "A shirt costs $40. It is on sale for 20% off. What is the sale price?", "choices": ["$38.00", "$8.00", "$32.00", "$20.00"], "answer": 2, "difficulty": 1, "topic": "ar-percent", "steps": ["The idea: Change the percent to a decimal. Then multiply.", "20% of 40 = 8.", "40 - 8 = 32.", "Answer: $32.00."], "explanation": "20% of 40 = 8. 40 - 8 = 32.", "source": "study-pack:quiz"}, {"id": "AR-008", "section": "AR", "stem": "The ratio of boys to girls in a club is 3 to 5. There are 24 students. How many are boys?", "choices": ["8", "10", "15", "9"], "answer": 3, "difficulty": 1, "topic": "ar-ratio", "steps": ["The idea: Add the parts. Find one part. Then multiply.", "3 + 5 = 8 parts.", "24 / 8 = 3 per part.", "3 x 3 = 9.", "Answer: 9."], "explanation": "3 + 5 = 8 parts. 24 / 8 = 3 per part. 3 x 3 = 9.", "source": "study-pack:quiz"}, {"id": "AR-009", "section": "AR", "stem": "Dana earns $12 per hour. She works 8 hours a day for 5 days. How much does she earn?", "choices": ["$480", "$60", "$440", "$96"], "answer": 0, "difficulty": 1, "topic": "ar-money", "steps": ["The idea: Multiply price by how many. Then add or subtract.", "12 x 8 = 96 a day.", "96 x 5 = 480.", "Answer: $480."], "explanation": "12 x 8 = 96 a day. 96 x 5 = 480.", "source": "study-pack:quiz"}, {"id": "AR-010", "section": "AR", "stem": "A training class lasts 3.5 hours. How many minutes long is the class?", "choices": ["350", "180", "200", "210"], "answer": 3, "difficulty": 1, "topic": "ar-units", "steps": ["The idea: Change to the same unit first. 1 hour = 60 minutes. 1 foot = 12 inches.", "3.5 x 60 = 210 minutes.", "Answer: 210."], "explanation": "3.5 x 60 = 210 minutes.", "source": "study-pack:quiz"}, {"id": "AR-011", "section": "AR", "stem" thicker.", "It makes more current.", "Its wire melts and opens the circuit.", "It changes the voltage."], "answer": 2, "difficulty": 1, "topic": "pc-detail", "steps": ["Read the question first. What type is it? Finding details.", "Find the line in the passage that answers it.", "The passage says the thin wire melts, which opens the circuit.", "Answer: Its wire melts and opens the circuit."], "explanation": "The passage says the thin wire melts, which opens the circuit.", "source": "study-pack:readiness", "passage": "A fuse protects a circuit.\nIt has a thin wire that melts when too much current flows.\nWhen it melts, the circuit opens and the current stops.\nThis keeps the wires from overheating.\nA blown fuse must be replaced after the problem is fixed.", "passageId": "P10"}, {"id": "PC-029", "section": "PC", "stem": "What is the main idea of the passage?", "choices": ["Wires never overheat.", "Fuses are always cheap.", "Circuits should stay open.", "A fuse protects a circuit from too much current."], "answer": 3, "difficulty": 2, "topic": "pc-main-idea", "steps": ["Read the question first. What type is it? Main idea.", "Find the line in the passage that answers it.", "The first sentence says the fuse protects the circuit.", "Answer: A fuse protects a circuit from too much current."], "explanation": "The first sentence says the fuse protects the circuit.", "source": "study-pack:readiness", "passage": "A fuse protects a circuit.\nIt has a thin wire that melts when too much current flows.\nWhen it melts, the circuit opens and the current stops.\nThis keeps the wires from overheating.\nA blown fuse must be replaced after the problem is fixed.", "passageId": "P10"}, {"id": "PC-031", "section": "PC", "stem": "How did Ana feel by lunch?", "choices": ["Much calmer", "Very tired", "More nervous", "Angry"], "answer": 0, "difficulty": 1, "topic": "pc-detail", "steps": ["Read the question first. What type is it? Finding details.", "Find the line in the passage that answers it.", "The last sentence says she felt much calmer.", "Answer: Much calmer."], "explanation": "The last sentence says she felt much calmer.", "source": "study-pack:readiness", "passage": "Ana was nervous before her first day on the job.\nShe had practiced her greeting in the mirror twice.\nWhen she arrived, a coworker smiled and showed her around.\nBy lunch, she felt much calmer.", "passageId": "P11"}, {"id": "PC-033", "section": "PC", "stem": "What is the main idea of the passage?", "choices": ["Nobody should work at night.", "Night workers risk mistakes from fatigue.", "Breaks cause mistakes.", "Caffeine replaces sleep."], "answer": 1, "difficulty": 2, "topic": "pc-main-idea", "steps": ["Read the question first. What type is it? Main idea.", "Find the line in the passage that answers it.", "The passage warns that fatigue is a danger for night workers.", "Answer: Night workers risk mistakes from fatigue."], "explanation": "The passage warns that fatigue is a danger for night workers.", "source": "study-pack:readiness", "passage": "Fatigue is a hidden danger for people who work at night.\nA tired person reacts more slowly and makes more mistakes.\nRegular breaks and a good sleep plan help.\nCaffeine can help for a short time, but it does not replace sleep.", "passageId": "P12"}, {"id": "PC-034", "section": "PC", "stem": "According to the passage, caffeine:", "choices": ["makes people slower", "is a good sleep plan", "replaces sleep", "helps for a short time only"], "answer": 3, "difficulty": 1, "topic": "pc-detail", "steps": ["Read the question first. What type is it? Finding details.", "Find the line in the passage that answers it.", "The last sentence says caffeine helps briefly but does not replace sleep.", "Answer: helps for a short time only."], "explanation": "The last sentence says caffeine helps briefly but does not replace sleep.", "source": "study-pack:readiness", "passage": "Fatigue is a hidden danger for people who work at night.\nA tired person reacts more slowly and makes more mistakes.\nRegular breaks and a good sleep plan help.\nCaffeine can help for a short time, but it does not replace sleep.", "passageId": "P12"}, {"id": "PC-035", "section": "PC", "stem": "What is the main idea of the passage?", "choices": ["Labeling cables saves time in the long run.", "Crowded rooms are unsafe.", "Technicians work too slowly.", "Cables should be hidden."], "answer": 0, "difficulty": 2, "topic": "pc-main-idea", "steps": ["Read the question first. What type is it? Main idea.", "Find the line in the passage that answers it.", "The passage says labels take a little time but save much more later.", "Answer: Labeling cables saves time in the long run."], "explanation": "The passage says labels take a little time but save much more later.", "source": "study-pack:practice-PC1", "passage": "Labeling cables takes a little time. But it saves much more time later. A technician who finds an unmarked cable must trace it by hand. This can take an hour in a crowded room. A clear label at each end shows where the cable goes in seconds.", "passageId": "P13"}, {"id": "PC-036", "section": "PC", "stem": "According to the passage, how must a technician find an unmarked cable?", "choices": ["By calling the user", "By cutting it", "By reading a manual", "By tracing it by hand"], "answer": 3, "difficulty": 1, "topic": "pc-detail", "steps": ["Read the question first. What type is it? Finding details.", "Find the line in the passage that answers it.", "The passage says the tech must trace it by hand.", "Answer: By tracing it by hand."], "explanation": "The passage says the tech must trace it by hand.", "source": "study-pack:practice-PC1", "passage": "Labeling cables takes a little time. But it saves much more time later. A technician who finds an unmarked cable must trace it by hand. This can take an hour in a crowded room. A clear label at each end shows where the cable goes in seconds.", "passageId": "P13"}, {"id": "PC-038", "section": "PC", "stem": e is it? Main idea.", "Find the line in the passage that answers it.", "The passage says exercise helps mind and body, and a walk can add energy.", "Answer: Exercise can help the mind and give energy."], "explanation": "The passage says exercise helps mind and body, and a walk can add energy.", "source": "study-pack:practice-PC2", "passage": "Exercise helps the mind as well as the body. A brisk walk can lift a person's mood within minutes. Over time, regular exercise can also improve sleep. Yet many people skip exercise because they feel too tired. Ironically, a short walk often gives them more energy, not less.", "passageId": "P15"}, {"id": "PC-041", "section": "PC", "stem": "In the passage, the word IRONICALLY signals that the result is:", "choices": ["hard to measure", "the opposite of what people expect", "well known by all", "very slow"], "answer": 1, "difficulty": 2, "topic": "pc-vocab", "steps": ["Read the question first. What type is it? Word meaning in a passage.", "Find the line in the passage that answers it.", "People expect to feel more tired, but they feel more energy.", "Answer: the opposite of what people expect."], "explanation": "People expect to feel more tired, but they feel more energy.", "source": "study-pack:practice-PC2", "passage": "Exercise helps the mind as well as the body. A brisk walk can lift a person's mood within minutes. Over time, regular exercise can also improve sleep. Yet many people skip exercise because they feel too tired. Ironically, a short walk often gives them more energy, not less.", "passageId": "P15"}, {"id": "PC-042", "section": "PC", "stem": "Which statement would the author most likely agree with?", "choices": ["A walk should last all day.", "Walking is only for young people.", "A tired person may feel better after a short walk.", "Exercise is bad for sleep."], "answer": 2, "difficulty": 3, "topic": "pc-inference", "steps": ["Read the question first. What type is it? Inference (reading between lines).", "Find the line in the passage that answers it.", "The last sentence supports this idea.", "Answer: A tired person may feel better after a short walk."], "explanation": "The last sentence supports this idea.", "source": "study-pack:practice-PC2", "passage": "Exercise helps the mind as well as the body. A brisk walk can lift a person's mood within minutes. Over time, regular exercise can also improve sleep. Yet many people skip exercise because they feel too tired. Ironically, a short walk often gives them more energy, not less.", "passageId": "P15"}, {"id": "PC-043", "section": "PC", "stem": "What happens to the liquid in the tube when heat rises?", "choices": ["It turns to gas at once.", "It stays the same.", "It shrinks and falls.", "It expands and climbs."], "answer": 3, "difficulty": 1, "topic": "pc-detail", "steps": ["Read the question first. What type is it? Finding details.", "Find the line in the passage that answers it.", "The passage says the liquid expands and climbs the tube.", "Answer: It expands and climbs."], "explanation": "The passage says the liquid expands and climbs the tube.", "source": "study-pack:practice-PC2", "passage": "A thermometer measures temperature. Most home thermometers use a thin tube of liquid. When heat rises, the liquid expands and climbs the tube. When it cools, the liquid shrinks and falls. Marks along the tube let people read the temperature.", "passageId": "P16"}, {"id": "PC-045", "section": "PC", "stem": "What is the main idea of the passage?", "choices": ["Teams need no leader.", "Good leaders listen before they decide.", "Problems fix themselves.", "Leaders should give orders fast."], "answer": 1, "difficulty": 2, "topic": "pc-main-idea", "steps": ["Read the question first. What type is it? Main idea.", "Find the line in the passage that answers it.", "The first sentence and the rest support this idea.", "Answer: Good leaders listen before they decide."], "explanation": "The first sentence and the rest support this idea.", "source": " ns before giving orders. This shows respect and often reveals facts the leader did not know. Then the leader can choose a better plan. Teams with listening leaders usually trust them more.", "passageId": "P17"}, {"id": "PC-048", "section": "PC", "stem": "According to the passage, what makes batteries lose power faster?", "choices": ["Heat", "Darkness", "Dry air", "Cold"], "answer": 0, "difficulty": 1, "topic": "pc-detail", "steps": ["Read the question first. What type is it? Finding details.", "Find the line in the passage that answers it.", "The passage says heat makes the loss worse.", "Answer: Heat."], "explanation": "The passage says heat makes the loss worse.", "source": "study-pack:practice-PC3", "passage": "Most batteries slowly lose power when they sit in storage. Heat makes this loss worse. For this reason, spare batteries should be kept in a cool, dry place. Before using a spare, check the date printed on the package.", "passageId": "P18"}, {"id": "PC-049", "section": "PC", "stem": "What should a person check on a spare battery before using it?", "choices": ["The color", "The brand name", "The weight", "The date on the package"], "answer": 3, "difficulty": 1, "topic": "pc-detail", "steps": ["Read the question first. What type is it? Finding details.", "Find the line in the passage that answers it.", "The last sentence says to check the printed date.", "Answer: The date on the package."], "explanation": "The last sentence says to check the printed date.", "source": "study-pack:practice-PC3", "passage": "Most batteries slowly lose power when they sit in storage. Heat makes this loss worse. For this reason, spare batteries should be kept in a cool, dry place. Before using a spare, check the date printed on the package.", "passageId": "P18"}, {"id": "PC-050", "section": "PC", "stem": "What is the main idea of the passage?", "choices": ["Good backups protect data from loss.", "Viruses cannot harm backups.", "Fires are the main cause of lost files.", "Offices should stop using computers."], "answer": 0, "difficulty": 2, "topic": "pc-main-idea", "steps": ["Read the question first. What type is it? Main idea.", "Find the line in the passage that answers it.", "Every line is about backups and keeping data safe.", "Answer: Good backups protect data from loss."], "explanation": "Every line is about backups and keeping data safe.", "source": "new-original", "passage": "Many offices lose files because no one makes backups. A backup is a copy of data kept in a second place. Experts suggest the 3-2-1 rule. Keep three copies of important data, on two kinds of storage, with one copy off site. If a fire or a virus hits the office, the off-site copy is still safe. A backup only helps if it works. So technicians should test it by restoring a few files each month.", "passageId": "P19"}, {"id": "PC-052", "section": "PC", "stem": "Why should one copy be kept off site?", "choices": ["So it opens faster.", "So it stays safe if the office is damaged.", "So it costs less.", "So no one has to test it."], "answer": 1, "difficulty": 2, "topic": "pc-detail", "steps": ["Read the question first. What type is it? Finding details.", "Find the line in the passage that answers it.", "The passage says the off-site copy is safe from a fire or virus at the office.", "Answer: So it stays safe if the office is damaged."], "explanation": "The passage says the off-site copy is safe from a fire or virus at the office.", "source": "new-original", "passage": "Many offices lose files because no one makes backups. A backup is a copy of data kept in a second place. Experts suggest the 3-2-1 rule. Keep three copies of important data, on two kinds of storage, with one copy off site. If a fire or a virus hits the office, the off-site copy is still safe. A backup only helps if it works. So technicians should test it by restoring a few files each month.", "passageId": "P19"}, {"id": "PC-054", "section": "PC", "stem": "The passage mainly describes:", "choices": ["how bees build a hive", "why bees sting", "how flowers make honey", "how bees share where food is"], "answer": 3, "difficulty": 2, "topic": "pc-main-idea", "steps": ["Read the question first. What type is it? Main idea.", "Find the line in the passage that answers it.", "The whole passage explains the dance that shows other bees where food is.", "Answer: how bees share where food is."], "explanation": "The whole passage explains the dance that shows other bees where food is.", "source": "new-original", "passage": "Honeybees tell each other where to find food by dancing. When a worker bee finds flowers, it returns to the hive. Then it moves in a figure-eight pattern and waggles its body. The direction of the dance points toward the food. The longer the bee waggles, the farther away the flowers are. Other bees watch the dance and then fly to the spot.", "passageId": "P20"}, {"id": "PC-055", "section": "PC", "stem": "A bee that waggles for a long time is most likely showing that the flowers are:", "choices": ["almost gone", "far away", "a new color", "close by"], "answer": 1, "difficulty": 3, "topic": "pc-inference", "steps": ["Read the question first. What type is it? Inference (reading between lines).", "Find the line in the passage that answers it.", "The passage says a longer waggle means the flowers are farther away.", "Answer: far away."], "explanation": "The passage says a longer waggle means the flowers are farther away.", "source": "new-original", "passage": "Honeybees tell each other where to find food by dancing. When a worker bee finds flowers, it returns to the hive. Then it moves in a figure-eight pattern and waggles its body. The direction of the dance points toward the food. The longer the bee waggles, the farther away the flowers are. Other bees watch the dance and then fly to the spot.", "passageId": "P20"}, {"id": "PC-056", "section": "PC", "stem": "What does the direction of the dance show?", "choices": ["Which way the food is", "How much honey is left", "How many bees should go", "What time it is"], "answer": 0, "difficulty": 1, "topic": "pc-detail", "steps": ["Read the question first. What type is it? Finding details.", "Find the line in the passage that answers it.", "The passage says the direction of the dance points toward the food.", "Answer: Which way the food is."], "explanation": "The passage says the direction of the dance points toward the food.", "source": "new-original", "passage": "Honeybees tell each other where to find food by dancing. When a worker bee finds flowers, it returns to the hive. Then it moves in a figure-eight pattern and waggles its body. The direction of the dance points toward the food. The longer the bee waggles, the farther away the flowers are. Other bees watch the dance and then fly to the spot.", "passageId": "P20"}, {"id": "PC-057", "section": "PC", "stem": "What is the author's main point?", "choices": ["Sailors should work alone.", "Pumps fail often at sea.", "Strong people never need help.", "Asking for help early makes a team stronger."], "answer": 3, "difficulty": 2, "topic": "pc-main-idea", "steps": ["Read the question first. What type is it? Main idea.", "Find the line in the passage that answers it.", "The author says asking for help is not weak. It helps the team fix problems early.", "Answer: Asking for help early makes a team stronger."], "explanation": "The author says asking for help is not weak. It helps the team fix problems early.", "source": "new-original", "passage": "Some people think asking for help is a sign of weakness. In fact, the opposite is often true. Strong teams depend on members who speak up when they are stuck. A sailor who hides a problem with a pump may cause a bigger failure later. A sailor who asks early lets the team fix it while it is still small.", "passageId": "P21"}, {"id": "PC-058", "section": "PC", "stem": "In the passage, the word DEPEND most nearly means:", "choices": ["leave", "wait", "rely", "argue"], "answer": 2, "difficulty": 2, "top irst. What type is it? Author view, tone, and purpose.", "Find the line in the passage that answers it.", "The passage is a set of steps in order: first, next, then, finally.", "Answer: give steps for replacing a battery."], "explanation": "The passage is a set of steps in order: first, next, then, finally.", "source": "new-original", "passage": "Before you replace a laptop battery, shut the computer down fully. Next, unplug the power cord and any cables. Then turn the laptop over and remove the screws on the battery cover. Lift out the old battery and set the new one in place. Finally, replace the cover. Charge the new battery for several hours before first use.", "passageId": "P22"}, {"id": "PC-063", "section": "PC", "stem": "According to the passage, Naval Station Norfolk is:", "choices": ["a small training school", "a base for only aircraft", "the largest naval base in the world", "the oldest city in Virginia"], "answer": 2, "difficulty": 1, "topic": "pc-detail", "steps": ["Read the question first. What type is it? Finding details.", "Find the line in the passage that answers it.", "The first sentence says it is the largest naval base in the world.", "Answer: the largest naval base in the world."], "explanation": "The first sentence says it is the largest naval base in the world.", "source": "new-original", "passage": "Norfolk, Virginia, is home to the largest naval base in the world. Naval Station Norfolk supports dozens of ships and many aircraft squadrons. Tens of thousands of sailors and civilians work there. Because the base is so big, the city's shops, schools, and roads are planned around it.", "passageId": "P23"}, {"id": "PC-064", "section": "PC", "stem": "In the passage, the word SUPPORTS most nearly means:", "choices": ["holds up", "pays for", "takes care of", "argues for"], "answer": 2, "difficulty": 3, "topic": "pc-vocab", "steps": ["Read the question first. What type is it? Word meaning in a passage.", "Find the line in the passage that answers it." de toward the bridge is best described as", "choices": ["neutral", "doubtful", "approving", "angry"], "answer": 2, "difficulty": 2, "topic": "pc-author", "steps": ["Read the question first. What type is it? Author view, tone, and purpose.", "Find the line in the passage that answers it.", "The author says traffic moves better and calls the bridge a necessity. That is approval.", "Answer: approving."], "explanation": "The author says traffic moves better and calls the bridge a necessity. That is approval.", "source": "new-original-audit", "passage": "Critics called the new bridge a waste of money when it was first proposed. Ten years later, the same critics drive across it every morning, and traffic downtown has never moved more smoothly. The bridge, it turns out, was not a luxury but a necessity.", "passageId": "P25"}, {"id": "PC-069", "section": "PC", "stem": "As used in the passage, LUXURY means something that is", "choices": ["dangerous to use", "nice to have but not needed", "costly to repair", "required by law"], "answer": 1, "difficulty": 3, "topic": "pc-vocab", "steps": ["Read the question first. What type is it? Word meaning in a passage.", "Find the line in the passage that answers it.", "Luxury is set against necessity. So it means something extra, not needed.", "Answer: nice to have but not needed."], "explanation": "Luxury is set against necessity. So it means something extra, not needed.", "source": "new-original-audit", "passage": "Critics called the new bridge a waste of money when it was first proposed. Ten years later, the same critics drive across it every morning, and traffic downtown has never moved more smoothly. The bridge, it turns out, was not a luxury but a necessity.", "passageId": "P25"}, {"id": "PC-070", "section": "PC", "stem": "What do sailors do right after hearing the announcement?", "choices": ["Leave the ship", "Take a head count", "Go to their assigned stations", "Begin their tasks"], "answer": 2, "difficulty": 1, "topic": "pc-sequence", "steps": ["Read the question first. What type is it? Steps in order.", "Find the line in the passage that answers it.", "The word then comes after the announcement. Sailors go to their stations.", "Answer: Go to their assigned stations."], "explanation": "The word then comes after the announcement. Sailors go to their stations.", "source": "new-original-audit", "passage": "When the general alarm sounds, sailors first stop what they are doing and listen for the announcement. The announcement gives the type and place of the emergency. Sailors then go to their assigned stations by the fastest safe route. Once there, they report to the section leader, who takes a head count. Only after every sailor is accounted for does the team begin its tasks.", "passageId": "P26"}, {"id": "PC-071", "section": "PC", "stem": "What must happen before the team begins its tasks?", "choices": ["The leader must write a report.", "Every sailor must be accounted for.", "The ship must reach port.", "The alarm must stop."], "answer": 1, "difficulty": 2, "topic": "pc-sequence", "steps": ["Read the question first. What type is it? Steps in order.", "Find the line in the passage that answers it.", "The last sentence says tasks begin only after everyone is accounted for.", "Answer: Every sailor must be accounted for."], "explanation": "The last sentence says tasks begin only after everyone is accounted for.", "source": "new-original-audit", "passage": "When the general alarm sounds, sailors first stop what they are doing and listen for the announcement. The announcement gives the type and place of the emergency. Sailors then go to their assigned stations by the fastest safe route. Once there, they report to the section leader, who takes a head count. Only after every sailor is accounted for does the team begin its tasks.", "passageId": "P26"}, {"id": "PC-072", "section": "PC", "stem": "The head count is most likely done to", "choices": ["choose a new leader", "make sure no one is missing", " show that firewalls are people"], "answer": 2, "difficulty": 3, "topic": "pc-author", "steps": ["Read the question first. What type is it? Author view, tone, and purpose.", "Find the line in the passage that answers it.", "A guard is easy to picture. The comparison helps explain what a firewall does.", "Answer: explain an idea using something familiar."], "explanation": "A guard is easy to picture. The comparison helps explain what a firewall does.", "source": "new-original-audit", "passage": "A firewall acts like a guard at the gate of a network. It checks each piece of incoming data against a set of rules and blocks anything that breaks them. A well-set firewall stops many attacks before they start. But it cannot protect against a user who willingly opens a harmful attachment. For that reason, training people is as important as installing equipment.", "passageId": "P28"}, {"id": "PC-079", "section": "PC", "stem": "The phrase \"crystal clear\" suggests that his messages were", "choices": ["very loud", "hard to hear", "made of glass", "easy to understand"], "answer": 3, "difficulty": 2, "topic": "pc-vocab", "steps": ["Read the question first. What type is it? Word meaning in a passage.", "Find the line in the passage that answers it.", "Crystal clear is a figure of speech. It means very easy to understand.", "Answer: easy to understand."], "explanation": "Crystal clear is a figure of speech. It means very easy to understand.", "source": "new-original-audit", "passage": "The old radio operator had a voice like gravel, but his messages were always crystal clear. Young sailors who doubted him soon learned to copy his slow, careful way of speaking.", "passageId": "P29"}, {"id": "PC-080", "section": "PC", "stem": "Why did many code talkers not talk about their work until 1968?", "choices": ["They were not allowed to speak Navajo.", "They forgot what they did.", "The program was kept secret until then.", "The code was broken in 1968."], "answer": 2, "difficulty": 2, "topic": "pc-inference", "steps": ["Read the question first. What type is it? Inference (reading between lines).", "Find the line in the passage that answers it.", "Declassified means no longer secret. So it was secret before 1968.", "Answer: The program was kept secret until then."], "explanation": "Declassified means no longer secret. So it was secret before 1968.", "source": "new-original-audit", "passage": "In 1942, the Marine Corps began training Navajo speakers to send messages in a code based on their language. The code was never broken during the war. Many of the code talkers did not speak publicly about their work until the program was declassified in 1968.", "passageId": "P30"}, {"id": "PC-081", "section": "PC", "stem": "The passage is mainly written to", "choices": ["argue that codes are useless", "teach readers the Navajo language", "describe a little-known part of history", "explain how radios work"], "answer": 2, "difficulty": 2, "topic": "pc-author", "steps": ["Read the question first. What type is it? Author view, tone, and purpose.", "Find the line in the passage that answers it.", "The passage tells a true story from the war. Its purpose is to inform about history.", "Answer: describe a little-known part of history."], "explanation": "The passage tells a true story from the war. Its purpose is to inform about history.", "source": "new-original-audit", "passage": "In 1942, the Marine Corps began training Navajo speakers to send messages in a code based on their language. The code was never broken during the war. Many of the code talkers did not speak publicly about their work until the program was declassified in 1968.", "passageId": "P30"}, {"id": "PC-082", "section": "PC", "stem": "The passage mainly compares", "choices": ["summer and winter weather", "solar power and wind power", "the costs of different houses", "two ways of mounting solar panels"], "answer": 3, "difficulty": 2, "topic": "pc-main-idea", "steps": ["Read the question first. What type is it? Main idea.", "Find the line in the passage that answers it.", "The passage compares tilting panels and fixed panels.", "Answer: two ways of mounting solar panels."], "explanation": "The passage compares tilting panels and fixed panels.", "source": "new-original-audit", "passage": "Solar panels make the most power when sunlight strikes them directly. Because the sun's angle changes with the seasons, some panels are mounted on frames that tilt. Others are fixed in place at an angle chosen to give the best result over the whole year. Fixed panels cost less to install, while tilting panels produce more power over a year.", "passageId": "P31"}, {"id": "PC-083", "section": "PC", "stem": "A buyer with a small budget would most likely choose", "choices": ["tilting panels", "fixed panels", "no panels at all", "panels that face away from the sun"], "answer": 1, "difficulty": 2, "topic": "pc-inference", "steps": ["Read the question first. What type is it? Inference (reading between lines).", "Find the line in the passage that answers it.", "The passage says fixed panels cost less to install.", "Answer: fixed panels."], "explanation": "The passage says fixed panels cost less to install.", "source": "new-original-audit", "passage": "Solar panels make the most power when sunlight strikes them directly. Because the sun's angle changes with the seasons, some panels are mounted on frames that tilt. Others are fixed in place at an angle chosen to give the best result over the whole year. Fixed panels cost less to install, while tilting panels produce more power over a year.", "passageId": "P31"}, {"id": "PC-084", "section": "PC", "stem": "When should the lug nuts first be loosened?", "choices": ["Before parking the car", "After the tire is removed", "After the new tire is on", "Before the car is raised"], "answer": 3, "difficulty": 2, "topic": "pc-sequence", "steps": ["Read the question first. What type is it? Steps in order.", "Find the line in the passage that answers it.", "The passage says to loosen them while the tire is still on the ground, before the jack.", "Answer: Before the car is raised."], "explanation": "The passage says to loosen them while the tire is still on the ground, before the jack.", "source": "new-original-audit", "passage": "To change a flat tire, first park on level ground and set the brake. Next, loosen the lug nuts slightly while the tire is still on the ground. Then raise the car with the jack, remove the nuts, and swap the tire.", "passageId": "P32"}, {"id": "MK-001", "section": "MK", "stem": "Solve for x: 3x + 7 = 22", "choices": ["4", "6", "15", "5"], "answer": 3, "difficulty": 1, "topic": "mk-equations", "steps": ["The idea: Undo the steps. Do the same thing to both sides.", "Subtract 7: 3x = 15.", "Divide by 3: x = 5.", "Answer: 5."], "explanation": "Subtract 7: 3x = 15. Divide by 3: x = 5.", "source": "study-pack:quiz"}, {"id": "MK-002", "section": "MK", "stem": "What is 3^2 x 2^3?", "choices": ["30", "36", "72", "48"], "answer": 2, "difficulty": 1, "topic": "mk-exponents", "steps": ["The idea: Same base: multiply means add powers. Divide means subtract powers.", "3^2 = 9.", "2^3 = 8.", "9 x 8 = 72.", "Answer: 72."], "explanation": "3^2 = 9. 2^3 = 8. 9 x 8 = 72.", "source": "study-pack:quiz"}, {"id": "MK-003", "section": "MK", "stem": "What is the square root of 81?", "choices": ["9", "40", "8", "18"], "answer": 0, "difficulty": 1, "topic": "mk-exponents", "steps": ["The idea: Same base: multiply means add powers. Divide means subtract powers.", "9 x 9 = 81.", "So the answer is 9.", "Answer: 9."], "explanation": "9 x 9 = 81. So the answer is 9.", "source": "study-pack:quiz"}, {"id": "MK-004", "section": "MK", "stem": "A triangle has a base of 10 and a height of 6. What is its area?", "choices": ["16", "30", "32", "60"], "answer": 1, "difficulty": 1, "topic": "mk-area-volume", "steps": ["The idea: Rectangle: L x W. Triangle: half of base x height. Circle: pi x r^2. Box: L x W x H.", "Area = 1/2 x base x height = 1/2 x 10 x 6 = 30.", "Answer: 30."], "explanation": "Area = 1/2 x base x height = 1/2 x 10 x 6 = 30.", "source": "study-pack:quiz"}, {"id": "MK-005", "section": "MK", "stem": "Two angles of a triangle are 50 and 60 degrees. What is the third angle?", "choices": ["130 degrees", "70 degrees", "60 degrees", "80 degrees"], "answer": 1, "difficulty": 1, "topic": "mk-triangles-angles", "steps": ["The idea: Angles in a triangle add to 180. For a right triangle, a^2 + b^2 = c^2.", "Angles add to 180.", "50 + 60 = 110.", "180 - 110 = 70.", "Answer: 70 degrees."], "explanation": "Angles add to 180. 50 + 60 = 110. 180 - 110 = 70.", "source": "study-pack:quiz"}, {"id": "MK-006", "section": "MK", "stem": "What is the value of 5 + 3 x 4?", "choices": ["32", "20", "17", "12"], "answer": 2, "difficulty": 1, "topic": "mk-number", "steps": ["The idea: Order of operations: parentheses, exponents, times and divide, then plus and minus.", "Multiply first: 3 x 4 = 12.", "Then 5 + 12 = 17.", "Answer: 17."], "explanation": "Multiply first: 3 x 4 = 12. Then 5 + 12 = 17.", "source": "study-pack:quiz"}, {"id": "MK-007", "section": "MK", "stem": "Solve for x: x/4 - 2 = 3", "choices": ["20", "4", "8", "24"], "answer": 0, "difficulty": 1, "topic": "mk-equations", "steps": ["The idea: Undo the steps. Do the same thing to both sides.", "Add 2: x/4 = 5.", "Multiply by 4: x = 20.", "Answer: 20."], "explanation": "Add 2: x/4 = 5. Multiply by 4: x = 20.", "source": "study-pack:quiz"}, {"id": "MK-008", "section": "MK", "stem": "Expand: (x + 3)(x + 2)", "choices": ["x^2 + 5x + 5", "x^2 + 6x + 5", "x^2 + 6", "x^2 + 5x + 6"], "answer": 3, "difficulty": 1, "topic": "mk-polynomials", "steps": ["The idea: Multiply each term by each term (FOIL). To factor, find two numbers that multiply and add.", "x times x = x^2.", "2x + 3x = 5x.", "3 times 2 = 6.", "Result x^2 + 5x + 6.", "Answer: x^2 + 5x + 6."], "explanation": "x times x = x^2. 2x + 3x = 5x. 3 times 2 = 6. Result x^2 + 5x + 6.", "source": "study-p ", "5", "13", "8"], "answer": 3, "difficulty": 1, "topic": "mk-equations", "steps": ["The idea: Undo the steps. Do the same thing to both sides.", "Divide by 2: x - 3 = 5.", "Add 3: x = 8.", "Answer: 8."], "explanation": "Divide by 2: x - 3 = 5. Add 3: x = 8.", "source": "study-pack:quiz"}, {"id": "MK-014", "section": "MK", "stem": "What is the slope of the line through (1, 2) and (3, 8)?", "choices": ["1/3", "3", "6", "2"], "answer": 1, "difficulty": 1, "topic": "mk-slope", "steps": ["The idea: Slope = change in y divided by change in x. In y = mx + b, m is the slope.", "Slope = rise / run = (8 - 2) / (3 - 1) = 6 / 2 = 3.", "Answer: 3."], "explanation": "Slope = rise / run = (8 - 2) / (3 - 1) = 6 / 2 = 3.", "source": "study-pack:quiz"}, {"id": "MK-015", "section": "MK", "stem": "Which of these numbers is prime?", "choices": ["23", "27", "33", "21"], "answer": 0, "difficulty": 2, "topic": "mk-number", "steps": ["The idea: Order of operations: parentheses, exponents, times and divide, then plus and minus.", "21 = 3 x 7.", "27 = 3 x 9.", "33 = 3 x 11.", "23 has no other factors.", "Answer: 23."], "explanation": "21 = 3 x 7. 27 = 3 x 9. 33 = 3 x 11. 23 has no other factors.", "source": "study-pack:quiz"}, {"id": "MK-016", "section": "MK", "stem": "What is the least common multiple of 6 and 8?", "choices": ["48", "14", "24", "12"], "answer": 2, "difficulty": 2, "topic": "mk-number", "steps": ["The idea: Order of operations: parentheses, exponents, times and divide, then plus and minus.", "Multiples of 8: 8, 16, 24.", "24 is also a multiple of 6.", "LCM = 24.", "Answer: 24."], "explanation": "Multiples of 8: 8, 16, 24. 24 is also a multiple of 6. LCM = 24.", "source": "study-pack:quiz"}, {"id": "MK-017", "section": "MK", "stem": "What is the greatest common factor of 18 and 30?", "choices": ["6", "90", "3", "9"], "answer": 0, "difficulty": 2, "topic": "mk-number", "steps": ["The idea: Order of operations: parentheses, exponents, times and divide, then plus and minus.", " eld."], "explanation": "A coil stores energy in the magnetic field around it.", "source": "study-pack:quiz"}, {"id": "EI-026", "section": "EI", "stem": "What is the unit of capacitance?", "choices": ["coulomb", "farad", "henry", "hertz"], "answer": 1, "difficulty": 2, "topic": "ei-basics", "steps": ["Topic: Current, voltage, resistance.", "Capacitance is measured in farads.", "Answer: farad."], "explanation": "Capacitance is measured in farads.", "source": "study-pack:quiz"}, {"id": "EI-027", "section": "EI", "stem": "Resistance stays the same and voltage doubles. What happens to current?", "choices": ["It drops to zero.", "It is cut in half.", "It doubles.", "It stays the same."], "answer": 2, "difficulty": 2, "topic": "ei-basics", "steps": ["Topic: Current, voltage, resistance.", "I = V / R.", "Double V and I doubles.", "Answer: It doubles."], "explanation": "I = V / R. Double V and I doubles.", "source": "study-pack:quiz"}, {"id": "EI-028", "section": "EI", "stem": "A 2 kilowatt heater runs for 3 hours. How much energy does it use?", "choices": ["23 kilowatt-hours", "5 kilowatt-hours", "1.5 kilowatt-hours", "6 kilowatt-hours"], "answer": 3, "difficulty": 2, "topic": "ei-power", "steps": ["The idea: P = V x I. Also P = I x I x R. Energy = power x time.", "Energy = power x time = 2 x 3 = 6 kWh.", "Answer: 6 kilowatt-hours."], "explanation": "Energy = power x time = 2 x 3 = 6 kWh.", "source": "study-pack:quiz"}, {"id": "EI-029", "section": "EI", "stem": "What is the job of a ground wire?", "choices": ["store energy", "give extra current a safe path to earth", "speed up current", "raise the voltage"], "answer": 1, "difficulty": 2, "topic": "ei-basics", "steps": ["Topic: Current, voltage, resistance.", "A ground wire protects people from shocks.", "Answer: give extra current a safe path to earth."], "explanation": "A ground wire protects people from shocks.", "source": "study-pack:quiz"}, {"id": "EI-030", "section": "EI", "stem": "Which part is used to limit the current in a circuit?", "choices": ["switch", "battery", "diode", "resistor"], "answer": 3, "difficulty": 2, "topic": "ei-components", "steps": ["Topic: Electronic parts.", "A resistor limits current flow.", "Answer: resistor."], "explanation": "A resistor limits current flow.", "source": "study-pack:quiz"}, {"id": "EI-031", "section": "EI", "stem": "What is the unit of frequency?", "choices": ["hertz", "henry", "farad", "watt"], "answer": 0, "difficulty": 3, "topic": "ei-ac-dc", "steps": ["Topic: AC and DC.", "Frequency is measured in hertz (cycles per second).", "Answer: hertz."], "explanation": "Frequency is measured in hertz (cycles per second).", "source": "study-pack:quiz"}, {"id": "EI-032", "section": "EI", "stem": "A 9 volt battery pushes 0.003 amps through a part. What is its resistance?", "choices": ["300 ohms", "0.0003 ohms", "3,000 ohms", "27 ohms"], "answer": 2, "difficulty": 3, "topic": "ei-ohms-law", "steps": ["The idea: V = I x R. So I = V / R, and R = V / I.", "R = V / I = 9 / 0.003 = 3,000 ohms.", "Answer: 3,000 ohms."], "explanation": "R = V / I = 9 / 0.003 = 3,000 ohms.", "source": "study-pack:quiz"}, {"id": "EI-033", "section": "EI", "stem": "A 6 ohm and a 3 ohm resistor are in parallel. What is the total resistance?", "choices": ["9 ohms", "2 ohms", "18 ohms", "4.5 ohms"], "answer": 1, "difficulty": 3, "topic": "ei-series-parallel", "steps": ["The idea: Series: add the resistors. Parallel: product over sum. Two equal ones: divide by 2.", "Product over sum: (6 x 3) / (6 + 3) = 18 / 9 = 2.", "Answer: 2 ohms."], "explanation": "Product over sum: (6 x 3) / (6 + 3) = 18 / 9 = 2.", "source": "study-pack:quiz"}, {"id": "EI-034", "section": "EI", "stem": "A 60 watt bulb runs on 120 volts. How much current does it draw?", "choices": ["0.5 amp", "7,200 amps", "2 amps", "60 amps"], "answer": 0, "difficulty": 3, "topic": "ei-power", "steps": ["The idea: P = V x I. Also P = I x I x R. Energy = power x time.", "I = P / V = 60 / 120 = 0.5 amp.", "Answer: 0.5 amp."
