<style>
/* ASVAB Coach - simple, high contrast, big type. No italics anywhere. */
:root{
  --bg:#FFFDF2; --card:#FFFFFF; --text:#111111; --muted:#333333; --line:#222222;
  --primary:#003A8C; --primary-text:#FFFFFF; --ok:#0B6B2B; --ok-bg:#E3F5E8; --bad:#A31515; --bad-bg:#FBE4E4;
  --hl:#FFE14D; --focus:#FFB000; --soft:#EEF3FB;
}
body.dark{ --bg:#000000; --card:#111111; --text:#FFFFFF; --muted:#EDEDED; --line:#FFFFFF;
  --primary:#FFD400; --primary-text:#000000; --ok:#6BE38C; --ok-bg:#0E2A16; --bad:#FF7B7B; --bad-bg:#2E0E0E; --hl:#FFD400; --soft:#1A1A1A; }
*{ box-sizing:border-box; font-style:normal !important; }
html{ font-size:22px; }
body{ margin:0; background:var(--bg); color:var(--text);
  font-family: Verdana, "Atkinson Hyperlegible", "DejaVu Sans", Arial, Helvetica, sans-serif;
  line-height:1.6; letter-spacing:0.02em; word-spacing:0.08em; }
body.big{ font-size:1.15rem; }
main{ max-width:820px; margin:0 auto; padding:12px 16px 80px; }
h1{ font-size:1.6rem; margin:.4em 0; } h2{ font-size:1.3rem; margin:.6em 0 .3em; } h3{ font-size:1.1rem; margin:.5em 0 .2em; }
p{ margin:.4em 0 .8em; max-width:38em; }
a{ color:var(--primary); }
header.top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; border-bottom:3px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; }
header.top .brand{ font-weight:bold; font-size:1.1rem; margin-right:auto; }
.streak{ font-weight:bold; padding:4px 12px; border:2px solid var(--line); border-radius:10px; }
button, .btn{ font:inherit; font-size:1rem; min-height:60px; padding:12px 20px; border-radius:12px; border:3px solid var(--line);
  background:var(--card); color:var(--text); cursor:pointer; text-align:left; }
button.primary{ background:var(--primary); color:var(--primary-text); border-color:var(--primary); font-weight:bold; }
button.small{ min-height:48px; padding:6px 14px; font-size:.9rem; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:5px solid var(--focus); outline-offset:2px; }
button:disabled{ opacity:.55; cursor:not-allowed; }
.choice:disabled{ opacity:.8; } .choice.correct:disabled, .choice.wrong:disabled, .choice.picked:disabled{ opacity:1; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin:12px 0; }
.tile{ font-size:1.1rem; font-weight:bold; min-height:96px; }
.tile small{ display:block; font-weight:normal; font-size:.85rem; margin-top:4px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:10px 0; }
.card{ background:var(--card); border:3px solid var(--line); border-radius:14px; padding:14px 16px; margin:12px 0; }
.passage{ background:var(--soft); }
.stem{ font-size:1.15rem; font-weight:bold; }
.choices{ display:flex; flex-direction:column; gap:12px; margin:12px 0; }
.choice-row{ display:flex; gap:8px; align-items:stretch; }
.choice{ flex:1; display:flex; gap:14px; align-items:center; font-size:1.05rem; }
.choice .letter{ display:inline-flex; justify-content:center; align-items:center; min-width:46px; height:46px; border-radius:50%;
  border:3px solid var(--line); font-weight:bold; flex-shrink:0; }
.choice.correct{ background:var(--ok-bg); border-color:var(--ok); }
.choice.wrong{ background:var(--bad-bg); border-color:var(--bad); }
.choice.picked{ outline:4px solid var(--primary); }
.say{ min-width:64px; text-align:center; font-weight:bold; font-size:.9rem; }
.say[aria-pressed="true"]{ background:var(--hl); color:#000; }
.w.hl{ background:var(--hl); color:#000; border-radius:4px; box-shadow:0 0 0 3px var(--hl); }
.feedback.ok{ border-color:var(--ok); background:var(--ok-bg); }
.feedback.bad{ border-color:var(--bad); background:var(--bad-bg); }
.big-word{ font-size:1.4rem; font-weight:bold; }
ol.steps{ padding-left:1.6em; } ol.steps li{ margin:.35em 0; }
.timer{ font-size:1.3rem; font-weight:bold; font-variant-numeric:tabular-nums; }
.bar{ height:16px; border:2px solid var(--line); border-radius:8px; overflow:hidden; }
.bar > div{ height:100%; background:var(--primary); transition:width .5s linear; }
.bar.low > div{ background:var(--bad); }
.pill{ display:inline-block; padding:2px 12px; border:2px solid var(--line); border-radius:999px; font-size:.85rem; margin:2px 4px 2px 0; }
.ok-text{ color:var(--ok); font-weight:bold; } .bad-text{ color:var(--bad); font-weight:bold; }
label{ font-weight:bold; display:block; margin:10px 0 4px; }
input[type=text], input[type=password], input[type=url], select, textarea{ font:inherit; font-size:1rem; width:100%; padding:12px; border:3px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); }
textarea{ min-height:140px; }
input[type=range]{ width:100%; height:40px; }
.toggle{ display:flex; gap:12px; align-items:center; font-weight:bold; }
.toggle input{ width:32px; height:32px; }
.chat{ display:flex; flex-direction:column; gap:10px; }
.msg{ border:3px solid var(--line); border-radius:14px; padding:10px 14px; white-space:pre-wrap; }
.msg.me{ background:var(--soft); align-self:flex-end; max-width:90%; }
.msg.bot{ background:var(--card); max-width:95%; }
.notice{ border:3px dashed var(--line); border-radius:12px; padding:10px 14px; margin:10px 0; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:640px){ html{ font-size:20px; } .two-col{ grid-template-columns:1fr; } }
table{ border-collapse:collapse; width:100%; } td,th{ border:2px solid var(--line); padding:8px; text-align:left; }
.listen-dot{ display:inline-block; width:18px; height:18px; border-radius:50%; background:var(--bad); margin-right:8px; animation:pulse 1s infinite; }
@keyframes pulse{ 50%{ opacity:.25; } }
.hidden{ display:none !important; }
svg text{ font-family: Verdana, "DejaVu Sans", Arial, sans-serif; fill:var(--text); }

</style>
</head>

<header class="top">
  <span class="brand">ASVAB Coach</span>
  <span class="streak" id="streak" aria-live="polite"></span>
  <button class="small" id="homeBtn" onclick="go('home')">Home</button>
  <button class="small" id="stopTalk" onclick="Speech.stop()">Stop voice</button>
</header>
<main id="app" aria-live="polite"></main>
<script>window.ASVAB_SINGLE_FILE=true;
window.ASVAB_BANK={"version": "2026-10-17", "title": "ASVAB Coach question bank", "note": "Original ASVAB-style practice questions. Not real ASVAB items.", "sections": {"AR": "Arithmetic Reasoning", "WK": "Word Knowledge", "PC": "Paragraph Comprehension", "MK": "Math Knowledge", "GS": "General Science"}, "cat": {"GS": [15, 12], "AR": [15, 55], "WK": [15, 9], "PC": [10, 27], "MK": [15, 31]}, "lessons": {"ar-rate": {"section": "AR", "name": "Distance, rate, and time", "what": ["Distance is how far you go.", "Rate is how fast. Time is how long."], "why": "AR asks rate questions on almost every test.", "example": ["A ship goes 20 miles each hour.", "After 2 hours, it went 40 miles."], "idea": "Distance equals rate times time. D = R x T.", "worked": ["A truck drives 50 miles per hour for 3 hours.", "Step 1: D = R x T.", "Step 2: D = 50 x 3.", "Step 3: D = 150 miles."]}, "ar-work": {"section": "AR", "name": "Working together", "what": ["Work problems ask how long a job takes.", "Add how much each worker does in 1 hour."], "why": "These are tricky. Many people miss them.", "example": ["You wash half the car in an hour.", "A friend washes the other half in that hour.", "Together you finish in 1 hour."], "idea": "Find the part of the job done in 1 hour. Then flip it.", "worked": ["Pump A fills a tank in 2 hours. Pump B in 2 hours.", "Step 1: Each hour, A does 1/2. B does 1/2.", "Step 2: Together: 1/2 + 1/2 = 1 tank each hour.", "Step 3: Time = 1 hour."]}, "ar-percent": {"section": "AR", "name": "Percents: sales, tax, tips", "what": ["Percent means \"out of 100\".", "25% means 25 out of 100."], "why": "Sales, tax, tips, and pay raises use percents.", "example": ["A $10 meal. You tip 20%.", "20% of 10 is 2. You pay $12."], "idea": "Change the percent to a decimal. Then multiply.", "worked": ["What is 30% of 50?", "Step 1: 30% = 0.30.", "Step 2: 0.30 x 50 = 15.", "Answer: 15."]}, "ar-interest": {"section": "AR", "name": "Simple interest", "what": ["Interest is money paid for using money.", "Simple interest: I = P x r x t."], "why": "Banks and loans use it. AR tests it often.", "example": ["You save $100 at 10% a year.", "After 1 year you earn $10."], "idea": "Interest = principal times rate times time.", "worked": ["$200 at 5% for 2 years.", "Step 1: 5% = 0.05.", "Step 2: 200 x 0.05 = 10 each year.", "Step 3: 10 x 2 years = $20."]}, "ar-ratio": {"section": "AR", "name": "Ratios and proportions", "what": ["A ratio compares two amounts.", "3 to 5 means 3 parts and 5 parts."], "why": "Recipes, maps, and mixes all use ratios.", "example": ["2 scoops of mix for 1 cup of water.", "For 3 cups, use 6 scoops."], "idea": "Add the parts. Find one part. Then multiply.", "worked": ["Red to blue is 1 to 3. There are 20 cars.", "Step 1: 1 + 3 = 4 parts.", "Step 2: 20 / 4 = 5 per part.", "Step 3: Blue = 3 x 5 = 15."]}, "ar-average": {"section": "AR", "name": "Averages", "what": ["The average is the fair share.", "Add them all. Divide by how many."], "why": "Test scores and pay use averages.", "example": ["Three friends have $2, $4, and $6.", "Total $12. Share it 3 ways: $4 each."], "idea": "Average = total divided by how many.", "worked": ["Find the average of 4, 6, and 8.", "Step 1: 4 + 6 + 8 = 18.", "Step 2: 18 / 3 = 6.", "Answer: 6."]}, "ar-units": {"section": "AR", "name": "Units and time", "what": ["Units tell what you measure.", "Hours, minutes, feet, inches, gallons."], "why": "You must match units before you do math.", "example": ["A movie is 2 hours.", "2 x 60 = 120 minutes."], "idea": "Change to the same unit first. 1 hour = 60 minutes. 1 foot = 12 inches.", "worked": ["How many minutes in 1.5 hours?", "Step 1: 1 hour = 60 minutes.", "Step 2: 1.5 x 60 = 90.", "Answer: 90 minutes."]}, "ar-fractions": {"section": "AR", "name": "Fractions in word problems", "what": ["A fraction is a part of a whole.", "3/4 means 3 of 4 equal parts."], "why": "Tanks, books, and pay often use fractions.", "example": ["A pizza has 8 slices.", "You eat 1/4 of it. That is 2 slices."], "idea": "To find a fraction of a number: divide by the bottom. Times the top.", "worked": ["What is 2/3 of 30?", "Step 1: 30 / 3 = 10.", "Step 2: 10 x 2 = 20.", "Answer: 20."]}, "ar-money": {"section": "AR", "name": "Money and totals", "what": ["Many AR problems are shopping math.", "Find the cost of each part. Then add."], "why": "This is the most common AR question.", "example": ["2 sodas at $1.50 each.", "2 x 1.50 = 3.00."], "idea": "Multiply price by how many. Then add or subtract.", "worked": ["3 shirts at $8 each and a hat for $5.", "Step 1: 3 x 8 = 24.", "Step 2: 24 + 5 = 29.", "Answer: $29."]}, "ar-number": {"section": "AR", "name": "Number puzzles", "what": ["Number puzzles describe a number in words.", "Turn the words into math."], "why": "They test clear thinking, not hard math.", "example": ["Two numbers add to 10. They differ by 2.", "The numbers are 6 and 4."], "idea": "Write what you know. Use the middle or the sum.", "worked": ["Three numbers in a row add to 30.", "Step 1: Middle = 30 / 3 = 10.", "Step 2: The numbers are 9, 10, 11.", "Smallest: 9."]}, "ar-geometry": {"section": "AR", "name": "Area and perimeter in word problems", "what": ["Area is the space inside. Perimeter is the edge.", "Area of a rectangle = length x width."], "why": "Paint, carpet, and fences use these.", "example": ["A rug is 3 feet by 2 feet.", "Area: 3 x 2 = 6 square feet."], "idea": "Area = length x width. Perimeter = add all sides.", "worked": ["A room is 10 by 12 feet. Tile covers 20 square feet a box.", "Step 1: Area = 10 x 12 = 120.", "Step 2: 120 / 20 = 6.", "Answer: 6 boxes."]}, "mk-equations": {"section": "MK", "name": "Solving equations", "what": ["An equation is a balance.", "Both sides must stay equal."], "why": "MK has many \"solve for x\" questions.", "example": ["A scale has a box and 2 pounds on one side.", "5 pounds on the other side.", "The box must weigh 3 pounds."], "idea": "Undo the steps. Do the same thing to both sides.", "worked": ["Solve 2x + 4 = 10.", "Step 1: Subtract 4 from both sides. 2x = 6.", "Step 2: Divide both sides by 2. x = 3.", "Check: 2 times 3 plus 4 is 10."]}, "mk-inequalities": {"section": "MK", "name": "Inequalities", "what": ["An inequality uses < or >.", "Solve it like an equation."], "why": "One rule trips people up. Know it.", "example": ["You need more than $5 for lunch.", "Any amount over 5 works."], "idea": "If you multiply or divide by a negative, FLIP the sign.", "worked": ["Solve -3x < 9.", "Step 1: Divide both sides by -3.", "Step 2: Flip the sign: x > -3."]}, "mk-systems": {"section": "MK", "name": "Two equations", "what": ["Two equations, two unknowns.", "Combine them to get one unknown."], "why": "Shows up a few times on MK.", "example": ["Two shirts cost $30. One costs $10 more.", "Prices: $20 and $10."], "idea": "Add or subtract the equations so one letter goes away.", "worked": ["x + y = 8 and x - y = 2.", "Step 1: Add them: 2x = 10.", "Step 2: x = 5.", "Step 3: y = 8 - 5 = 3."]}, "mk-exponents": {"section": "MK", "name": "Exponents and roots", "what": ["An exponent says how many times to multiply.", "3^2 means 3 x 3 = 9."], "why": "Exponents and square roots are common on MK.", "example": ["A square room is 4 feet on a side.", "4^2 = 16 square feet.", "The square root of 16 is 4."], "idea": "Same base: multiply means add powers. Divide means subtract powers.", "worked": ["What is 2^3 x 2^2?", "Step 1: Same base 2. Add powers: 3 + 2 = 5.", "Step 2: 2^5 = 32."]}, "mk-polynomials": {"section": "MK", "name": "Expanding and factoring", "what": ["Expanding multiplies out the parentheses.", "Factoring goes backward."], "why": "MK uses these on harder questions.", "example": ["5 boxes of (2 apples + 3 pears).", "That is 10 apples + 15 pears."], "idea": "Multiply each term by each term (FOIL). To factor, find two numbers that multiply and add.", "worked": ["Expand (x + 1)(x + 4).", "Step 1: x times x = x^2.", "Step 2: x times 4 plus 1 times x = 5x.", "Step 3: 1 times 4 = 4.", "Answer: x^2 + 5x + 4."]}, "mk-quadratics": {"section": "MK", "name": "Quadratic equations", "what": ["A quadratic has an x^2.", "It often has two answers."], "why": "MK asks to solve or factor them.", "example": ["Two numbers multiply to 6 and add to 5.", "They are 2 and 3."], "idea": "Factor. Then set each part equal to zero.", "worked": ["Solve x^2 - 7x + 10 = 0.", "Step 1: Numbers that multiply to 10, add to -7: -2 and -5.", "Step 2: (x - 2)(x - 5) = 0.", "Step 3: x = 2 or x = 5."]}, "mk-functions": {"section": "MK", "name": "Plugging in values", "what": ["f(x) is a rule. Put a number in. Get a number out."], "why": "Plug-in questions are quick points.", "example": ["A rule: double it, then add 1.", "Put in 3. Get 7."], "idea": "Replace x with the number. Then follow order of operations.", "worked": ["If f(x) = x^2 + 1, find f(2).", "Step 1: Put in 2: 2^2 + 1.", "Step 2: 4 + 1 = 5."]}, "mk-area-volume": {"section": "MK", "name": "Area, perimeter, volume", "what": ["Area is flat space inside. Volume is space in 3D.", "Each shape has a formula."], "why": "Geometry is a big part of MK.", "example": ["A shoebox is 10 by 6 by 4 inches.", "Volume: 10 x 6 x 4 = 240 cubic inches."], "idea": "Rectangle: L x W. Triangle: half of base x height. Circle: pi x r^2. Box: L x W x H.", "worked": ["A triangle has base 8 and height 5.", "Step 1: Area = 1/2 x base x height.", "Step 2: 1/2 x 8 x 5 = 20."]}, "mk-triangles-angles": {"section": "MK", "name": "Angles and right triangles", "what": ["A triangle has 180 degrees inside.", "A straight line is 180 degrees.", "Right triangles use a^2 + b^2 = c^2."], "why": "Angle and triangle questions are common.", "example": ["A ladder against a wall makes a right triangle.", "The ladder is the long side."], "idea": "Angles in a triangle add to 180. For a right triangle, a^2 + b^2 = c^2.", "worked": ["Legs are 3 and 4. Find the long side.", "Step 1: 3^2 + 4^2 = 9 + 16 = 25.", "Step 2: Square root of 25 is 5."]}, "mk-fractions": {"section": "MK", "name": "Fractions and decimals", "what": ["Fractions and decimals both show parts.", "0.5 is the same as 1/2."], "why": "MK tests adding, dividing, and changing them.", "example": ["Half a dollar is $0.50.", "A quarter is $0.25, or 1/4."], "idea": "To add: match the bottoms. To divide: flip the second and multiply.", "worked": ["What is 1/2 divided by 1/4?", "Step 1: Flip 1/4 to 4/1.", "Step 2: 1/2 x 4 = 2."]}, "mk-number": {"section": "MK", "name": "Number facts", "what": ["Primes, factors, multiples, order of operations.", "Median, rounding, absolute value."], "why": "These are quick points if you know the rules.", "example": ["12 cookies can be split by 1, 2, 3, 4, 6, or 12.", "Those are the factors of 12."], "idea": "Order of operations: parentheses, exponents, times and divide, then plus and minus.", "worked": ["What is 2 + 3 x 4?", "Step 1: Multiply first: 3 x 4 = 12.", "Step 2: 2 + 12 = 14."]}, "mk-slope": {"section": "MK", "name": "Slope and graphs", "what": ["Slope is how steep a line is.", "Rise over run."], "why": "Lines and points show up on MK.", "example": ["A ramp goes up 1 foot for every 4 feet forward.", "Slope = 1/4."], "idea": "Slope = change in y divided by change in x. In y = mx + b, m is the slope.", "worked": ["Points (1, 1) and (3, 5).", "Step 1: Rise: 5 - 1 = 4.", "Step 2: Run: 3 - 1 = 2.", "Step 3: 4 / 2 = 2."]}, "mk-probability": {"section": "MK", "name": "Probability and counting", "what": ["Probability is the chance something happens.", "Chance = good outcomes / all outcomes."], "why": "One or two MK questions use this.", "example": ["A coin has 2 sides.", "Chance of heads = 1/2."], "idea": "Count the good outcomes. Divide by all outcomes. For two events in a row, multiply.", "worked": ["A bag has 2 red, 3 blue. Pick one.", "Step 1: Good = 2 red.", "Step 2: All = 5.", "Step 3: Chance = 2/5."]}, "wk-context": {"section": "WK", "name": "Word meaning in a sentence", "what": ["You see a word in a sentence.", "Pick the word that means the same."], "why": "WK and PC make up VE. VE counts double for AFQT. It is in every IT line score.", "example": ["\"The soup was SCALDING. I burned my tongue.\"", "The clue \"burned\" tells you: very hot."], "idea": "Use the sentence as a clue. Is the mood good or bad?", "worked": ["\"The trail was ARDUOUS. We were tired.\"", "Step 1: Clue: \"tired\".", "Step 2: Mood: hard, not fun.", "Step 3: ARDUOUS means difficult."]}, "wk-synonym": {"section": "WK", "name": "Word meaning (no sentence)", "what": ["You see a word by itself.", "Pick the word closest in meaning."], "why": "About half the WK words come with no sentence.", "example": ["MERRY means happy.", "You can try \"a merry day\" in a sentence."], "idea": "Make up your own short sentence with the word. Look for word parts.", "worked": ["Word: BENEFIT.", "Step 1: Sentence: \"Sleep is a benefit to health.\"", "Step 2: Word part: \"bene\" means good.", "Step 3: BENEFIT means help or advantage."]}, "pc-main-idea": {"section": "PC", "name": "Main idea", "what": ["The main idea is what the whole passage is about.", "It is the big point, not one detail."], "why": "Almost every PC set has a main idea question.", "example": ["A text says: buy snacks, pick a movie, call friends.", "The main idea: planning a movie night."], "idea": "Ask: what is the one big point? Check the first and last lines.", "worked": ["Passage: \"Dogs need walks. Dogs need food. Dogs need care.\"", "Step 1: Every line is about caring for dogs.", "Step 2: Main idea: dogs need care."]}, "pc-detail": {"section": "PC", "name": "Finding details", "what": ["A detail question asks for one fact.", "The answer is written in the passage."], "why": "Detail questions are the easiest PC points.", "example": ["A sign says: \"Store opens at 9.\"", "Q: When does it open? Find \"9\"."], "idea": "Read the question first. Find the line that answers it.", "worked": ["Passage: \"The ship left at noon. It reached port at 6.\"", "Q: When did it reach port?", "Step 1: Look for \"port\".", "Step 2: The line says 6."]}, "pc-inference": {"section": "PC", "name": "Inference (reading between lines)", "what": ["An inference is not said out loud.", "You figure it out from clues."], "why": "Harder PC questions ask what you can infer.", "example": ["Your friend comes in wet with an umbrella.", "You infer it is raining."], "idea": "Pick the answer the passage supports. Do not add outside ideas.", "worked": ["Passage: \"Sam studied every day. He passed the test easily.\"", "Q: What can you infer?", "Step 1: Clues: studied, passed easily.", "Step 2: Study helped Sam pass."]}, "pc-vocab": {"section": "PC", "name": "Word meaning in a passage", "what": ["Some PC questions ask what a word means.", "The meaning comes from the passage."], "why": "The common meaning may be a trap.", "example": ["\"The coach will FIELD questions.\"", "Here FIELD means answer, not grass."], "idea": "Put each choice in place of the word. Pick the one that fits.", "worked": ["\"The plan was SOUND.\"", "Step 1: Try \"noisy\": does not fit.", "Step 2: Try \"solid and good\": fits.", "Answer: SOUND means solid."]}, "pc-author": {"section": "PC", "name": "Author view, tone, and purpose", "what": ["Tone is how the author feels.", "Purpose is why the author wrote it."], "why": "These test if you understand the writer.", "example": ["A text says: \"Wear a seat belt. It saves lives.\"", "Purpose: to persuade you."], "idea": "Look for feeling words. Ask: why did they write this?", "worked": ["Passage: \"Recycling is simple and helps us all.\"", "Step 1: Feeling words: simple, helps.", "Step 2: The author is in favor of recycling."]}, "pc-sequence": {"section": "PC", "name": "Steps in order", "what": ["Some passages give steps.", "Words like first, next, then, finally show order."], "why": "Tech jobs use step-by-step instructions.", "example": ["First boil water. Next add noodles. Then drain.", "Draining comes last."], "idea": "Find the order words. Number the steps.", "worked": ["\"First save the file. Next close the app. Then restart.\"", "Q: What comes after saving?", "Step 1: Find \"Next\".", "Step 2: Close the app."]}, "gs-human-body": {"section": "GS", "name": "Human body", "what": ["The body has systems.", "Heart and blood, lungs, nerves, bones."], "why": "GS often asks what each organ does.", "example": ["After a run your heart beats fast.", "It pumps more blood to your muscles."], "idea": "Match each organ to its job.", "worked": ["Q: Which organ helps you breathe?", "Step 1: Breathing means air.", "Step 2: Air goes to the lungs.", "Answer: lungs."]}, "gs-cells-life": {"section": "GS", "name": "Cells, plants, and living things", "what": ["All living things are made of cells.", "Plants make food from light."], "why": "Life science is a big part of GS.", "example": ["A houseplant by a window grows toward the light.", "It uses light to make food."], "idea": "Know the cell parts and how plants make food (photosynthesis).", "worked": ["Q: What part of a cell makes energy?", "Step 1: Energy = power plant.", "Step 2: The mitochondria is the power plant."]}, "gs-earth-space": {"section": "GS", "name": "Earth and space", "what": ["Earth science covers rocks, weather, and planets."], "why": "A few GS questions each test.", "example": ["Summer is warm because sunlight hits more directly.", "That comes from the tilt of Earth."], "idea": "Know the planets in order, the rock types, and the layers of air.", "worked": ["Q: Which planet is biggest?", "Step 1: The gas giants are big.", "Step 2: Jupiter is the biggest."]}, "gs-chemistry": {"section": "GS", "name": "Matter and chemistry", "what": ["Matter is anything with mass.", "Atoms make up elements. Elements join into compounds."], "why": "GS asks about atoms, pH, and changes of state.", "example": ["Ice melts into water. Same stuff, new form.", "That is a physical change."], "idea": "Physical change: same stuff. Chemical change: new stuff. pH under 7 is acid.", "worked": ["Q: Is burning wood a chemical change?", "Step 1: Ash and smoke are new stuff.", "Step 2: Yes, it is chemical."]}, "gs-physics": {"section": "GS", "name": "Force, energy, heat, sound, light", "what": ["Physics explains motion, energy, heat, sound, and light."], "why": "Physics also helps on EI and MC tests.", "example": ["Pushing a cart: the harder you push, the faster it goes.", "That is force."], "idea": "Know Newton's three laws and how heat moves: conduction, convection, radiation.", "worked": ["Q: A pan handle gets hot on the stove. Why?", "Step 1: Heat moves through touch.", "Step 2: That is conduction."]}}, "questions": [{"id": "AR-001", "section": "AR", "stem": "Sam buys 3 notebooks at $2.50 each and one pen for $1.25. What is the total cost?", "choices": ["$8.75", "$10.00", "$7.50", "$9.75"], "answer": 0, "difficulty": 1, "topic": "ar-money", "steps": ["The idea: Multiply price by how many. Then add or subtract.", "3 x 2.50 = 7.50.", "Add 1.25.", "Total 8.75.", "Answer: $8.75."], "explanation": "3 x 2.50 = 7.50. Add 1.25. Total 8.75.", "source": "study-pack:quiz"}, {"id": "AR-002", "section": "AR", "stem": "A car drives at 55 miles per hour for 4 hours. How far does it go?", "choices": ["165 miles", "220 miles", "59 miles", "275 miles"], "answer": 1, "difficulty": 1, "topic": "ar-rate", "steps": ["The idea: Distance equals rate times time. D = R x T.", "Distance = rate x time.", "55 x 4 = 220.", "Answer: 220 miles."], "explanation": "Distance = rate x time. 55 x 4 = 220.", "source": "study-pack:quiz"}, {"id": "AR-003", "section": "AR", "stem": "What is 25% of 80?", "choices": ["55", "200", "20", "25"], "answer": 2, "difficulty": 1, "topic": "ar-percent", "steps": ["The idea: Change the percent to a decimal. Then multiply.", "25% = 1/4.", "80 / 4 = 20.", "Answer: 20."], "explanation": "25% = 1/4. 80 / 4 = 20.", "source": "study-pack:quiz"}, {"id": "AR-004", "section": "AR", "stem": "A recipe uses 2 cups of flour for 12 cookies. How many cups are needed for 36 cookies?", "choices": ["4 cups", "8 cups", "12 cups", "6 cups"], "answer": 3, "difficulty": 1, "topic": "ar-ratio", "steps": ["The idea: Add the parts. Find one part. Then multiply.", "36 is 3 times 12.", "So 2 x 3 = 6 cups.", "Answer: 6 cups."], "explanation": "36 is 3 times 12. So 2 x 3 = 6 cups.", "source": "study-pack:quiz"}, {"id": "AR-005", "section": "AR", "stem": "Find the average of 70, 80, 90, 100, and 60.", "choices": ["85", "80", "90", "70"], "answer": 1, "difficulty": 1, "topic": "ar-average", "steps": ["The idea: Average = total divided by how many.", "Sum = 400.", "Divide by 5 = 80.", "Answer: 80."], "explanation": "Sum = 400. Divide by 5 = 80.", "source": "study-pack:quiz"}, {"id": "AR-006", "section": "AR", "stem": "A train goes 150 miles in 2.5 hours. What is its speed?", "choices": ["60 mph", "65 mph", "50 mph", "375 mph"], "answer": 0, "difficulty": 1, "topic": "ar-rate", "steps": ["The idea: Distance equals rate times time. D = R x T.", "Speed = distance / time.", "150 / 2.5 = 60.", "Answer: 60 mph."], "explanation": "Speed = distance / time. 150 / 2.5 = 60.", "source": "study-pack:quiz"}, {"id": "AR-007", "section": "AR", "stem": "A shirt costs $40. It is on sale for 20% off. What is the sale price?", "choices": ["$38.00", "$8.00", "$32.00", "$20.00"], "answer": 2, "difficulty": 1, "topic": "ar-percent", "steps": ["The idea: Change the percent to a decimal. Then multiply.", "20% of 40 = 8.", "40 - 8 = 32.", "Answer: $32.00."], "explanation": "20% of 40 = 8. 40 - 8 = 32.", "source": "study-pack:quiz"}, {"id": "AR-008", "section": "AR", "stem": "The ratio of boys to girls in a club is 3 to 5. There are 24 students. How many are boys?", "choices": ["8", "10", "15", "9"], "answer": 3, "difficulty": 1, "topic": "ar-ratio", "steps": ["The idea: Add the parts. Find one part. Then multiply.", "3 + 5 = 8 parts.", "24 / 8 = 3 per part.", "3 x 3 = 9.", "Answer: 9."], "explanation": "3 + 5 = 8 parts. 24 / 8 = 3 per part. 3 x 3 = 9.", "source": "study-pack:quiz"}, {"id": "AR-009", "section": "AR", "stem": "Dana earns $12 per hour. She works 8 hours a day for 5 days. How much does she earn?", "choices": ["$480", "$60", "$440", "$96"], "answer": 0, "difficulty": 1, "topic": "ar-money", "steps": ["The idea: Multiply price by how many. Then add or subtract.", "12 x 8 = 96 a day.", "96 x 5 = 480.", "Answer: $480."], "explanation": "12 x 8 = 96 a day. 96 x 5 = 480.", "source": "study-pack:quiz"}, {"id": "AR-010", "section": "AR", "stem": "How many minutes are in 3.5 hours?", "choices": ["350", "180", "200", "210"], "answer": 3, "difficulty": 1, "topic": "ar-units", "steps": ["The idea: Change to the same unit first. 1 hour = 60 minutes. 1 foot = 12 inches.", "3.5 x 60 = 210 minutes.", "Answer: 210."], "explanation": "3.5 x 60 = 210 minutes.", "source": "study-pack:quiz"}, {"id": "AR-011", "section": "AR", "stem": "A tank holds 60 gallons. It is 3/4 full. How many gallons are in it?", "choices": ["20", "48", "45", "15"], "answer": 2, "difficulty": 1, "topic": "ar-fractions", "steps": ["The idea: To find a fraction of a number: divide by the bottom. Times the top.", "60 / 4 = 15.", "15 x 3 = 45.", "Answer: 45."], "explanation": "60 / 4 = 15. 15 x 3 = 45.", "source": "study-pack:quiz"}, {"id": "AR-012", "section": "AR", "stem": "Three pencils cost $0.90. At that price, how much do 10 pencils cost?", "choices": ["$9.00", "$3.00", "$3.30", "$2.70"], "answer": 1, "difficulty": 1, "topic": "ar-ratio", "steps": ["The idea: Add the parts. Find one part. Then multiply.", "One pencil = 0.30.", "10 x 0.30 = 3.00.", "Answer: $3.00."], "explanation": "One pencil = 0.30. 10 x 0.30 = 3.00.", "source": "study-pack:quiz"}, {"id": "AR-013", "section": "AR", "stem": "A wall is 12 feet by 9 feet. One can of paint covers 36 square feet. How many cans are needed?", "choices": ["2", "6", "3", "4"], "answer": 2, "difficulty": 1, "topic": "ar-geometry", "steps": ["The idea: Area = length x width. Perimeter = add all sides.", "Area = 12 x 9 = 108.", "108 / 36 = 3.", "Answer: 3."], "explanation": "Area = 12 x 9 = 108. 108 / 36 = 3.", "source": "study-pack:quiz"}, {"id": "AR-014", "section": "AR", "stem": "What is the simple interest on $500 at 4% per year for 3 years?", "choices": ["$560", "$20", "$120", "$60"], "answer": 3, "difficulty": 1, "topic": "ar-interest", "steps": ["The idea: Interest = principal times rate times time.", "Interest = P x r x t.", "500 x 0.04 x 3 = 60.", "Answer: $60."], "explanation": "Interest = P x r x t. 500 x 0.04 x 3 = 60.", "source": "study-pack:quiz"}, {"id": "AR-015", "section": "AR", "stem": "Marcus has read 3/8 of a 240-page book. How many pages are left?", "choices": ["150", "60", "90", "180"], "answer": 0, "difficulty": 2, "topic": "ar-fractions", "steps": ["The idea: To find a fraction of a number: divide by the bottom. Times the top.", "3/8 of 240 = 90.", "240 - 90 = 150.", "Answer: 150."], "explanation": "3/8 of 240 = 90. 240 - 90 = 150.", "source": "study-pack:quiz"}, {"id": "AR-016", "section": "AR", "stem": "Two numbers add up to 48. They differ by 6. What is the larger number?", "choices": ["21", "27", "24", "42"], "answer": 1, "difficulty": 2, "topic": "ar-number", "steps": ["The idea: Write what you know. Use the middle or the sum.", "Larger = (48 + 6) / 2 = 27.", "Smaller = 21.", "Answer: 27."], "explanation": "Larger = (48 + 6) / 2 = 27. Smaller = 21.", "source": "study-pack:quiz"}, {"id": "AR-017", "section": "AR", "stem": "Pipe A fills a pool in 6 hours. Pipe B fills it in 3 hours. How long do they take together?", "choices": ["9 hours", "2 hours", "4.5 hours", "3 hours"], "answer": 1, "difficulty": 2, "topic": "ar-work", "steps": ["The idea: Find the part of the job done in 1 hour. Then flip it.", "In 1 hour: 1/6 + 1/3 = 1/2.", "So the pool takes 2 hours.", "Answer: 2 hours."], "explanation": "In 1 hour: 1/6 + 1/3 = 1/2. So the pool takes 2 hours.", "source": "study-pack:quiz"}, {"id": "AR-018", "section": "AR", "stem": "A truck gets 28 miles per gallon. Its tank holds 14 gallons thin minutes. Over time, regular exercise can also improve sleep. Yet many people skip exercise because they feel too tired. Ironically, a short walk often gives them more energy, not less.", "passageId": "P15"}, {"id": "PC-041", "section": "PC", "stem": "In the passage, the word IRONICALLY signals that the result is:", "choices": ["hard to measure", "the opposite of what people expect", "well known by all", "very slow"], "answer": 1, "difficulty": 2, "topic": "pc-vocab", "steps": ["Read the question first. What type is it? Word meaning in a passage.", "Find the line in the passage that answers it.", "People expect to feel more tired, but they feel more energy.", "Answer: the opposite of what people expect."], "explanation": "People expect to feel more tired, but they feel more energy.", "source": "study-pack:practice-PC2", "passage": "Exercise helps the mind as well as the body. A brisk walk can lift a person's mood within minutes. Over time, regular exercise can also improve sleep. Yet many people skip exercise because they feel too tired. Ironically, a short walk often gives them more energy, not less.", "passageId": "P15"}, {"id": "PC-042", "section": "PC", "stem": "Which statement would the author most likely agree with?", "choices": ["A walk should last all day.", "Walking is only for young people.", "A tired person may feel better after a short walk.", "Exercise is bad for sleep."], "answer": 2, "difficulty": 3, "topic": "pc-inference", "steps": ["Read the question first. What type is it? Inference (reading between lines).", "Find the line in the passage that answers it.", "The last sentence supports this idea.", "Answer: A tired person may feel better after a short walk."], "explanation": "The last sentence supports this idea.", "source": "study-pack:practice-PC2", "passage": "Exercise helps the mind as well as the body. A brisk walk can lift a person's mood within minutes. Over time, regular exercise can also improve sleep. Yet many people skip exercise because they feel too tired. Ironically, a short walk often gives them more energy, not less.", "passageId": "P15"}, {"id": "PC-043", "section": "PC", "stem": "What happens to the liquid in the tube when heat rises?", "choices": ["It turns to gas at once.", "It stays the same.", "It shrinks and falls.", "It expands and climbs."], "answer": 3, "difficulty": 1, "topic": "pc-detail", "steps": ["Read the question first. What type is it? Finding details.", "Find the line in the passage that answers it.", "The passage says the liquid expands and climbs the tube.", "Answer: It expands and climbs."], "explanation": "The passage says the liquid expands and climbs the tube.", "source": "study-pack:practice-PC2", "passage": "A thermometer measures temperature. Most home thermometers use a thin tube of liquid. When heat rises, the liquid expands and climbs the tube. When it cools, the liquid shrinks and falls. Marks along the tube let people read the temperature.", "passageId": "P16"}, {"id": "PC-044", "section": "PC", "stem": "The marks along the tube are used to:", "choices": ["cool the tube", "read the temperature", "add liquid", "tell the time"], "answer": 1, "difficulty": 1, "topic": "pc-detail", "steps": ["Read the question first. What type is it? Finding details.", "Find the line in the passage that answers it.", "The last sentence says the marks let people read the temperature.", "Answer: read the temperature."], "explanation": "The last sentence says the marks let people read the temperature.", "source": "study-pack:practice-PC2", "passage": "A thermometer measures temperature. Most home thermometers use a thin tube of liquid. When heat rises, the liquid expands and climbs the tube. When it cools, the liquid shrinks and falls. Marks along the tube let people read the temperature.", "passageId": "P16"}, {"id": "PC-045", "section": "PC", "stem": "What is the main idea of the passage?", "choices": ["Teams need no leader.", "Good leaders listen before they decide.", "Problems at type is it? Inference (reading between lines).", "Find the line in the passage that answers it.", "The last sentence says they usually trust them more.", "Answer: They tend to trust their leaders."], "explanation": "The last sentence says they usually trust them more.", "source": "study-pack:practice-PC3", "passage": "A good leader listens first. When a team member brings a problem, the leader asks questions before giving orders. This shows respect and often reveals facts the leader did not know. Then the leader can choose a better plan. Teams with listening leaders usually trust them more.", "passageId": "P17"}, {"id": "PC-048", "section": "PC", "stem": "According to the passage, what makes batteries lose power faster?", "choices": ["Heat", "Darkness", "Dry air", "Cold"], "answer": 0, "difficulty": 1, "topic": "pc-detail", "steps": ["Read the question first. What type is it? Finding details.", "Find the line in the passage that answers it.", "The passage says heat makes the loss worse.", "Answer: Heat."], "explanation": "The passage says heat makes the loss worse.", "source": "study-pack:practice-PC3", "passage": "Most batteries slowly lose power when they sit in storage. Heat makes this loss worse. For this reason, spare batteries should be kept in a cool, dry place. Before using a spare, check the date printed on the package.", "passageId": "P18"}, {"id": "PC-049", "section": "PC", "stem": "What should a person check on a spare battery before using it?", "choices": ["The color", "The brand name", "The weight", "The date on the package"], "answer": 3, "difficulty": 1, "topic": "pc-detail", "steps": ["Read the question first. What type is it? Finding details.", "Find the line in the passage that answers it.", "The last sentence says to check the printed date.", "Answer: The date on the package."], "explanation": "The last sentence says to check the printed date.", "source": "study-pack:practice-PC3", "passage": "Most batteries slowly lose power when they sit in es"], "answer": 1, "difficulty": 1, "topic": "mk-triangles-angles", "steps": ["The idea: Angles in a triangle add to 180. For a right triangle, a^2 + b^2 = c^2.", "Angles add to 180.", "50 + 60 = 110.", "180 - 110 = 70.", "Answer: 70 degrees."], "explanation": "Angles add to 180. 50 + 60 = 110. 180 - 110 = 70.", "source": "study-pack:quiz"}, {"id": "MK-006", "section": "MK", "stem": "What is the value of 5 + 3 x 4?", "choices": ["32", "20", "17", "12"], "answer": 2, "difficulty": 1, "topic": "mk-number", "steps": ["The idea: Order of operations: parentheses, exponents, times and divide, then plus and minus.", "Multiply first: 3 x 4 = 12.", "Then 5 + 12 = 17.", "Answer: 17."], "explanation": "Multiply first: 3 x 4 = 12. Then 5 + 12 = 17.", "source": "study-pack:quiz"}, {"id": "MK-007", "section": "MK", "stem": "Solve for x: x/4 - 2 = 3", "choices": ["20", "4", "8", "24"], "answer": 0, "difficulty": 1, "topic": "mk-equations", "steps": ["The idea: Undo the steps. Do the same thing to both sides.", "Add 2: x/4 = 5.", "Multiply by 4: x = 20.", "Answer: 20."], "explanation": "Add 2: x/4 = 5. Multiply by 4: x = 20.", "source": "study-pack:quiz"}, {"id": "MK-008", "section": "MK", "stem": "Expand: (x + 3)(x + 2)", "choices": ["x^2 + 5x + 5", "x^2 + 6x + 5", "x^2 + 6", "x^2 + 5x + 6"], "answer": 3, "difficulty": 1, "topic": "mk-polynomials", "steps": ["The idea: Multiply each term by each term (FOIL). To factor, find two numbers that multiply and add.", "x times x = x^2.", "2x + 3x = 5x.", "3 times 2 = 6.", "Result x^2 + 5x + 6.", "Answer: x^2 + 5x + 6."], "explanation": "x times x = x^2. 2x + 3x = 5x. 3 times 2 = 6. Result x^2 + 5x + 6.", "source": "study-pack:quiz"}, {"id": "MK-009", "section": "MK", "stem": "Factor: x^2 - 9", "choices": ["(x - 9)(x + 1)", "(x - 3)(x + 3)", "(x + 3)(x + 3)", "(x - 3)(x - 3)"], "answer": 1, "difficulty": 1, "topic": "mk-polynomials", "steps": ["The idea: Multiply each term by each term (FOIL). To factor, find two numbers that multiply and add.", "x^2 - 9 is a difference of squares.", "It equals (x - 3)(x + 3).", "Answer: (x - 3)(x + 3)."], "explanation": "x^2 - 9 is a difference of squares. It equals (x - 3)(x + 3).", "source": "study-pack:quiz"}, {"id": "MK-010", "section": "MK", "stem": "What is the area of a circle with a radius of 5?", "choices": ["50π", "5π", "10π", "25π"], "answer": 3, "difficulty": 1, "topic": "mk-area-volume", "steps": ["The idea: Rectangle: L x W. Triangle: half of base x height. Circle: pi x r^2. Box: L x W x H.", "Area = π x r^2 = π x 25 = 25π.", "Answer: 25π."], "explanation": "Area = π x r^2 = π x 25 = 25π.", "source": "study-pack:quiz"}, {"id": "MK-011", "section": "MK", "stem": "What is the circumference of a circle with a diameter of 14?", "choices": ["14π", "49π", "7π", "28π"], "answer": 0, "difficulty": 1, "topic": "mk-area-volume", "steps": ["The idea: Rectangle: L x W. Triangle: half of base x height. Circle: pi x r^2. Box: L x W x H.", "Circumference = π x diameter = 14π.", "Answer: 14π."], "explanation": "Circumference = π x diameter = 14π.", "source": "study-pack:quiz"}, {"id": "MK-012", "section": "MK", "stem": "Simplify: (2x)(3x^2)", "choices": ["6x^2", "5x^2", "6x^3", "5x^3"], "answer": 2, "difficulty": 1, "topic": "mk-polynomials", "steps": ["The idea: Multiply each term by each term (FOIL). To factor, find two numbers that multiply and add.", "Multiply numbers: 2 x 3 = 6.", "Add powers: x^1 x x^2 = x^3.", "Result 6x^3.", "Answer: 6x^3."], "explanation": "Multiply numbers: 2 x 3 = 6. Add powers: x^1 x x^2 = x^3. Result 6x^3.", "source": "study-pack:quiz"}, {"id": "MK-013", "section": "MK", "stem": "Solve for x: 2(x - 3) = 10", "choices": ["2", "5", "13", "8"], "answer": 3, "difficulty": 1, "topic": "mk-equations", "steps": ["The idea: Undo the steps. Do the same thing to both sides.", "Divide by 2: x - 3 = 5.", "Add 3: x = 8.", "Answer: 8."], "explanation": "Divide by 2: x - 3 = 5. Add 3: x = 8.", "source": "study-pack:quiz"}, {"id": "MK-014", "section": "MK", "stem": "What is the slope of the line through (1, 2) and (3, 8)?", "choices": ["1/3", "3", "6", "2"], "answer": 1, "difficulty": 1, "topic": "mk-slope", "steps": ["The idea: Slope = change in y divided by change in x. In y = mx + b, m is the slope.", "Slope = rise / run = (8 - 2) / (3 - 1) = 6 / 2 = 3.", "Answer: 3."], "explanation": "Slope = rise / run = (8 - 2) / (3 - 1) = 6 / 2 = 3.", "source": "study-pack:quiz"}, {"id": "MK-015", "section": "MK", "stem": "Which of these numbers is prime?", "choices": ["23", "27", "33", "21"], "answer": 0, "difficulty": 2, "topic": "mk-number", "steps": ["The idea: Order of operations: parentheses, exponents, times and divide, then plus and minus.", "21 = 3 x 7.", "27 = 3 x 9.", "33 = 3 x 11.", "23 has no other factors.", "Answer: 23."], "explanation": "21 = 3 x 7. 27 = 3 x 9. 33 = 3 x 11. 23 has no other factors.", "source": "study-pack:quiz"}, {"id": "MK-016", "section": "MK", "stem": "What is the least common multiple of 6 and 8?", "choices": ["48", "14", "24", "12"], "answer": 2, "difficulty": 2, "topic": "mk-number", "steps": ["The idea: Order of operations: parentheses, exponents, times and divide, then plus and minus.", "Multiples of 8: 8, 16, 24.", "24 is also a multiple of 6.", "LCM = 24.", "Answer: 24."], "explanation": "Multiples of 8: 8, 16, 24. 24 is also a multiple of 6. LCM = 24.", "source": "study-pack:quiz"}, {"id": "MK-017", "section": "MK", "stem": "What is the greatest common factor of 18 and 30?", "choices": ["6", "90", "3", "9"], "answer": 0, "difficulty": 2, "topic": "mk-number", "steps": ["The idea: Order of operations: parentheses, exponents, times and divide, then plus and minus.", "Factors of 18 and 30 share 1, 2, 3, 6.", "The greatest is 6.", "Answer: 6."], "explanation": "Factors of 18 and 30 share 1, 2, 3, 6. The greatest is 6.", "source": "study-pack:quiz"}, {"id": "MK-018", "section": "MK", "stem": "A right triangle has legs of 6 and 8. What is the hypotenuse?", "choices": ["14", "7", "12", "1 ply means add powers. Divide means subtract powers.", "Subtract powers: 2^(5-2) = 2^3 = 8.", "Answer: 8."], "explanation": "Subtract powers: 2^(5-2) = 2^3 = 8.", "source": "study-pack:practice-MK2"}, {"id": "MK-068", "section": "MK", "stem": "A triangle has a base of 14 and a height of 5. What is its area?", "choices": ["19", "45", "35", "70"], "answer": 2, "difficulty": 1, "topic": "mk-area-volume", "steps": ["The idea: Rectangle: L x W. Triangle: half of base x height. Circle: pi x r^2. Box: L x W x H.", "Area = 1/2 x 14 x 5 = 35.", "Answer: 35."], "explanation": "Area = 1/2 x 14 x 5 = 35.", "source": "study-pack:practice-MK2"}, {"id": "MK-069", "section": "MK", "stem": "What is 4.763 rounded to the nearest tenth?", "choices": ["5.0", "4.7", "4.76", "4.8"], "answer": 3, "difficulty": 1, "topic": "mk-number", "steps": ["The idea: Order of operations: parentheses, exponents, times and divide, then plus and minus.", "The hundredths digit is 6, so round the 7 up to 8.", "Answer: 4.8."], "explanation": "The hundredths digit is 6, so round the 7 up to 8.", "source": "study-pack:practice-MK2"}, {"id": "MK-070", "section": "MK", "stem": "Expand: (x - 4)(x + 4)", "choices": ["x^2 + 16", "x^2 - 16", "x^2 - 8", "x^2 - 8x - 16"], "answer": 1, "difficulty": 2, "topic": "mk-polynomials", "steps": ["The idea: Multiply each term by each term (FOIL). To factor, find two numbers that multiply and add.", "Difference of squares.", "The middle terms cancel.", "Left: x^2 - 16.", "Answer: x^2 - 16."], "explanation": "Difference of squares. The middle terms cancel. Left: x^2 - 16.", "source": "study-pack:practice-MK2"}, {"id": "MK-071", "section": "MK", "stem": "What is the slope of the line through (2, -1) and (6, 7)?", "choices": ["3", "1/2", "2", "-2"], "answer": 2, "difficulty": 2, "topic": "mk-slope", "steps": ["The idea: Slope = change in y divided by change in x. In y = mx + b, m is the slope.", "Rise = 7 - (-1) = 8.", "Run = 6 - 2 = 4.", "8 / 4 = 2.", "Answer: 2."], "explanation": "Rise = 7 - (-1) = 8. Run = 6 - 2 = 4. 8 / 4 = 2.", "source": "study-pack:practice-MK2"}, {"id": "MK-072", "section": "MK", "stem": "A cylinder has a radius of 3 and a height of 5. What is its volume? (Volume = pi x r^2 x h)", "choices": ["45π", "15π", "90π", "30π"], "answer": 0, "difficulty": 2, "topic": "mk-area-volume", "steps": ["The idea: Rectangle: L x W. Triangle: half of base x height. Circle: pi x r^2. Box: L x W x H.", "pi x 9 x 5 = 45 pi.", "Answer: 45π."], "explanation": "pi x 9 x 5 = 45 pi.", "source": "study-pack:practice-MK2"}, {"id": "MK-073", "section": "MK", "stem": "Solve: 5 - 2x < 11", "choices": ["x > 3", "x < -3", "x < 3", "x > -3"], "answer": 3, "difficulty": 3, "topic": "mk-inequalities", "steps": ["The idea: If you multiply or divide by a negative, FLIP the sign.", "Subtract 5: -2x < 6.", "Divide by -2 and FLIP the sign: x > -3.", "Answer: x > -3."], "explanation": "Subtract 5: -2x < 6. Divide by -2 and FLIP the sign: x > -3.", "source": "study-pack:practice-MK2"}, {"id": "MK-074", "section": "MK", "stem": "Simplify: the square root of 72", "choices": ["12√2", "6√3", "6√2", "36√2"], "answer": 2, "difficulty": 3, "topic": "mk-exponents", "steps": ["The idea: Same base: multiply means add powers. Divide means subtract powers.", "72 = 36 x 2.", "The root of 36 is 6.", "So 6√2.", "Answer: 6√2."], "explanation": "72 = 36 x 2. The root of 36 is 6. So 6√2.", "source": "study-pack:practice-MK2"}, {"id": "MK-075", "section": "MK", "stem": "If f(x) = x^2 + 3x - 2, what is f(3)?", "choices": ["10", "16", "18", "12"], "answer": 1, "difficulty": 3, "topic": "mk-functions", "steps": ["The idea: Replace x with the number. Then follow order of operations.", "9 + 9 - 2 = 16.", "Answer: 16."], "explanation": "9 + 9 - 2 = 16.", "source": "study-pack:practice-MK2"}, {"id": "MK-076", "section": "MK", "stem": "Solve for x: 6x - 4 = 20", "choices": ["24", "16", "4", "2.67"], "answer": 2, "difficulty": 1, "topic": "mk-equations", "steps": ["The idea: Undo the steps. Do the same thing to both sides.", "Add 4: 6x = 24.", "Divide by 6: x = 4.", "Answer: 4."], "explanation": "Add 4: 6x = 24. Divide by 6: x = 4.", "source": "study-pack:practice-MK3"}, {"id": "MK-077", "section": "MK", "stem": "What is (2^3)^2?", "choices": ["16", "64", "32", "256"], "answer": 1, "difficulty": 1, "topic": "mk-exponents", "steps": ["The idea: Same base: multiply means add powers. Divide means subtract powers.", "Multiply powers: 2^(3x2) = 2^6 = 64.", "Answer: 64."], "explanation": "Multiply powers: 2^(3x2) = 2^6 = 64.", "source": "study-pack:practice-MK3"}, {"id": "MK-078", "section": "MK", "stem": "A circle has a diameter of 10. What is its area?", "choices": ["10π", "100π", "50π", "25π"], "answer": 3, "difficulty": 1, "topic": "mk-area-volume", "steps": ["The idea: Rectangle: L x W. Triangle: half of base x height. Circle: pi x r^2. Box: L x W x H.", "Radius = 5.", "Area = pi x 5^2 = 25 pi.", "Answer: 25π."], "explanation": "Radius = 5. Area = pi x 5^2 = 25 pi.", "source": "study-pack:practice-MK3"}, {"id": "MK-079", "section": "MK", "stem": "What is the greatest common factor of 24 and 36?", "choices": ["12", "72", "4", "6"], "answer": 0, "difficulty": 1, "topic": "mk-number", "steps": ["The idea: Order of operations: parentheses, exponents, times and divide, then plus and minus.", "Factors of 24 and 36 share 1, 2, 3, 4, 6, 12.", "The greatest is 12.", "Answer: 12."], "explanation": "Factors of 24 and 36 share 1, 2, 3, 4, 6, 12. The greatest is 12.", "source": "study-pack:practice-MK3"}, {"id": "MK-080", "section": "MK", "stem": "What is the median of 14, 9, 21, 6, 17, and 12?", "choices": ["14", "12", "13", "15"], "answer": 2, "difficulty": 2, "topic": "mk-number", "steps": ["The idea: Order of operations: parentheses, exponents, times and divide, then plus and minus.", "Order: 6, 9, 12, 14, 17, 21.", "Middle two are 12 and 14.", "Their average is 13.", "Answer: 13."], "explanation": "Order: 6, 9, 12, 14, 17, 21. Middle two are 12 and 14. Thei <script>window.TUTOR_RULES="# Tutor Rules for the Bot\n\nThese rules are for the bot.\nUse them every time he says he is stuck.\n\nThe goal: he learns to solve it himself.\nGiving the answer fast does not teach him.\n\n## The Big Rules\n\n- Never give the final answer right away.\n- Use short sentences. Max about 12 words.\n- One idea at a time.\n- Ask only one question at a time.\n- Wait for his reply before you go on.\n- Praise effort. Every time.\n- Never say \"easy\" or \"obvious\".\n- Never rush him.\n- Do not correct his spelling or typing.\n- Check his thinking, not his spelling.\n\n## Dyslexia-Friendly Style\n\n- Use short lines. Add blank lines between steps.\n- Use numbered steps.\n- Put key numbers on their own line.\n- Say symbols in words: \"plus\", \"times\", \"divided by\".\n- Offer to read a long passage in small chunks.\n- Use plain words. If a hard word shows up, explain it.\n- Let him answer in his own words.\n- Let him answer by voice if his device allows it.\n- Do not use long paragraphs.\n\n## The Method (Step by Step)\n\n### Step 1: Say what it is\n\nTell him what the thing is, in plain words.\nThen say why it matters.\n\n- What it is: 1 or 2 short sentences.\n- Why it matters: 1 short sentence.\n\n### Step 2: Tiny real-life example\n\nGive one small example from daily life.\nKeep it to 2 or 3 short lines.\nUse food, money, cars, phones, or the Navy.\nDo NOT use the numbers from his problem.\n\n### Step 3: Ask him to try\n\nAsk: \"Want to try the first step?\"\nIf he tries, go to Step 5.\nIf he says \"I don't know\", use the hint ladder.\n\n### Step 4: The hint ladder\n\nGive one hint at a time.\nAfter each hint, ask him to try.\n\n- Hint 1: The idea.\n  - Name the main idea or rule.\n  - No numbers from his problem yet.\n- Hint 2: The first step.\n  - Show only the first move.\n  - Do not finish the problem.\n- Hint 3: A worked example.\n  - Solve a SIMILAR problem with different numbers.\n  - Show every step. Keep it short.\n  - Then say: \"Now try yours the same way.\"\n\n### Step 5: Check his work kindly\n\nWhen he tries:\n\n1. Say what he did well first.\n2. Find the first step that is right.\n3. Find the first step that is off.\n4. Ask a question that points at it.\n5. Let him fix it.\n\nDo not just say \"wrong\".\nSay \"not yet\" or \"close\".\n\n### Step 6: When to reveal the answer\n\nOnly reveal the answer when BOTH are true:\n\n- You gave all 3 hints.\n- AND he tried the next step, OR he asks for the answer.\n\nIf he asks early, say:\n\"I hear you. Let me give you a hint first. You are close.\"\n\nThen give the next hint.\n\nWhen you do reveal:\n\n- Show the answer step by step.\n- Explain why each step works.\n- Then give him a new, similar problem.\n- Praise the effort.\n\n### Step 7: Lock it in\n\n- Ask him to say the rule in his own words.\n- Give one similar problem to try alone.\n- Log the topic in the tracker notes if it was hard.\n  - Example: `python3 tracker.py add MK 6 10 \"fractions hard\"`\n\n## If He Gets It Right\n\n- Say it is right. Say why it is right.\n- Praise the effort. Not just the answer.\n- Ask him to tell you the steps in order.\n- If he got it fast, try a harder one.\n\n## Praise Lines (use different ones)\n\n- \"Nice try. You showed your work.\"\n- \"Good. You did not give up.\"\n- \"That is the right first step.\"\n- \"I like how you checked it.\"\n- \"You are thinking like a technician.\"\n- \"Mistakes help your brain learn.\"\n- \"Step 1 is right. Let's look at step 2.\"\n- \"You are closer than you think.\"\n\n## Watch for Frustration\n\nSigns: short replies, \"I can't\", \"this is dumb\".\n\n- Slow down.\n- Say: \"This one is tricky. Many people miss it.\"\n- Make the step smaller.\n- Offer a break. Offer an easier one first.\n- Never shame him.\n\n## During a Timed Test\n\n- Do not tutor while the clock runs.\n- Say: \"Skip it and come back.\"\n- After he says \"stop\", go over the misses.\n- Use the hint ladder on each miss.\n\n## Quick Templates by Subject\n\n- AR (word problems):\n  - Hint 1: What is the question asking for?\n  - Hint 2: Write down the numbers. Pick the operation.\n  - Hint 3: Worked example with new numbers.\n- MK (math skills):\n  - Hint 1: Name the rule or formula.\n  - Hint 2: Do the first step only.\n  - Hint 3: Worked example.\n- WK (words):\n  - Hint 1: Look at the sentence. What is the mood?\n  - Hint 2: Look for word parts. (See 01b_word_parts.md.)\n  - Hint 3: Use the word in a sample sentence.\n- PC (passages):\n  - Hint 1: Read the question first. What type is it?\n  - Hint 2: Find the line that answers it.\n  - Hint 3: Show how a similar question is solved.\n- GS (science):\n  - Hint 1: What topic is this? Life, earth, or physical?\n  - Hint 2: Give a memory hook.\n  - Hint 3: Give a similar fact and its answer.\n- EI (electronics):\n  - Hint 1: Name the formula. (Ohm's law or power.)\n  - Hint 2: Write what you know and what you need.\n  - Hint 3: Solve a similar circuit with new numbers.\n\n## Sample Dialogue 1: A Fraction Problem\n\nProblem: What is 1/2 + 1/3?\n\n**You:** I don't get how to add fractions.\n\n**Bot:**\nA fraction is a part of a whole.\nThe bottom number tells the size of each piece.\nAdding works only when the pieces are the same size.\nWhy it matters: AR and MK use fractions a lot.\n\n**Bot:**\nTiny example.\nYou eat half a candy bar.\nLater you eat a quarter of a different bar.\nThe pieces are different sizes.\nSo you cannot just count them.\n\n**Bot:** Want to try your problem? Tell me your first step.\n\n**You:** 2/5?\n\n**Bot:**\nGood try. You showed your work.\nYou added the tops and the bottoms.\nLet's check it.\nHalf a bar is a big piece.\nIs 2/5 more or less than half?\n\n**You:** less\n\n**Bot:**\nYes. Less than half.\nBut you started with half and added more.\nSo the answer should be MORE than half.\nSomething is off. Want a hint?\n\n**You:** ok\n\n**Bot:**\nHint 1 (the idea):\nFractions need the same size pieces before you add.\nThe bottom numbers must match.\nWant to try again?\n\n**You:** i dont know how\n\n**Bot:**\nNo problem.\nHint 2 (the first step):\nFind a number that both 2 and 3 go into evenly.\nTry counting by 2s and 3s.\nWhat do you find?\n\n**You:** 6\n\n**Bot:**\nYes! 6 works.\nThat is the common bottom number.\nWant to change 1/2 into sixths?\n\n**You:** not sure\n\n**Bot:**\nHint 3 (a similar example, new numbers):\nAdd 1/2 + 1/4.\nMake the bottoms match: 4.\n1/2 = 2/4. (Top and bottom times 2.)\n2/4 + 1/4 = 3/4.\nNow try yours the same way.\n\n**You:** 1/2 = 3/6. 1/3 = 2/6. So 5/6\n\n**Bot:**\nYes! 5/6 is right.\nYou did every step.\nCheck: 5/6 is more than half. That fits.\nCan you say the rule in your own words?\n\n**You:** make the bottoms the same then add the tops\n\n**Bot:**\nPerfect. That is the whole rule.\nHere is one to try alone: 1/4 + 1/3.\n\n## Sample Dialogue 2: An Ohm's Law Problem\n\nProblem: A 12 volt battery is connected to a 4 ohm resistor. How much current flows?\n\n**You:** just tell me the answer\n\n**Bot:**\nI hear you. This one is tricky at first.\nLet me help you get it yourself.\nYou will remember it better.\nFirst, what it is.\n\n**Bot:**\nOhm's law links three things.\nVoltage (volts) is the push.\nResistance (ohms) is how hard it is to flow.\nCurrent (amps) is how much flows.\nWhy it matters: EI tests use it a lot.\n\n**Bot:**\nTiny example.\nThink of a garden hose.\nWater pressure is the push.\nA pinched hose is the resistance.\nThe water coming out is the current.\nMore push: more water.\nMore pinch: less water.\n\n**Bot:** Want to try the first step?\n\n**You:** idk\n\n**Bot:**\nHint 1 (the idea):\nCurrent equals voltage divided by resistance.\nWe write it: I = V / R.\nWhich number in your problem is V?\n\n**You:** 12?\n\n**Bot:**\nYes. 12 volts is V.\nYou found it. Nice.\nWhich number is R?\n\n**You:** 4\n\n**Bot:**\nRight. 4 ohms is R.\nHint 2 (the first step):\nWrite the formula with your numbers.\nI = V / R\nI = 12 / 4\nWant to finish it?\n\n**You:** ok just tell me\n\n**Bot:**\nYou are one step away.\nHere is Hint 3 (a similar example, new numbers):\nA 10 volt battery and a 5 ohm resistor.\nI = 10 / 5\nI = 2 amps.\nNow try yours the same way.\n\n**You:** 12 / 4 = 3\n\n**Bot:**\nYes! 3 amps.\nAlways add the unit. Amps.\nYou found V and R yourself. Good work.\nQuick check.\nSay the resistor were 6 ohms.\nWould the current go up or down?\n\n**You:** down\n\n**Bot:**\nRight. More resistance means less current.\nTry this one alone: 24 volts and 8 ohms.\n\n## Note on Answer Keys\n\nA finished test is not the same as being stuck.\nAfter he finishes a test, he may read the key.\nKeys have a one-line reason for each answer.\nIf a reason is not enough, use the hint ladder to teach it.\n";
</script>

/* ---------------- storage ---------------- */
const KEY = 'asvab.';
const Store = {
  get(k, d){ try{ const v = localStorage.getItem(KEY+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(KEY+k, JSON.stringify(v)); }catch(e){ toast('Could not save. Storage is full or blocked.'); } },
  keys(){ return Object.keys(localStorage).filter(k => k.startsWith(KEY)).map(k => k.slice(KEY.length)); }
};

/* ---------------- daily streak ---------------- */
function bumpDaily(n=1){ const d = Store.get('daily', {}); d[today()] = (d[today()]||0) + n; Store.set('daily', d); renderStreak(); }
function streakInfo(){
  const d = Store.get('daily', {}); const t = d[today()]||0; let streak = 0;
  const day = new Date(); if (t < DAILY_GOAL) day.setDate(day.getDate()-1);
  while ((d[today(day)]||0) >= DAILY_GOAL){ streak++; day.setDate(day.getDate()-1); }
  return { todayCount:t, streak, goalMet: t >= DAILY_GOAL };
}
function renderStreak(){ const s = streakInfo(); const el = document.getElementById('streak');
  if (el) el.textContent = `Today ${Math.min(s.todayCount,DAILY_GOAL)}/${DAILY_GOAL}${s.goalMet?' done':''} | Streak ${s.streak} day${s.streak===1?'':'s'}`; }

/* ---------------- spaced repetition (Leitner, 5 boxes) ---------------- */
const BOX_DAYS = [0, 0, 1, 3, 7, 16];   // index = box. Box 1 comes back after 5 minutes.
function srsUpdate(qid, correct, conf){
  const srs = Store.get('srs', {}); const c = srs[qid] || { box:0, right:0, wrong:0 };
  if (!correct){ c.box = 1; c.wrong++; }
  else { c.right++;
    if (conf === 'sure') c.box = Math.min(5, Math.max(1, c.box) + 1);
    else if (conf === 'shaky') c.box = Math.min(3, Math.max(1, c.box) + 1);
    else c.box = Math.max(1, c.box);               // guessed: stays, comes back tomorrow
  }
  const ms = c.box === 1 ? 5*60*1000 : BOX_DAYS[c.box]*86400000;
  c.due = Date.now() + (correct && conf==='guessed' ? 86400000 : ms);
  c.seen = Date.now(); srs[qid] = c; Store.set('srs', srs);
}
function dueList(sec){ const srs = Store.get('srs', {}); const now = Date.now();
  return sectionPool(sec).filter(q => srs[q.id] && srs[q.id].due <= now).sort((a,b) => srs[a.id].box - srs[b.id].box || srs[a.id].due - srs[b.id].due); }

/* ---------------- adaptive difficulty ---------------- */
function level(sec){ return Store.get('level', {})[sec] || 1; }
function adaptRecord(sec, correct){
  const rec = Store.get('recent', {}); const lv = Store.get('level', {});
  const r = (rec[sec] || []).concat(correct ? 1 : 0).slice(-10); let msg = '';
  const cur = lv[sec] || 1;
  if (r.length >= 8){
    const acc = r.reduce((a,b)=>a+b,0) / r.length;
    if (acc > 0.8 && cur < 3){ lv[sec] = cur+1; rec[sec] = []; Store.set('level', lv); Store.set('recent', rec); return `Level up! ${SECTIONS[sec]} is now level ${cur+1} of 3.`; }
    if (acc < 0.6 && cur > 1){ lv[sec] = cur-1; rec[sec] = []; Store.set('level', lv); Store.set('recent', rec); return `Level set to ${cur-1} of 3. We will build up again.`; }
  }
  rec[sec] = r; Store.set('recent', rec); return msg;
}
function pickQuestions(sec, n, opts={}){
  const pool = sectionPool(sec).filter(q => !opts.topic || q.topic === opts.topic);
  const srs = Store.get('srs', {}); const now = Date.now(); const lv = level(sec);
  const chosen = []; const used = new Set();
  const take = q => { if (!used.has(q.id) && chosen.length < n){ chosen.push(q); used.add(q.id); } };
  dueList(sec).filter(q => pool.includes(q)).slice(0, Math.ceil(n/2)).forEach(take);    // missed ones first
  const fresh = q => !srs[q.id];
  const notDue = q => srs[q.id] && srs[q.id].due > now;
  const tiers = [ q => fresh(q) && q.difficulty===lv, q => fresh(q) && Math.abs(q.difficulty-lv)===1, q => fresh(q), q => !notDue(q), () => true ];
  for (const t of tiers){ shuffle(pool.filter(t)).forEach(take); if (chosen.length >= n) break; }
  if (sec === 'PC'){ // keep questions about the same passage next to each other
    const order = []; chosen.forEach(q => { if (!order.includes(q.passageId)) order.push(q.passageId); });
    chosen.sort((a,b) => order.indexOf(a.passageId) - order.indexOf(b.passageId));
  }
  return chosen;
}

/* ---------------- topics: re-learn vs reps ---------------- */
function topicRecord(topic, correct, conf){
  const t = Store.get('topics', {}); const r = t[topic] || { seen:0, relearn:false, sureStreak:0, misses:0 };
  r.seen++; r.last = today();
  if (!correct || conf !== 'sure'){ r.relearn = true; r.sureStreak = 0; if (!correct) r.misses++; }
  else { r.sureStreak++; if (r.sureStreak >= 3) r.relearn = false; }
  t[topic] = r; Store.set('topics', t); return r;
}

    answer:q.answer, answerText:q.choices[q.answer], explanation:q.explanation, steps:q.steps, q });
  Store.set('errors', errs.slice(0, 500));
}

/* ---------------- text to speech with read-along ---------------- */
// Words are wrapped in <span class="w">. We speak a "sayable" version (symbols in words)
// and map each boundary event back to the word span. If boundary events never fire
// (common with online voices), we estimate timing from word length and the rate.
function wordsHTML(text){
  return String(text ?? '').split(/(\s+)/).map(p => /^\s+$/.test(p) || p==='' ? p : `<span class="w">${esc(p)}</span>`).join('');
}
function sayable(word, prev, next){
  let w = word;
  if (w === 'x' && prev && next && /[\d)]$/.test(prev) && /^[\d(]/.test(next)) return 'times';
  if (w === 'x' && prev && next && /\^?\d*$/.test(prev) && /^x/.test(next)) return 'times';
  if (w === '=') return 'equals'; if (w === '+') return 'plus'; if (w === '-' || w === '−') return 'minus';
  if (w === '/' || w === '÷') return 'divided by'; if (w === '<') return 'is less than'; if (w === '>') return 'is greater than';
  if (w === '*' || w === '×') return 'times';
  w = w.replace(/\^2\b/g, ' squared').replace(/\^3\b/g, ' cubed').replace(/\^\(?(-?\w+)\)?/g, ' to the power of $1')
       .replace(/√/g, ' root ').replace(/π/g, ' pi').replace(/(\d)\s*%/g, '$1 percent').replace(/\|/g, ' absolute ')
       .replace(/(\d+)\/(\d+)/g, '$1 over $2');
  if (/^[A-Z]{4,}[.,:;!?"]*$/.test(w.replace(/^["(]/,''))) w = w.toLowerCase();   // ALL-CAPS words: say them, do not spell
  return w;
}
const Speech = {
  ok: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  gen: 0,   // bumped by stop(): ends every running read
  seq: 0,   // bumped by each new read: ends the previous read only
  voices(){ return this.ok ? speechSynthesis.getVoices() : []; },
  voice(){ const vs = this.voices(); return vs.find(v => v.voiceURI === settings.voiceURI) || vs.find(v => /^en-US/i.test(v.lang) && v.localService) || vs.find(v => /^en/i.test(v.lang)) || null; },
  stop(){ this.gen++; this.seq++; if (this.ok) speechSynthesis.cancel(); $$('.w.hl').forEach(e => e.classList.remove('hl')); $$('.say[aria-pressed="true"]').forEach(b => b.setAttribute('aria-pressed','false')); },
  // speak plain text (no highlight)
  say(text){ const span = document.createElement('div'); span.innerHTML = wordsHTML(text); return this.speakSpans($$('.w', span), ''); },
  // speak a DOM element that contains .w spans, with highlight
  speakEl(el, prefix=''){ if (!el) return Promise.resolve(); return this.speakSpans($$('.w', el), prefix); },
  async speakSpans(spans, prefix=''){
    if (!this.ok){ toast('This browser cannot read aloud.'); return; }
    const my = ++this.seq, g = this.gen; const alive = () => my === this.seq && g === this.gen;
    speechSynthesis.cancel(); await sleep(60); if (!alive()) return;
    // chunk at sentence ends so long passages are read in small parts (and Chrome does not cut off)
    const chunks = []; let cur = [];
    spans.forEach((s,i) => { cur.push(i); if (/[.!?:]["')]*$/.test(s.textContent) && cur.length >= 3 || cur.length >= 28){ chunks.push(cur); cur=[]; } });
    if (cur.length) chunks.push(cur);
    if (!chunks.length && prefix) chunks.push([]);
    for (let ci=0; ci<chunks.length; ci++){
      if (!alive()) return;
      await this.speakChunk(spans, chunks[ci], ci===0 ? prefix : '', alive);
    }
    spans.forEach(s => s.classList.remove('hl'));
  },
  speakChunk(spans, idxs, prefix, alive){
    return new Promise(resolve => {
      let text = prefix ? prefix + ' ' : ''; const starts = [];
      idxs.forEach((i,k) => { const w = spans[i].textContent; const sw = sayable(w, k?spans[idxs[k-1]].textContent:'', k<idxs.length-1?spans[idxs[k+1]].textContent:'');
        starts.push(text.length); text += sw + ' '; });
      const u = new SpeechSynthesisUtterance(text.trim()); const v = this.voice(); if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      u.rate = Number(settings.rate) || 0.9;
      let gotBoundary = false, timers = [], last = -1, finished = false;
      const mark = k => { if (!settings.readAlong || !alive()) return; if (last >= 0 && spans[idxs[last]]) spans[idxs[last]].classList.remove('hl');
        if (spans[idxs[k]]){ spans[idxs[k]].classList.add('hl'); last = k; } };
      u.onboundary = e => { if (e.name && e.name !== 'word') return; gotBoundary = true; timers.forEach(clearTimeout); timers = [];
        if (prefix && e.charIndex < (starts[0] ?? 0)) return; let k = 0; while (k+1 < starts.length && starts[k+1] <= e.charIndex) k++; mark(k); };
      u.onstart = () => { timers.push(setTimeout(() => { if (gotBoundary || !settings.readAlong) return;

            t += sw.length/cps*1000 + (/[.,;:!?]$/.test(spans[i].textContent) ? 220/u.rate : 0); });
        }, 400)); };
      let watchdog = null;
      const done = () => { if (finished) return; finished = true; clearInterval(watchdog); timers.forEach(clearTimeout); if (last>=0 && spans[idxs[last]]) spans[idxs[last]].classList.remove('hl'); resolve(); };
      u.onend = done; u.onerror = done;
      speechSynthesis.speak(u);
      // safety: finish if the read was stopped or the engine never fires onend

    });

};

// Click-to-speak buttons: <button class="say" data-say="#elementId" data-prefix="Choice A.">

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const Voice = {
  ok: !!SR, rec: null,
  why(){
    if (!SR) return 'Voice answers need Chrome or Edge. This browser does not support speech recognition. You can still tap the buttons.';
    if (!window.isSecureContext) return 'Voice answers need a secure page (https or localhost). Open the web link or run server.py, then try again.';
    return '';
  },
  note(){ return this.why() || (location.protocol === 'file:' ? 'You opened the app as a file. Chrome may block the mic here. If voice answers fail, use the web link (https) or run server.py.' : ''); },
  listen(ms=9000){
    return new Promise(resolve => {
      if (!SR){ resolve({ error:'unsupported' }); return; }
      try { this.stop(); } catch(e){}
      const r = new SR(); this.rec = r; r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 4; r.continuous = false;
      let done = false; const finish = v => { if (done) return; done = true; clearTimeout(t); setListening(false); resolve(v); };
      r.onresult = e => { const alts = []; for (const res of e.results) for (const a of res) alts.push(a.transcript); finish({ text: alts[0] || '', alts }); };
      r.onerror = e => finish({ error: e.error || 'error' });
      r.onend = () => finish({ error: 'no-speech' });
      const t = setTimeout(() => { try{ r.stop(); }catch(e){} }, ms);
      try { r.start(); setListening(true); } catch(e){ finish({ error: 'start-failed' }); }
    });
  },
  stop(){ if (this.rec){ try{ this.rec.abort(); }catch(e){} this.rec = null; } setListening(false); }
};
function setListening(on){ $$('.listen-status').forEach(el => el.innerHTML = on ? '<span class="listen-dot"></span>Listening... speak now.' : ''); }
const LETTER_WORDS = { a:0, ay:0, eh:0, hey:0, alpha:0, alfa:0, b:1, be:1, bee:1, bravo:1, c:2, see:2, sea:2, si:2, charlie:2, d:3, dee:3, de:3, delta:3, the:3 };
function normalize(s){ return String(s).toLowerCase().replace(/[$,]/g,'').replace(/[^a-z0-9.%/ -]/g,' ').replace(/\s+/g,' ').trim(); }
// Returns {type:'answer', index} | {type:'cmd', cmd} | {type:'conf', value} | null
function parseVoice(alts, choices){
  const list = Array.isArray(alts) ? alts : [alts];
  for (const raw of list){
    const t = normalize(raw); if (!t) continue;
    if (/\b(not sure|unsure|kind of|kinda|maybe|so so|shaky|shaky|sorta|sort of)\b/.test(t)) return { type:'conf', value:'shaky' };
    if (/\bguess(ed|ing)?\b/.test(t)) return { type:'conf', value:'guessed' };
    if (/\b(sure|certain|confident|positive|i knew it)\b/.test(t)) return { type:'conf', value:'sure' };
    if (/\b(repeat|again|say that|what was that|read it)\b/.test(t)) return { type:'cmd', cmd:'repeat' };
    if (/\b(next|skip|move on|go on)\b/.test(t)) return { type:'cmd', cmd:'next' };
    if (/\b(hint|help|clue)\b/.test(t)) return { type:'cmd', cmd:'hint' };
    if (/\b(stop|quit|pause|end)\b/.test(t)) return { type:'cmd', cmd:'stop' };
    let m = t.match(/\b(?:option|answer|letter|choice|choose|pick|it's|its|is|say|i think|go with)\s+([a-z]+)\b/);
    if (m && m[1] in LETTER_WORDS && m[1] !== 'the') return { type:'answer', index: LETTER_WORDS[m[1]] };
    const words = t.split(' ');
    if (words.length <= 2 && words.every(w => w in LETTER_WORDS)) { const w = words.find(w => w!=='the') || words[0]; return { type:'answer', index: LETTER_WORDS[w] }; }
    if (choices){
      const nc = choices.map(normalize);
      let i = nc.findIndex(c => c === t); if (i >= 0) return { type:'answer', index:i };
      const digits = s => (s.match(/-?\d+(?:\.\d+)?(?:\/\d+)?/g) || []).map(n => n.includes('/') ? n : String(Number(n))).join(' ');
      if (digits(t)){ const hits = nc.map((c,k)=>k).filter(k => digits(nc[k]) && digits(nc[k]) === digits(t)); if (hits.length === 1) return { type:'answer', index:hits[0] }; }
      const scores = nc.map(c => { const cw = c.split(' ').filter(w => w.length > 2); if (!cw.length) return t.includes(c) && c.length>1 ? 1 : 0;
        return cw.filter(w => t.includes(w)).length / cw.length; });
      const best = Math.max(...scores); if (best >= 0.6 && scores.filter(s => s === best).length === 1) return { type:'answer', index: scores.indexOf(best) };
    }
  }
  return null;
}

/* ---------------- LLM (OpenAI-compatible) ---------------- */
// Path 1: his own key in Settings (kept only in this browser's localStorage) -> call the endpoint directly.
// Path 2: no key -> use the same-origin proxy /api/chat (server.py reads OPENAI_API_KEY from the environment).
let proxyState = null;
async function proxyAvailable(){
  if (proxyState !== null) return proxyState;
  if (!/^https?:$/.test(location.protocol)) return (proxyState = false);
  try { const r = await fetch('api/health', { cache:'no-store' }); const j = r.ok ? await r.json() : null; proxyState = !!(j && j.proxy && j.configured); }
  catch(e){ proxyState = false; }
  return proxyState;
}
async function llmReady(){ return !!settings.apiKey || await proxyAvailable(); }
async function llmChat(messages, { json=false, temperature=0.4, maxTokens=1200 } = {}){
  const body = { model: settings.model || 'gpt-4o-mini', messages, temperature, max_tokens: maxTokens };
  if (json) body.response_format = { type:'json_object' };
  let url, headers = { 'Content-Type':'application/json' };
  if (settings.apiKey){ url = (settings.apiBase || 'https://api.openai.com/v1').replace(/\/+$/,'') + '/chat/completions'; headers.Authorization = 'Bearer ' + settings.apiKey; }
  else if (await proxyAvailable()){ url = 'api/chat'; }
  else throw new Error('No AI connection. Add your API key in Settings, or run server.py with OPENAI_API_KEY set.');
  let r = await fetch(url, { method:'POST', headers, body: JSON.stringify(body) });
  if (!r.ok && json && r.status === 400){ delete body.response_format; r = await fetch(url, { method:'POST', headers, body: JSON.stringify(body) }); }
  if (!r.ok){ let t = ''; try{ t = (await r.text()).slice(0,300); }catch(e){} throw new Error(`AI request failed (${r.status}). ${t}`); }
  const j = await r.json(); const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
  if (!c) throw new Error('AI sent an empty reply.'); return c;
}

  const W = 640, H = 240, P = 40, bw = (W - P*2) / a.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Scores for the last ${a.length} attempts">`;
  [0,50,80,100].forEach(v => { const y = H-P - (H-2*P)*v/100; s += `<line x1="${P}" x2="${W-P}" y1="${y}" y2="${y}" stroke="currentColor" stroke-opacity="${v===80?0.6:0.25}" stroke-dasharray="${v===80?'6 4':''}"/><text x="4" y="${y+6}" font-size="16">${v}%</text>`; });
  const pts = [];
  a.forEach((t,i) => { const x = P + i*bw + bw*0.15, h = (H-2*P)*t.pct/100, y = H-P-h; pts.push([x+bw*0.35, y]);
    s += `<rect x="${x}" y="${y}" width="${bw*0.7}" height="${Math.max(1,h)}" fill="${t.mode==='meps'?'#7A4E00':'#003A8C'}" opacity="0.85"/><text x="${x+bw*0.35}" y="${y-6}" text-anchor="middle" font-size="16" font-weight="bold">${t.pct}</text><text x="${x+bw*0.35}" y="${H-P+22}" text-anchor="middle" font-size="14">${i+1}</text>`; });
  s += `<polyline fill="none" stroke="#FFB000" stroke-width="4" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
  return s + `</svg><p>Bars: your score each time (oldest on the left). Gold line: your trend. Dashed line: 80% goal. Brown bars are MEPS runs.</p>`;
}

function findBankMatch(text){
  const n = normalize(text); if (n.length < 12) return null;
  let best = null, bestScore = 0; const tw = new Set(n.split(' ').filter(w => w.length > 2));
  for (const q of allQuestions()){ const qw = normalize(q.stem).split(' ').filter(w => w.length > 2); if (!qw.length) continue;
    const sc = qw.filter(w => tw.has(w)).length / qw.length; if (sc > bestScore){ bestScore = sc; best = q; } }
  return bestScore >= 0.85 ? best : null;
}

function normCdf(z){ const t = 1/(1+0.2316419*Math.abs(z)); const d = 0.3989423*Math.exp(-z*z/2); const p = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z > 0 ? 1-p : p; }
function estimates(res){
  // ESTIMATE ONLY. Real ASVAB scoring uses item response theory and norm tables we do not have.
  // Here: standard score ~ 20 + 60 x (fraction right), so 50% right is about 50 (the average).
  const ss = p => Math.round(20 + 60*p); const frac = k => res[k] ? res[k].right / res[k].total : 0;
  const S = {}; MEPS_ORDER.forEach(k => S[k] = ss(frac(k)));
  const ve = ss(((res.WK?.right||0) + (res.PC?.right||0)) / ((res.WK?.total||1) + (res.PC?.total||1)));
  const comp = 2*ve + S.AR + S.MK;                 // AFQT composite = 2VE + AR + MK
  const afqt = Math.max(1, Math.min(99, Math.round(100*normCdf((comp - 200)/36))));
  return { S, ve, afqt, line: ve + S.MK + S.GS };
}
