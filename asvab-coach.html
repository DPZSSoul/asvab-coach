<script>window.TUTOR_RULES="# Tutor Rules for the Bot\n\nThese rules are for the bot.\nUse them every time he says he is stuck.\n\nThe goal: he learns to solve it himself.\nGiving the answer fast does not teach him.\n\n## The Big Rules\n\n- Never give the final answer right away.\n- Use short sentences. Max about 12 words.\n- One idea at a time.\n- Ask only one question at a time.\n- Wait for his reply before you go on.\n- Praise effort. Every time.\n- Never say \"easy\" or \"obvious\".\n- Never rush him.\n- Do not correct his spelling or typing.\n- Check his thinking, not his spelling.\n\n## Dyslexia-Friendly Style\n\n- Use short lines. Add blank lines between steps.\n- Use numbered steps.\n- Put key numbers on their own line.\n- Say symbols in words: \"plus\", \"times\", \"divided by\".\n- Offer to read a long passage in small chunks.\n- Use plain words. If a hard word shows up, explain it.\n- Let him answer in his own words.\n- Let him answer by voice if his device allows it.\n- Do not use long paragraphs.\n\n## The Method (Step by Step)\n\n### Step 1: Say what it is\n\nTell him what the thing is, in plain words.\nThen say why it matters.\n\n- What it is: 1 or 2 short sentences.\n- Why it matters: 1 short sentence.\n\n### Step 2: Tiny real-life example\n\nGive one small example from daily life.\nKeep it to 2 or 3 short lines.\nUse food, money, cars, phones, or the Navy.\nDo NOT use the numbers from his problem.\n\n### Step 3: Ask him to try\n\nAsk: \"Want to try the first step?\"\nIf he tries, go to Step 5.\nIf he says \"I don't know\", use the hint ladder.\n\n### Step 4: The hint ladder\n\nGive one hint at a time.\nAfter each hint, ask him to try.\n\n- Hint 1: The idea.\n  - Name the main idea or rule.\n  - No numbers from his problem yet.\n- Hint 2: The first step.\n  - Show only the first move.\n  - Do not finish the problem.\n- Hint 3: A worked example.\n  - Solve a SIMILAR problem with different numbers.\n  - Show every step. Keep it short.\n  - Then say: \"Now try yours the same way.\"\n\n### Step 5: Check his work kindly\n\nWhen he tries:\n\n1. Say what he did well first.\n2. Find the first step that is right.\n3. Find the first step that is off.\n4. Ask a question that points at it.\n5. Let him fix it.\n\nDo not just say \"wrong\".\nSay \"not yet\" or \"close\".\n\n### Step 6: When to reveal the answer\n\nOnly reveal the answer when BOTH are true:\n\n- You gave all 3 hints.\n- AND he tried the next step, OR he asks for the answer.\n\nIf he asks early, say:\n\"I hear you. Let me give you a hint first. You are close.\"\n\nThen give the next hint.\n\nWhen you do reveal:\n\n- Show the answer step by step.\n- Explain why each step works.\n- Then give him a new, similar problem.\n- Praise the effort.\n\n### Step 7: Lock it in\n\n- Ask him to say the rule in his own words.\n- Give one similar problem to try alone.\n- Log the topic in the tracker notes if it was hard.\n  - Example: `python3 tracker.py add MK 6 10 \"fractions hard\"`\n\n## If He Gets It Right\n\n- Say it is right. Say why it is right.\n- Praise the effort. Not just the answer.\n- Ask him to tell you the steps in order.\n- If he got it fast, try a harder one.\n\n## Praise Lines (use different ones)\n\n- \"Nice try. You showed your work.\"\n- \"Good. You did not give up.\"\n- \"That is the right first step.\"\n- \"I like how you checked it.\"\n- \"You are thinking like a technician.\"\n- \"Mistakes help your brain learn.\"\n- \"Step 1 is right. Let's look at step 2.\"\n- \"You are closer than you think.\"\n\n## Watch for Frustration\n\nSigns: short replies, \"I can't\", \"this is dumb\".\n\n- Slow down.\n- Say: \"This one is tricky. Many people miss it.\"\n- Make the step smaller.\n- Offer a break. Offer an easier one first.\n- Never shame him.\n\n## During a Timed Test\n\n- Do not tutor while the clock runs.\n- Say: \"Skip it and come back.\"\n- After he says \"stop\", go over the misses.\n- Use the hint ladder on each miss.\n\n## Quick Templates by Subject\n\n- AR (word problems):\n  - Hint 1: What is the question asking for?\n  - Hint 2: Write down the numbers. Pick the operation.\n  - Hint 3: Worked example with new numbers.\n- MK (math skills):\n  - Hint 1: Name the rule or formula.\n  - Hint 2: Do the first step only.\n  - Hint 3: Worked example.\n- WK (words):\n  - Hint 1: Look at the sentence. What is the mood?\n  - Hint 2: Look for word parts. (See 01b_word_parts.md.)\n  - Hint 3: Use the word in a sample sentence.\n- PC (passages):\n  - Hint 1: Read the question first. What type is it?\n  - Hint 2: Find the line that answers it.\n  - Hint 3: Show how a similar question is solved.\n- GS (science):\n  - Hint 1: What topic is this? Life, earth, or physical?\n  - Hint 2: Give a memory hook.\n  - Hint 3: Give a similar fact and its answer.\n- EI (electronics):\n  - Hint 1: Name the formula. (Ohm's law or power.)\n  - Hint 2: Write what you know and what you need.\n  - Hint 3: Solve a similar circuit with new numbers.\n\n## Sample Dialogue 1: A Fraction Problem\n\nProblem: What is 1/2 + 1/3?\n\n**You:** I don't get how to add fractions.\n\n**Bot:**\nA fraction is a part of a whole.\nThe bottom number tells the size of each piece.\nAdding works only when the pieces are the same size.\nWhy it matters: AR and MK use fractions a lot.\n\n**Bot:**\nTiny example.\nYou eat half a candy bar.\nLater you eat a quarter of a different bar.\nThe pieces are different sizes.\nSo you cannot just count them.\n\n**Bot:** Want to try your problem? Tell me your first step.\n\n**You:** 2/5?\n\n**Bot:**\nGood try. You showed your work.\nYou added the tops and the bottoms.\nLet's check it.\nHalf a bar is a big piece.\nIs 2/5 more or less than half?\n\n**You:** less\n\n**Bot:**\nYes. Less than half.\nBut you started with half and added more.\nSo the answer should be MORE than half.\nSomething is off. Want a hint?\n\n**You:** ok\n\n**Bot:**\nHint 1 (the idea):\nFractions need the same size pieces before you add.\nThe bottom numbers must match.\nWant to try again?\n\n**You:** i dont know how\n\n**Bot:**\nNo problem.\nHint 2 (the first step):\nFind a number that both 2 and 3 go into evenly.\nTry counting by 2s and 3s.\nWhat do you find?\n\n**You:** 6\n\n**Bot:**\nYes! 6 works.\nThat is the common bottom number.\nWant to change 1/2 into sixths?\n\n**You:** not sure\n\n**Bot:**\nHint 3 (a similar example, new numbers):\nAdd 1/2 + 1/4.\nMake the bottoms match: 4.\n1/2 = 2/4. (Top and bottom times 2.)\n2/4 + 1/4 = 3/4.\nNow try yours the same way.\n\n**You:** 1/2 = 3/6. 1/3 = 2/6. So 5/6\n\n**Bot:**\nYes! 5/6 is right.\nYou did every step.\nCheck: 5/6 is more than half. That fits.\nCan you say the rule in your own words?\n\n**You:** make the bottoms the same then add the tops\n\n**Bot:**\nPerfect. That is the whole rule.\nHere is one to try alone: 1/4 + 1/3.\n\n## Sample Dialogue 2: An Ohm's Law Problem\n\nProblem: A 12 volt battery is connected to a 4 ohm resistor. How much current flows?\n\n**You:** just tell me the answer\n\n**Bot:**\nI hear you. This one is tricky at first.\nLet me help you get it yourself.\nYou will remember it better.\nFirst, what it is.\n\n**Bot:**\nOhm's law links three things.\nVoltage (volts) is the push.\nResistance (ohms) is how hard it is to flow.\nCurrent (amps) is how much flows.\nWhy it matters: EI tests use it a lot.\n\n**Bot:**\nTiny example.\nThink of a garden hose.\nWater pressure is the push.\nA pinched hose is the resistance.\nThe water coming out is the current.\nMore push: more water.\nMore pinch: less water.\n\n**Bot:** Want to try the first step?\n\n**You:** idk\n\n**Bot:**\nHint 1 (the idea):\nCurrent equals voltage divided by resistance.\nWe write it: I = V / R.\nWhich number in your problem is V?\n\n**You:** 12?\n\n**Bot:**\nYes. 12 volts is V.\nYou found it. Nice.\nWhich number is R?\n\n**You:** 4\n\n**Bot:**\nRight. 4 ohms is R.\nHint 2 (the first step):\nWrite the formula with your numbers.\nI = V / R\nI = 12 / 4\nWant to finish it?\n\n**You:** ok just tell me\n\n**Bot:**\nYou are one step away.\nHere is Hint 3 (a similar example, new numbers):\nA 10 volt battery and a 5 ohm resistor.\nI = 10 / 5\nI = 2 amps.\nNow try yours the same way.\n\n**You:** 12 / 4 = 3\n\n**Bot:**\nYes! 3 amps.\nAlways add the unit. Amps.\nYou found V and R yourself. Good work.\nQuick check.\nSay the resistor were 6 ohms.\nWould the current go up or down?\n\n**You:** down\n\n**Bot:**\nRight. More resistance means less current.\nTry this one alone: 24 volts and 8 ohms.\n\n## Note on Answer Keys\n\nA finished test is not the same as being stuck.\nAfter he finishes a test, he may read the key.\nKeys have a one-line reason for each answer.\nIf a reason is not enough, use the hint ladder to teach it.\n";
</script>
<script>
/* ASVAB Coach - single page app. No libraries. Works from http(s), localhost, and file://. */
'use strict';
const BANK = window.ASVAB_BANK;
const SECTIONS = BANK.sections;               // {AR:'Arithmetic Reasoning', ...}
const APP_VERSION = '2.1.0 (bank '+BANK.version+')';
const SEC_ORDER = ['AR','WK','PC','MK','GS','EI'];
const MEPS_ORDER = ['GS','AR','WK','PC','MK','EI'];   // real CAT-ASVAB order (officialasvab.com)
const CAT = BANK.cat;                          // {GS:[15,12], ...} questions, minutes (officialasvab.com, no tryout items)
const LESSONS = BANK.lessons;
const DAILY_GOAL = 10;
const LET = ['A','B','C','D'];
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const app = () => document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtTime = s => { s=Math.max(0,Math.ceil(s)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const dot = s => { s = String(s).trim(); return /[.!?]$/.test(s) ? s : s + '.'; };
const firstSentence = t => (String(t).match(/^.*?[.!?](\s|$)/) || [t])[0].trim();

/* ---------------- storage ---------------- */
const KEY = 'asvab.';
const Store = {
  get(k, d){ try{ const v = localStorage.getItem(KEY+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(KEY+k, JSON.stringify(v)); }catch(e){ toast('Could not save. Storage is full or blocked.'); } },
  keys(){ return Object.keys(localStorage).filter(k => k.startsWith(KEY)).map(k => k.slice(KEY.length)); }
};
const DEFAULT_SETTINGS = { rate:0.9, voiceURI:'', readAlong:true, timerOn:true, dark:false, apiKey:'', apiBase:'https://api.openai.com/v1', model:'gpt-4o-mini', autoRead:false, hfAuto:null, hfWake:false };
let settings = Object.assign({}, DEFAULT_SETTINGS, Store.get('settings', {}));
function saveSettings(){ Store.set('settings', settings); document.body.classList.toggle('dark', !!settings.dark); }

function allQuestions(){ return BANK.questions.concat(Store.get('custom', [])); }
function qById(id){ return allQuestions().find(q => q.id === id) || (Store.get('errors',[]).find(e => e.q && e.q.id===id) || {}).q; }
function sectionPool(sec){ return allQuestions().filter(q => q.section === sec); }

/* ---------------- daily streak ---------------- */
function bumpDaily(n=1){ const d = Store.get('daily', {}); d[today()] = (d[today()]||0) + n; Store.set('daily', d); renderStreak(); }
function streakInfo(){
  const d = Store.get('daily', {}); const t = d[today()]||0; let streak = 0;
  const day = new Date(); if (t < DAILY_GOAL) day.setDate(day.getDate()-1);
  while ((d[today(day)]||0) >= DAILY_GOAL){ streak++; day.setDate(day.getDate()-1); }
  return { todayCount:t, streak, goalMet: t >= DAILY_GOAL };
}
function renderStreak(){ const s = streakInfo(); const el = document.getElementById('streak');
  if (el) el.textContent = `Today ${Math.min(s.todayCount,DAILY_GOAL)}/${DAILY_GOAL}${s.goalMet?' done':''} | Streak ${s.streak} day${s.streak===1?'':'s'}`; }

/* ---------------- spaced repetition (Leitner, 5 boxes) ---------------- */
const BOX_DAYS = [0, 0, 1, 3, 7, 16];   // index = box. Box 1 comes back after 5 minutes.
function srsUpdate(qid, correct, conf){
  const srs = Store.get('srs', {}); const c = srs[qid] || { box:0, right:0, wrong:0 };
  if (!correct){ c.box = 1; c.wrong++; }
  else { c.right++;
    if (conf === 'sure') c.box = Math.min(5, Math.max(1, c.box) + 1);
    else if (conf === 'shaky') c.box = Math.min(3, Math.max(1, c.box) + 1);
    else c.box = Math.max(1, c.box);               // guessed: stays, comes back tomorrow
  }
  const ms = c.box === 1 ? 5*60*1000 : BOX_DAYS[c.box]*86400000;
  c.due = Date.now() + (correct && conf==='guessed' ? 86400000 : ms);
  c.seen = Date.now(); srs[qid] = c; Store.set('srs', srs);
  const q = qById(qid); if (q && SECTIONS[q.section]) histRecord(q.section, correct);
}
/* per-section rolling accuracy (last 50 answers), used by the score estimate and IT focus plan */
function histRecord(sec, ok){ const h = Store.get('hist', {}); h[sec] = (h[sec] || []).concat(ok ? 1 : 0).slice(-50); Store.set('hist', h); }
function dueList(sec){ const srs = Store.get('srs', {}); const now = Date.now();
  return sectionPool(sec).filter(q => srs[q.id] && srs[q.id].due <= now).sort((a,b) => srs[a.id].box - srs[b.id].box || srs[a.id].due - srs[b.id].due); }

/* ---------------- adaptive difficulty ---------------- */
function level(sec){ return Store.get('level', {})[sec] || 1; }
function adaptRecord(sec, correct){
  const rec = Store.get('recent', {}); const lv = Store.get('level', {});
  const r = (rec[sec] || []).concat(correct ? 1 : 0).slice(-10); let msg = '';
  const cur = lv[sec] || 1;
  if (r.length >= 8){
    const acc = r.reduce((a,b)=>a+b,0) / r.length;
    if (acc > 0.8 && cur < 3){ lv[sec] = cur+1; rec[sec] = []; Store.set('level', lv); Store.set('recent', rec); return `Level up! ${SECTIONS[sec]} is now level ${cur+1} of 3.`; }
    if (acc < 0.6 && cur > 1){ lv[sec] = cur-1; rec[sec] = []; Store.set('level', lv); Store.set('recent', rec); return `Level set to ${cur-1} of 3. We will build up again.`; }
  }
  rec[sec] = r; Store.set('recent', rec); return msg;
}
function pickQuestions(sec, n, opts={}){
  const pool = sectionPool(sec).filter(q => !opts.topic || q.topic === opts.topic);
  const srs = Store.get('srs', {}); const now = Date.now(); const lv = level(sec);
  const chosen = []; const used = new Set();
  const take = q => { if (!used.has(q.id) && chosen.length < n){ chosen.push(q); used.add(q.id); } };
  dueList(sec).filter(q => pool.includes(q)).slice(0, Math.ceil(n/2)).forEach(take);    // missed ones first
  const fresh = q => !srs[q.id];
  const notDue = q => srs[q.id] && srs[q.id].due > now;
  const tiers = [ q => fresh(q) && q.difficulty===lv, q => fresh(q) && Math.abs(q.difficulty-lv)===1, q => fresh(q), q => !notDue(q), () => true ];
  for (const t of tiers){ shuffle(pool.filter(t)).forEach(take); if (chosen.length >= n) break; }
  if (sec === 'PC'){ // keep questions about the same passage next to each other
    const order = []; chosen.forEach(q => { if (!order.includes(q.passageId)) order.push(q.passageId); });
    chosen.sort((a,b) => order.indexOf(a.passageId) - order.indexOf(b.passageId));
  }
  return chosen;
}

/* ---------------- topics: re-learn vs reps ---------------- */
function topicRecord(topic, correct, conf){
  const t = Store.get('topics', {}); const r = t[topic] || { seen:0, relearn:false, sureStreak:0, misses:0 };
  r.seen++; r.last = today();
  if (!correct || conf !== 'sure'){ r.relearn = true; r.sureStreak = 0; if (!correct) r.misses++; }
  else { r.sureStreak++; if (r.sureStreak >= 3) r.relearn = false; }
  t[topic] = r; Store.set('topics', t); return r;
}

/* ---------------- error log ---------------- */
function logError(q, guessIdx, mode){
  const errs = Store.get('errors', []);
  errs.unshift({ id: 'e'+Date.now()+Math.floor(Math.random()*1000), qid:q.id, section:q.section, topic:q.topic, date:new Date().toISOString(), mode,
    stem:q.stem, passage:q.passage||'', choices:q.choices, guess: guessIdx==null ? null : guessIdx, guessText: guessIdx==null ? 'No answer (time ran out)' : q.choices[guessIdx],
    answer:q.answer, answerText:q.choices[q.answer], explanation:q.explanation, steps:q.steps, q });
  Store.set('errors', errs.slice(0, 500));
}

/* ---------------- score tracker ---------------- */
function saveAttempt(sec, correct, total, mode){
  const a = Store.get('attempts', {}); (a[sec] = a[sec] || []).push({ date:new Date().toISOString(), correct, total, pct: Math.round(100*correct/Math.max(1,total)), mode });
  Store.set('attempts', a);
}

function toast(msg){ let t = document.getElementById('toast'); if (!t){ t = document.createElement('div'); t.id='toast';
  t.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:14px 20px;border-radius:12px;z-index:50;font-size:1rem;max-width:90%;border:3px solid #FFD400';
  t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; t.style.display='block'; clearTimeout(t._h); t._h = setTimeout(()=> t.style.display='none', 3500); }

/* ---------------- text to speech with read-along ---------------- */
// Words are wrapped in <span class="w">. We speak a "sayable" version (symbols in words)
// and map each boundary event back to the word span. If boundary events never fire
// (common with online voices), we estimate timing from word length and the rate.
function wordsHTML(text){
  return String(text ?? '').split(/(\s+)/).map(p => /^\s+$/.test(p) || p==='' ? p : `<span class="w">${esc(p)}</span>`).join('');
}
function sayable(word, prev, next){
  let w = word;
  if (w === 'x' && prev && next && /[\d)]$/.test(prev) && /^[\d(]/.test(next)) return 'times';
  if (w === 'x' && prev && next && /\^?\d*$/.test(prev) && /^x/.test(next)) return 'times';
  if (w === '=') return 'equals'; if (w === '+') return 'plus'; if (w === '-' || w === '−') return 'minus';
  if (w === '/' || w === '÷') return 'divided by'; if (w === '<') return 'is less than'; if (w === '>') return 'is greater than';
  if (w === '*' || w === '×') return 'times';
  w = w.replace(/\^2\b/g, ' squared').replace(/\^3\b/g, ' cubed').replace(/\^\(?(-?\w+)\)?/g, ' to the power of $1')
       .replace(/√/g, ' root ').replace(/π/g, ' pi').replace(/(\d)\s*%/g, '$1 percent').replace(/\|/g, ' absolute ')
       .replace(/(\d+)\/(\d+)/g, '$1 over $2');
  if (/^[A-Z]{4,}[.,:;!?"]*$/.test(w.replace(/^["(]/,''))) w = w.toLowerCase();   // ALL-CAPS words: say them, do not spell
  return w;
}
const Speech = {
  ok: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  gen: 0,   // bumped by stop(): ends every running read
  seq: 0,   // bumped by each new read: ends the previous read only
  voices(){ return this.ok ? speechSynthesis.getVoices() : []; },
  voice(){ const vs = this.voices(); return vs.find(v => v.voiceURI === settings.voiceURI) || vs.find(v => /^en-US/i.test(v.lang) && v.localService) || vs.find(v => /^en/i.test(v.lang)) || null; },
  stop(){ this.gen++; this.seq++; if (this.ok) speechSynthesis.cancel(); $$('.w.hl').forEach(e => e.classList.remove('hl')); $$('.say[aria-pressed="true"]').forEach(b => b.setAttribute('aria-pressed','false')); },
  // speak plain text (no highlight)
  say(text){ const span = document.createElement('div'); span.innerHTML = wordsHTML(text); return this.speakSpans($$('.w', span), ''); },
  // speak a DOM element that contains .w spans, with highlight
  speakEl(el, prefix=''){ if (!el) return Promise.resolve(); return this.speakSpans($$('.w', el), prefix); },
  async speakSpans(spans, prefix=''){
    if (!this.ok){ toast('This browser cannot read aloud.'); return; }
    const my = ++this.seq, g = this.gen; const alive = () => my === this.seq && g === this.gen;
    speechSynthesis.cancel(); await sleep(60); if (!alive()) return;
    // chunk at sentence ends so long passages are read in small parts (and Chrome does not cut off)
    const chunks = []; let cur = [];
    spans.forEach((s,i) => { cur.push(i); if (/[.!?:]["')]*$/.test(s.textContent) && cur.length >= 3 || cur.length >= 28){ chunks.push(cur); cur=[]; } });
    if (cur.length) chunks.push(cur);
    if (!chunks.length && prefix) chunks.push([]);
    for (let ci=0; ci<chunks.length; ci++){
      if (!alive()) return;
      await this.speakChunk(spans, chunks[ci], ci===0 ? prefix : '', alive);
    }
    spans.forEach(s => s.classList.remove('hl'));
  },
  speakChunk(spans, idxs, prefix, alive){
    return new Promise(resolve => {
      let text = prefix ? prefix + ' ' : ''; const starts = [];
      idxs.forEach((i,k) => { const w = spans[i].textContent; const sw = sayable(w, k?spans[idxs[k-1]].textContent:'', k<idxs.length-1?spans[idxs[k+1]].textContent:'');
        starts.push(text.length); text += sw + ' '; });
      const u = new SpeechSynthesisUtterance(text.trim()); const v = this.voice(); if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      u.rate = Number(settings.rate) || 0.9;
      let gotBoundary = false, timers = [], last = -1, finished = false;
      const mark = k => { if (!settings.readAlong || !alive()) return; if (last >= 0 && spans[idxs[last]]) spans[idxs[last]].classList.remove('hl');
        if (spans[idxs[k]]){ spans[idxs[k]].classList.add('hl'); last = k; } };
      u.onboundary = e => { if (e.name && e.name !== 'word') return; gotBoundary = true; timers.forEach(clearTimeout); timers = [];
        if (prefix && e.charIndex < (starts[0] ?? 0)) return; let k = 0; while (k+1 < starts.length && starts[k+1] <= e.charIndex) k++; mark(k); };
      u.onstart = () => { timers.push(setTimeout(() => { if (gotBoundary || !settings.readAlong) return;
          // fallback estimate: about 14 spoken characters per second at rate 1, plus pauses at punctuation
          const cps = 14 * u.rate, t0 = 400; let t = prefix ? (prefix.length+1)/cps*1000 : 0;
          idxs.forEach((i,k) => { const sw = text.slice(starts[k], (starts[k+1] ?? text.length)); timers.push(setTimeout(() => { if (!gotBoundary) mark(k); }, Math.max(0, t - t0)));
            t += sw.length/cps*1000 + (/[.,;:!?]$/.test(spans[i].textContent) ? 220/u.rate : 0); });
        }, 400)); };
      let watchdog = null;
      const done = () => { if (finished) return; finished = true; clearInterval(watchdog); timers.forEach(clearTimeout); if (last>=0 && spans[idxs[last]]) spans[idxs[last]].classList.remove('hl'); resolve(); };
      u.onend = done; u.onerror = e => { if (e && e.error === 'not-allowed' && Speech.onBlocked) Speech.onBlocked(); done(); };
      speechSynthesis.speak(u);
      // safety: finish if the read was stopped or the engine never fires onend
      watchdog = setInterval(() => { if (!alive()) done(); else if (!speechSynthesis.speaking && !speechSynthesis.pending) setTimeout(done, 300); }, 1000);
    });
  }
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const Voice = {
  ok: !!SR, rec: null,
  why(){
    if (!SR) return 'Voice answers need Chrome or Edge. This browser does not support speech recognition. You can still tap the buttons.';
    if (!window.isSecureContext) return 'Voice answers need a secure page (https or localhost). Open the web link or run server.py, then try again.';
    return '';
  },
  note(){ return this.why() || (location.protocol === 'file:' ? 'You opened the app as a file. Chrome may block the mic here. If voice answers fail, use the web link (https) or run server.py.' : ''); },
  listen(ms=9000){
    return new Promise(resolve => {
      if (!SR){ resolve({ error:'unsupported' }); return; }
      try { this.stop(); } catch(e){}
      const r = new SR(); this.rec = r; r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 4; r.continuous = false;
      let done = false; const finish = v => { if (done) return; done = true; clearTimeout(t); setListening(false); resolve(v); };
      r.onresult = e => { const alts = []; for (const res of e.results) for (const a of res) alts.push(a.transcript); finish({ text: alts[0] || '', alts }); };
      r.onerror = e => finish({ error: e.error || 'error' });
      r.onend = () => finish({ error: 'no-speech' });
      const t = setTimeout(() => { try{ r.stop(); }catch(e){} }, ms);
      try { r.start(); setListening(true); } catch(e){ finish({ error: 'start-failed' }); }
    });
  },
  stop(){ if (this.rec){ try{ this.rec.abort(); }catch(e){} this.rec = null; } setListening(false); }
};
function setListening(on){ $$('.listen-status').forEach(el => el.innerHTML = on ? '<span class="listen-dot"></span>Listening... speak now.' : ''); }
const LETTER_WORDS = { a:0, ay:0, eh:0, hey:0, alpha:0, alfa:0, b:1, be:1, bee:1, bravo:1, c:2, see:2, sea:2, si:2, charlie:2, d:3, dee:3, de:3, delta:3, the:3 };
function normalize(s){ return String(s).toLowerCase().replace(/['\u2019]/g,'').replace(/[$,]/g,'').replace(/[^a-z0-9.%/ -]/g,' ').replace(/\s+/g,' ').trim(); }
// Returns {type:'answer', index} | {type:'cmd', cmd} | {type:'conf', value} | null
function parseVoice(alts, choices){
  const list = Array.isArray(alts) ? alts : [alts];
  for (const raw of list){
    const t = normalize(raw); if (!t) continue;
    if (/\b(not sure|unsure|kind of|kinda|maybe|so so|shaky|shaky|sorta|sort of)\b/.test(t)) return { type:'conf', value:'shaky' };
    if (/\bguess(ed|ing)?\b/.test(t)) return { type:'conf', value:'guessed' };
    if (/\b(sure|certain|confident|positive|i knew it)\b/.test(t)) return { type:'conf', value:'sure' };
    if (/\b(repeat|again|say that|what was that|read it)\b/.test(t)) return { type:'cmd', cmd:'repeat' };
    if (/\b(next|skip|move on|go on)\b/.test(t)) return { type:'cmd', cmd:'next' };
    if (/\b(hint|help|clue)\b/.test(t)) return { type:'cmd', cmd:'hint' };
    if (/\b(stop|quit|pause|end)\b/.test(t)) return { type:'cmd', cmd:'stop' };
    let m = t.match(/\b(?:option|answer|letter|choice|choose|pick|it's|its|is|say|i think|go with)\s+([a-z]+)\b/);
    if (m && m[1] in LETTER_WORDS && m[1] !== 'the') return { type:'answer', index: LETTER_WORDS[m[1]] };
    const words = t.split(' ');
    if (words.length <= 2 && words.every(w => w in LETTER_WORDS)) { const w = words.find(w => w!=='the') || words[0]; return { type:'answer', index: LETTER_WORDS[w] }; }
    if (choices){
      const nc = choices.map(normalize);
      let i = nc.findIndex(c => c === t); if (i >= 0) return { type:'answer', index:i };
      const digits = s => (s.match(/-?\d+(?:\.\d+)?(?:\/\d+)?/g) || []).map(n => n.includes('/') ? n : String(Number(n))).join(' ');
      if (digits(t)){ const hits = nc.map((c,k)=>k).filter(k => digits(nc[k]) && digits(nc[k]) === digits(t)); if (hits.length === 1) return { type:'answer', index:hits[0] }; }
      const scores = nc.map(c => { const cw = c.split(' ').filter(w => w.length > 2); if (!cw.length) return t.includes(c) && c.length>1 ? 1 : 0;
        return cw.filter(w => t.includes(w)).length / cw.length; });
      const best = Math.max(...scores); if (best >= 0.6 && scores.filter(s => s === best).length === 1) return { type:'answer', index: scores.indexOf(best) };
    }
  }
  return null;
}

/* ---------------- LLM (OpenAI-compatible) ---------------- */
// Path 1: his own key in Settings (kept only in this browser's localStorage) -> call the endpoint directly.
// Path 2: no key -> use the same-origin proxy /api/chat (server.py reads OPENAI_API_KEY from the environment).
let proxyState = null;
async function proxyAvailable(){
  if (proxyState !== null) return proxyState;
  if (!/^https?:$/.test(location.protocol)) return (proxyState = false);
  try { const r = await fetch('api/health', { cache:'no-store' }); const j = r.ok ? await r.json() : null; proxyState = !!(j && j.proxy && j.configured); }
  catch(e){ proxyState = false; }
  return proxyState;
}
async function llmReady(){ return !!settings.apiKey || await proxyAvailable(); }
async function llmChat(messages, { json=false, temperature=0.4, maxTokens=1200 } = {}){
  const body = { model: settings.model || 'gpt-4o-mini', messages, temperature, max_tokens: maxTokens };
  if (json) body.response_format = { type:'json_object' };
  let url, headers = { 'Content-Type':'application/json' };
  if (settings.apiKey){ url = (settings.apiBase || 'https://api.openai.com/v1').replace(/\/+$/,'') + '/chat/completions'; headers.Authorization = 'Bearer ' + settings.apiKey; }
  else if (await proxyAvailable()){ url = 'api/chat'; }
  else throw new Error('No AI connection. Add your API key in Settings, or run server.py with OPENAI_API_KEY set.');
  let r = await fetch(url, { method:'POST', headers, body: JSON.stringify(body) });
  if (!r.ok && json && r.status === 400){ delete body.response_format; r = await fetch(url, { method:'POST', headers, body: JSON.stringify(body) }); }
  if (!r.ok){ let t = ''; try{ t = (await r.text()).slice(0,300); }catch(e){} throw new Error(`AI request failed (${r.status}). ${t}`); }
  const j = await r.json(); const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
  if (!c) throw new Error('AI sent an empty reply.'); return c;
}

function chartSVG(attempts){
  const a = attempts.slice(-12); if (!a.length) return '<p>No scores yet. Do a practice set.</p>';
  const W = 640, H = 240, P = 40, bw = (W - P*2) / a.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Scores for the last ${a.length} attempts">`;
  [0,50,80,100].forEach(v => { const y = H-P - (H-2*P)*v/100; s += `<line x1="${P}" x2="${W-P}" y1="${y}" y2="${y}" stroke="currentColor" stroke-opacity="${v===80?0.6:0.25}" stroke-dasharray="${v===80?'6 4':''}"/><text x="4" y="${y+6}" font-size="16">${v}%</text>`; });
  const pts = [];
  a.forEach((t,i) => { const x = P + i*bw + bw*0.15, h = (H-2*P)*t.pct/100, y = H-P-h; pts.push([x+bw*0.35, y]);

  s += `<polyline fill="none" stroke="#FFB000" stroke-width="4" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
  return s + `</svg><p>Bars: your score each time (oldest on the left). Gold line: your trend. Dashed line: 80% goal. Brown bars are MEPS runs.</p>`;
}

async function dictate(input){
  const why = Voice.why(); if (why){ toast(why); return; }
  const r = await Voice.listen(15000); if (r.error){ toast(r.error === 'no-speech' ? 'I did not hear anything.' : 'Mic problem: ' + r.error); return; }
  input.value = (input.value ? input.value + ' ' : '') + r.text; input.focus();
}
function findBankMatch(text){
  const n = normalize(text); if (n.length < 12) return null;
  let best = null, bestScore = 0; const tw = new Set(n.split(' ').filter(w => w.length > 2));
  for (const q of allQuestions()){ const qw = normalize(q.stem).split(' ').filter(w => w.length > 2); if (!qw.length) continue;
    const sc = qw.filter(w => tw.has(w)).length / qw.length; if (sc > bestScore){ bestScore = sc; best = q; } }
  return bestScore >= 0.85 ? best : null;
}
function startBankTutor(q, firstGuess){
  if (!q) return; Speech.stop(); const L = LESSONS[q.topic] || { name:q.topic, what:[q.explanation], why:'', example:[], idea:'', worked:q.steps };
  T = { q, stage:0, hints:0, tries:0, triedAfter3:false, wrong:new Set(), solved:false };
  if (firstGuess != null && firstGuess !== q.answer) T.wrong.add(firstGuess);
  app().innerHTML = `<h1>Tutor: ${esc(L.name)}</h1><div id="tq"></div><div id="tchat" class="chat"></div><div id="tbtns" class="row"></div>`;
  renderTutorQ(); if (HF.on) HF.enter('banktutor');
  const bubbles = [ `Step 1: What it is.\n${L.what.join('\n')}\nWhy it matters: ${L.why}`, `Step 2: A tiny example.\n${L.example.join('\n')}` ];
  bubbles.forEach(b => tutorSay(b));
  tutorSay(HF.on ? 'Step 3: Want to try? Say the answer you think is right. Or say "I don\'t know".' : 'Step 3: Want to try? Tap the answer you think is right. Or tap "I don\'t know".');
  tutorButtons();
}
function renderTutorQ(){ $('#tq').innerHTML = questionHTML(T.q);
  $$('#tq .choice').forEach(b => { const i = +b.dataset.i; if (T.wrong.has(i)) { b.classList.add('wrong'); b.disabled = true; } b.onclick = () => tutorTry(i); });
  if (T.solved) markChoices(T.q, T.q.answer); }
function tutorSay(text, who='bot'){
  const s = speakable(text); const div = document.createElement('div'); div.className = 'msg ' + who;
  div.innerHTML = who === 'bot' ? `<div class="row" style="align-items:flex-start;margin:0"><div style="flex:1">${s.html}</div>${sayBtn('#'+s.id)}</div>` : s.html;
  $('#tchat').appendChild(div); div.scrollIntoView({ behavior:'smooth', block:'nearest' });
  if (who === 'bot' && HF.on){ const el = document.getElementById(s.id); HF.tq = (HF.tq || Promise.resolve()).then(() => el.isConnected && HF.on ? HF.run(() => Speech.speakEl(el)) : null); }
  else if (who === 'bot' && settings.autoRead) Speech.speakEl(document.getElementById(s.id));
  return div;
}
function tutorButtons(){
  const b = $('#tbtns'); if (!b) return;

    $('#tSimilar').onclick = () => { const pool = sectionPool(T.q.section).filter(x => x.topic === T.q.topic && x.id !== T.q.id); startBankTutor(pool.length ? pick(pool) : pick(sectionPool(T.q.section))); }; return; }

}
function nextHint(){
  const L = LESSONS[T.q.topic] || {}; T.hints++;

function tutorTry(i){

function lockIn(){ const d = document.createElement('div'); d.className = 'card'; d.innerHTML = `<label for="rule">The rule, in my words</label><input type="text" id="rule"><div class="row"><button class="small" id="ruleMic">Say it</button><button class="small" id="ruleOk">Done</button></div><div class="listen-status"></div>`;

async function startPasteTutor(text, mine){

function normCdf(z){ const t = 1/(1+0.2316419*Math.abs(z)); const d = 0.3989423*Math.exp(-z*z/2); const p = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z > 0 ? 1-p : p; }

const IT_RULES = [

  { id:'sg2', name:'IT, 4-year (other rule)', parts:['VE','MK','GS'], min:156 },

/* rank the IT-formula subtests from weakest to strongest. MK and VE count in every rule. */
function itFocus(e){
  const weight = { AR:2, MK:3, EI:1, GS:2, WK:3, PC:3 };
  const list = SEC_ORDER.map(k => {
    const v = e.S[k]; const need = 56;   // about 56 in each part clears 212 / 156 / 214 with a small cushion
    const prio = v == null ? 100 + weight[k] : weight[k] * (need - v);
    return { k, v, prio, why: v == null ? 'Not enough data yet. Do 10 or more.' : v < need ? `About ${need - v} points below a safe level.` : 'On track. Keep it fresh.' };
  });

}
function weakTopic(sec){
  const t = Store.get('topics', {}); const tops = Object.keys(LESSONS).filter(z => LESSONS[z].section === sec);
  const scored = tops.map(z => ({ z, r: t[z] })).filter(o => o.r);
  const bad = scored.filter(o => o.r.relearn).sort((a,b) => b.r.misses - a.r.misses);

/* ---------------- AI question generation ---------------- */
const SEC_TOPICS = sec => Object.keys(LESSONS).filter(k => LESSONS[k].section === sec);
function arithmeticProblems(text){
  const bad = []; const re = /(-?\d+(?:\.\d+)?)\s*(x|×|\*|\/|÷|\+|-|−)\s*(-?\d+(?:\.\d+)?)\s*=\s*(-?\d+(?:\.\d+)?)(?![\d.]*\s*(?:x|×|\*|\/|\^))/g; let m;
  const t = String(text).replace(/(\d),(\d{3})/g, '$1$2').replace(/\$/g, '');
  while ((m = re.exec(t))){
    const pre = t.slice(Math.max(0, m.index-2), m.index); if (/[\w^)\/]$/.test(pre.trim()) && pre.trim()) continue;   // part of a longer chain or algebra
    const a = +m[1], b = +m[3], r = +m[4]; let v;
    switch (m[2]){ case 'x': case '×': case '*': v = a*b; break; case '/': case '÷': v = a/b; break; case '+': v = a+b; break; default: v = a-b; }
    if (Math.abs(v - r) > 0.011 && Math.abs(v - r)/Math.max(1, Math.abs(r)) > 0.005 && Math.abs(v*100 - r) > 0.011) bad.push(`${m[1]} ${m[2]} ${m[3]} = ${m[4]} (should be ${+v.toFixed(4)})`);
  }
  return bad;
}
function validateGenerated(raw, sec, existing){
  const errs = []; const q = {};
  if (!raw || typeof raw !== 'object') return { errs:['not an object'] };
  q.stem = String(raw.stem || '').trim(); if (q.stem.length < 8) errs.push('stem too short');
  q.choices = Array.isArray(raw.choices) ? raw.choices.map(c => String(c).replace(/^[A-D][.)]\s*/, '').trim()) : [];
  if (q.choices.length !== 4) errs.push('needs exactly 4 choices');
  if (new Set(q.choices.map(c => c.toLowerCase())).size !== q.choices.length || q.choices.some(c => !c)) errs.push('choices repeat or are empty');
  let a = raw.answer; if (typeof a === 'string'){ a = a.trim(); a = /^[A-Da-d]$/.test(a) ? 'ABCD'.indexOf(a.toUpperCase()) : (/^\d$/.test(a) ? +a : q.choices.indexOf(a)); }
  q.answer = a; if (!(a >= 0 && a <= 3 && Number.isInteger(a))) errs.push('answer must be 0-3 or A-D');
  q.difficulty = Math.round(+raw.difficulty); if (!(q.difficulty >= 1 && q.difficulty <= 3)) errs.push('difficulty must be 1-3');
  const topics = SEC_TOPICS(sec); q.topic = topics.includes(raw.topic) ? raw.topic : topics[0];
  q.steps = Array.isArray(raw.steps) ? raw.steps.map(s => String(s).trim()).filter(Boolean) : [];
  if (q.steps.length < 2 || q.steps.length > 10) errs.push('needs 2-10 steps');
  q.explanation = String(raw.explanation || q.steps.join(' ')).trim();
  if (sec === 'PC'){ q.passage = String(raw.passage || '').trim(); if (q.passage.split(/\s+/).length < 30) errs.push('PC needs a passage of 30+ words'); }
  if (/[*_#`]/.test(q.stem + q.choices.join(''))) errs.push('has markdown symbols');
  if (existing.has(normalize(q.stem) + '|' + normalize(q.passage || ''))) errs.push('duplicate of a bank question');
  if (!errs.length && (sec === 'AR' || sec === 'MK')){
    const bad = arithmeticProblems(q.steps.join(' ') + ' ' + q.explanation); if (bad.length) errs.push('math check failed: ' + bad[0]);
    const num = (q.choices[q.answer].replace(/[$,]/g,'').match(/-?\d+(?:\.\d+)?(?:\/\d+)?/) || [])[0];
    if (num && !(q.steps.join(' ') + ' ' + q.explanation).replace(/[$,]/g,'').includes(num)) errs.push('steps never reach the keyed answer');
  }
  if (!errs.length && !q.steps.some(s => /answer/i.test(s))) q.steps.push(`Answer: ${dot(q.choices[q.answer])}`);
  return { q, errs };
}

alanced scale."}, {"t": "pre", "x": "   x + 3   =   8\n  [ x + 3 ]=[   8   ]"}, {"t": "li", "x": "Do the same thing to BOTH sides."}, {"t": "li", "x": "The scale stays balanced."}, {"t": "h", "x": "One-step equations"}, {"t": "p", "x": "Undo with the opposite."}, {"t": "li", "x": "x + 5 = 12. Subtract 5. x = 7."}, {"t": "li", "x": "x - 4 = 9. Add 4. x = 13."}, {"t": "li", "x": "3x = 18. Divide by 3. x = 6."}, {"t": "li", "x": "x/2 = 7. Multiply by 2. x = 14."}, {"t": "h", "x": "Two-step equations"}, {"t": "p", "x": "Undo plus or minus FIRST. Then undo times or divide."}, {"t": "p", "x": "Example: 3x + 4 = 19"}, {"t": "pre", "x": "  3x + 4 = 19\n  3x     = 15     (subtract 4)\n  x      = 5      (divide by 3)"}, {"t": "li", "x": "Check: 3 x 5 + 4 = 19. Yes!"}, {"t": "p", "x": "Example: x/5 - 2 = 3"}, {"t": "pre", "x": "  x/5 - 2 = 3\n  x/5     = 5      (add 2)\n  x       = 25     (multiply by 5)"}, {"t": "h", "x": "Brackets"}, {"t": "p", "x": "2(x + 3) = 14"}, {"t": "li", "x": "Divide by 2: x + 3 = 7."}, {"t": "li", "x": "Subtract 3: x = 4."}, {"t": "h", "x": "Turn words into equations"}, {"t": "p", "x": "\"Twice a number plus 5 is 19.\""}, {"t": "li", "x": "Twice a number: 2x."}, {"t": "li", "x": "Plus 5: 2x + 5."}, {"t": "li", "x": "Is 19: 2x + 5 = 19."}, {"t": "li", "x": "2x = 14. x = 7."}, {"t": "h", "x": "Inequalities"}, {"t": "p", "x": "Same steps. Flip the sign only when you multiply or divide by a negative."}, {"t": "li", "x": "2x < 10. Divide by 2. x < 5."}, {"t": "h", "x": "Dyslexia tips"}, {"t": "li", "x": "Write the equation big, one step per line."}, {"t": "li", "x": "Write the action in the margin: \"subtract 4.\""}, {"t": "li", "x": "Use a different color for each side."}, {"t": "li", "x": "Always check by plugging your answer in."}, {"t": "li", "x": "Use \"x\" carefully. It looks like the times sign. Write times as a dot or \"x\" with space."}, {"t": "h", "x": "Ready to practice?"}, {"t": "li", "x": "Open L12_basic_algebra_practice.md."}, {"t": "li", " <script>
/* Math ladder: the 15-level catch-up track from the study pack (06_catchup).
   It builds the math under Arithmetic Reasoning (AR) and Math Knowledge (MK). 8 of 10 right moves you up. */
'use strict';
const LADDER = window.ASVAB_LADDER || { levels:[], placement:[], mastery:8, setSize:10 };
const NUM_WORDS = { one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, first:1, second:2, third:3, won:1, to:2, too:2, for:4, ate:8 };
function numberIn(t){ const m = String(t).match(/\b(\d{1,2})\b/); if (m) return +m[1];
  const w = String(t).split(/\s+/).find(x => x in NUM_WORDS && !['to','too','for','won','ate'].includes(x)); return w ? NUM_WORDS[w] : null; }
function ladState(){ return Object.assign({ level:1, placed:false, passed:{}, tries:{}, best:{}, log:[] }, Store.get('ladder', {})); }
function ladSave(s){ Store.set('ladder', s); }
function ladLevel(n){ return LADDER.levels[Math.min(15, Math.max(1, n)) - 1]; }
function ladderFind(t){
  const n = numberIn(t); if (n && n >= 1 && n <= 15 && /\blevel\b/.test(t)) return n;
  let best = null, bl = 0;
  LADDER.levels.forEach(l => l.keywords.forEach(k => { if (new RegExp('\\b' + k + '\\b').test(t) && k.length > bl){ best = l.n; bl = k.length; } }));
  return best;
}
function ladderStatusText(){
  const st = ladState(); const L = ladLevel(st.level); const passed = Object.keys(st.passed).length;
  return `On the math ladder you are on level ${st.level} of 15: ${L.title}. You passed ${passed} level${passed === 1 ? '' : 's'}.`;
}
let LR = null;   // current ladder run
SCREENS.ladder = (arg) => {
  const st = ladState(); const view = Math.min(15, Math.max(1, +arg || st.level)); const L = ladLevel(view);
  const passedN = Object.keys(st.passed).length;
  app().innerHTML = `<h1>Math ladder</h1>
  <div class="card" id="ladStatus"><p class="big-word">You are on level ${st.level} of 15: ${esc(ladLevel(st.level).title)}.</p>
    <p>${passedN} level${passedN === 1 ? '' : 's'} passed. Get ${LADDER.mastery} of ${LADDER.setSize} right to move up.</p>
    <p>This ladder builds the math under Arithmetic Reasoning and Math Knowledge.</p>
    ${st.placed ? '' : '<p>New here? Take the placement check first. It has 15 questions.</p>'}</div>
  <div class="card" id="ladView" data-level="${view}"><h2>Level ${view}: ${esc(L.title)}</h2>
    <p>${st.passed[view] ? 'Passed.' : view === st.level ? 'This is your level now.' : ''} ${st.best[view] != null ? `Best: ${st.best[view]} of 10.` : ''}</p>
    <div class="row"><button class="primary" id="ladStart">Start a set (10 questions)</button><button id="ladLesson">Read the lesson</button></div></div>
  <div class="row"><button id="ladPlace">Placement check</button></div>
  <h2>All levels</h2><div class="grid">${LADDER.levels.map(l => `<button class="tile ${l.n === view ? 'primary' : ''}" data-lv="${l.n}">Level ${l.n}${st.passed[l.n] ? ' (passed)' : ''}${l.n === st.level ? ' (you)' : ''}<small>${esc(l.title)}</small></button>`).join('')}</div>`;
  $('#ladStart').onclick = () => ladStart(view);
  $('#ladLesson').onclick = () => go('ladlesson', String(view));
  $('#ladPlace').onclick = () => ladStart(0);
  $$('[data-lv]').forEach(b => b.onclick = () => go('ladder', b.dataset.lv));
};
function ladLessonHTML(L){
  return L.lesson.map(b => b.t === 'h' ? `<h3>${wordsHTML(b.x)}</h3>` : b.t === 'li' ? `<p class="lad-li"><span aria-hidden="true">&#8226; </span>${wordsHTML(b.x)}</p>`
    : b.t === 'pre' ? `<pre class="lad-pre" aria-hidden="true">${esc(b.x)}</pre>` : `<p>${wordsHTML(b.x)}</p>`).join('');
}
SCREENS.ladlesson = (arg) => {
  const n = Math.min(15, Math.max(1, +arg || ladState().level)); const L = ladLevel(n);
  app().innerHTML = `<h1>Level ${n}: ${esc(L.title)}</h1>
  <div class="row"><button class="primary" id="ladStart">Start a set</button><button onclick="go('ladder','${n}')">Back to the ladder</button></div>
  <div class="card">${sayBtn('#ladLessonBody', '', 'Read the lesson')}<div id="ladLessonBody">${ladLessonHTML(L)}</div></div>
  <div class="row"><button class="primary" id="ladStart2">Start a set</button></div>`;
  $('#ladStart').onclick = $('#ladStart2').onclick = () => ladStart(n);
};
function ladStart(n){
  const st = ladState(); let qs, label;
  if (!n){ qs = LADDER.placement; label = 'Placement check'; }
  else { const L = ladLevel(n); const set = (st.tries[n] || 0) % L.sets.length; qs = L.sets[set]; label = `Level ${n}, set ${'ABCD'[set]}`; }
  cleanup(); window.scrollTo(0,0);
  LR = { n, qs: qs.map(q => Object.assign({}, q, { label: n ? `Math ladder, level ${n}` : 'Placement check' })), i:0, right:0, results:[], label };
  history.replaceState(null, '', '#ladder/' + (n || st.level));
  ladRender();
}
function ladRender(){
  const q = LR.qs[LR.i]; LR.answered = false; LR.hinted = false;
  app().innerHTML = `<h1>${esc(LR.label)}: question ${LR.i + 1} of ${LR.qs.length}</h1>${questionHTML(q)}
    <div class="row" id="ladTools"><button class="small" id="ladHint">Hint</button><button class="small" onclick="go('ladder')">End</button></div><div id="hintBox"></div><div id="fb"></div>`;
  $$('.choice').forEach(b => b.onclick = () => ladAnswer(+b.dataset.i));
  $('#ladHint').onclick = () => ladHint();
  if (HF.on) HF.enter('ladq'); else if (settings.autoRead) readQuestionAloud(q);
}
function ladHint(){
  const q = LR.qs[LR.i]; const L = ladLevel(q.level);
  const rule = (L.lesson.find(b => b.t === 'li' && b.x.length > 12) || {}).x;
  const h = LR.hinted ? 'No more hints. Give it your best try.' : 'Hint: Read it again slowly. Do one step at a time.' + (rule ? ' Remember: ' + dot(rule) : '');
  LR.hinted = true; const s = speakable(h);
  $('#hintBox').innerHTML = `<div class="card"><div class="row" style="align-items:flex-start"><div style="flex:1">${s.html}</div>${sayBtn('#' + s.id)}</div></div>`;
  return h;
}
function ladAnswer(i){
  if (!LR || LR.answered) return; LR.answered = true; const q = LR.qs[LR.i]; const ok = i === q.answer; markChoices(q, i);
  if (ok) LR.right++; LR.results.push({ ok, level:q.level, id:q.id, guess:i }); bumpDaily(1);
  const head = ok ? 'Right!' : `Not yet. The answer is ${LET[q.answer]}: ${dot(q.choices[q.answer])}`;
  const why = speakable(head + ' ' + q.explanation);
  $('#ladTools').classList.add('hidden');
  $('#fb').innerHTML = `<div class="card feedback ${ok ? 'ok' : 'bad'}"><div class="row" style="align-items:flex-start"><div style="flex:1" class="big-word" id="ladWhy">${why.html}</div>${sayBtn('#' + why.id)}</div>${ok ? '' : `<p>${esc(praise())}</p>`}</div>
    <div class="row"><button class="primary" id="nextBtn">${LR.i + 1 < LR.qs.length ? 'Next question' : 'See my score'}</button></div>`;
  $('#nextBtn').onclick = ladNext; $('#nextBtn').focus({ preventScroll:true });
  if (HF.on) HF.enter('ladfb', why.id); else if (settings.autoRead) Speech.speakEl(document.getElementById(why.id));
}
function ladNext(){ if (!LR) return; Speech.stop(); LR.i++; if (LR.i >= LR.qs.length) ladEnd(); else ladRender(); }
function ladEnd(){
  const st = ladState(); const r = LR; let msg;
  if (!r.n){
    const firstWrong = r.results.findIndex(x => !x.ok); const start = firstWrong < 0 ? 15 : r.qs[firstWrong].level;
    st.level = start; st.placed = true; for (let k = 1; k < start; k++) st.passed[k] = true;
    msg = firstWrong < 0 ? `You got all 15 right. Start at level 15: ${ladLevel(15).title}.`
      : `You got ${r.right} of 15. Your first miss was question ${firstWrong + 1}. Start at level ${start}: ${ladLevel(start).title}.`;
  } else {
    const n = r.n; st.best[n] = Math.max(st.best[n] ?? 0, r.right); st.log.push({ date:new Date().toISOString(), level:n, right:r.right, total:r.qs.length });
    if (r.right >= LADDER.mastery){
      st.passed[n] = true; st.tries[n] = 0; if (n >= st.level) st.level = Math.min(15, n + 1);
      msg = `You got ${r.right} of 10. You passed level ${n}! ` + (n < 15 ? `Next: level ${n + 1}, ${ladLevel(n + 1).title}.` : 'You finished the whole ladder. Now drill Arithmetic Reasoning and Math Knowledge.');
    } else {
      st.tries[n] = (st.tries[n] || 0) + 1;
      if (st.tries[n] >= 2 && n > 1){ st.tries[n] = 0; st.level = n - 1; msg = `You got ${r.right} of 10. That is OK. Go back to level ${n - 1} for a quick review. Then try level ${n} again.`; }
      else { st.level = n; msg = `You got ${r.right} of 10. You need ${LADDER.mastery} to move up. Read the lesson again. Then try the next set.`; }
    }
  }
  ladSave(st); const sum = speakable(msg);
  app().innerHTML = `<h1>${r.n ? 'Set done' : 'Placement done'}</h1>
    <div class="card"><div class="row"><div class="big-word" style="flex:1" id="ladSum">${sum.html}</div>${sayBtn('#' + sum.id)}</div></div>
    <div class="row"><button class="primary" id="ladGo">Go to level ${st.level}</button><button id="ladLes">Lesson for level ${st.level}</button><button onclick="go('home')">Home</button></div>`;
  $('#ladGo').onclick = () => go('ladder', String(st.level)); $('#ladLes').onclick = () => go('ladlesson', String(st.level));
  LR = null; if (HF.on) HF.enter('laddone', { msg, level:st.level });
}

</script>
<script>
/* App-wide hands-free mode. One tap starts it (browsers need one tap to unlock the mic and audio).

          const a = $('#pasteA'); HF.dictate(a, 'What did you answer? Say it, or say done to skip.', async () => { startPasteTutor(text, a.value.trim()); });
        }); return true; }
      if (/\b(miss|question|number)\b/.test(t) && numberIn(t)){ tutorMiss(numberIn(t) - 1); return true; }
      if (anyOf(t, ['last miss', 'my last miss', 'latest', 'last one', 'most recent']) || isGo(t)){ tutorMiss(0); return true; }
      return false;
    },
  },
  banktutor: {
    choices: () => T && !T.solved ? T.q.choices : null, pick: i => { if (!T.wrong.has(i)) tutorTry(i); },
    help: 'Say your answer, like A or Bravo. Or say I don\'t know, hint, show the answer, read the question, or try a similar one.',
    async intro(){ /* the tutor messages are read as they appear */ },
    async handle(t, all){
      if (!T) return false;
      if ($('#rule') && !T.ruleDone){ if (anyOf(t, ['skip', 'next', 'similar', 'try a similar one'])) { $('#ruleOk').click(); T.ruleDone = true; } else { $('#rule').value = t.replace(/^(my rule is|the rule is)\s*/, ''); $('#ruleOk').click(); T.ruleDone = true; return true; } }
      if (T.solved && anyOf(t, ['similar', 'try a similar one', 'another one', 'another', 'next', 'yes'])){ $('#tSimilar') && $('#tSimilar').click(); return true; }
      if (anyOf(t, ["i don't know", 'i dont know', 'no idea', 'not sure', 'dunno'])){ const b = $('#tIdk'); if (b) b.click(); return true; }
      if (/\b(hint|clue)\b/.test(t)){ const b = $('#tHint'); if (b) b.click(); return true; }
      if (anyOf(t, ['show the answer', 'show me the answer', 'tell me the answer', 'what is the answer', 'give up'])){ const b = $('#tShow'); if (b) b.click(); return true; }
      if (anyOf(t, ['read the question', 'read it', 'question'])){ HF.run(() => readQuestionAloud(T.q)); return true; }
      if (!T.solved){ const p = parseVoice(all, T.q.choices); if (p && p.type === 'answer'){ if (T.wrong.has(p.index)){ await HF.say(`You already tried ${LET[p.index]}. Pick another one.`); return true; } tutorTry(p.index); return true; } }
      return false;
    },
  },
  chat: {
    help: 'Just talk. I send what you say to the tutor. Say hint, or I don\'t know.',
    async intro(){},
    async handle(t, all, raw){
      if (!CHAT) return false;
      if (/\b(hint|clue)\b/.test(t)){ chatSend('Can I have the next hint?'); return true; }
      if (anyOf(t, ["i don't know", 'i dont know', 'no idea'])){ chatSend("I don't know."); return true; }
      if (/^(home|back|help|go home|main menu|progress|meps)\b/.test(t)) return false;
      chatSend(raw); return true;
    },
  },
  review: {
    help: 'Say next to hear the next miss. Say tutor me, remove this one, or home.',
    async intro(alive, f){ const list = reviewList(f); HF.revK = 0; await Speech.say(`My misses. ${list.length} saved.` + (list.length ? ' Here is the newest.' : ' Nice work.')); if (!alive() || !list.length) return; await readReviewItem(alive); },
    async handle(t){
      const list = reviewList(HF.arg); if (!list.length) return false;
      if (/\b(next|another)\b/.test(t)){ HF.revK++; if (HF.revK >= Math.min(list.length, 100)){ HF.revK = 0; await HF.say('That was the last one. Starting over.'); } HF.run(readReviewItem); return true; }
      if (/\b(previous|last one|go back one)\b/.test(t)){ HF.revK = Math.max(0, HF.revK - 1); HF.run(readReviewItem); return true; }
      if (anyOf(t, ['tutor me', 'tutor', 'help me with this'])){ const e = list[HF.revK]; go('tutor'); startBankTutor(e.q || qById(e.qid), e.guess); return true; }
      if (anyOf(t, ['remove', 'remove this one', 'delete', 'delete this one', 'i got it'])){ const e = list[HF.revK];
        const y = await HF.ask('Remove this miss from your list? Say yes or no.');
        if (y){ Store.set('errors', Store.get('errors', []).filter(x => x.id !== e.id)); go('review', HF.arg); await HF.say('Removed.'); } else await HF.say('Kept.'); return true; }
      return false;
    },
  },
  progress: {
    help: 'Say read the sections to hear each score. Say the plan, home, or a section name.',
    async intro(alive){
      await Speech.say('My progress.'); if (!alive()) return;
      const panel = $('#itPanel'); if (panel){ for (const el of $$('h3, p', panel)){ if (!alive()) return; if (el.closest('.notice')) continue; await Speech.say(textOf(el)); } }
      if (!alive()) return; await Speech.say('Estimate only. Confirm with a recruiter.');
      const relearn = Object.entries(Store.get('topics', {})).filter(([k, v]) => v.relearn && LESSONS[k]).map(([k]) => LESSONS[k].name);
      if (alive() && relearn.length) await Speech.say('Topics to re-learn: ' + relearn.slice(0, 6).join(', ') + '.');
      if (alive()) await Speech.say('Say read the sections, the plan, or home.');
    },
    async handle(t){
      if (anyOf(t, ['read the sections', 'sections', 'section scores', 'read sections'])){ HF.run(async alive => { const att = Store.get('attempts', {});
        for (const k of SEC_ORDER){ if (!alive()) return; const a = att[k] || []; await Speech.say(`${SECTIONS[k]}: level ${level(k)} of 3. ${a.length ? `Last score ${a[a.length-1].pct} percent.` : 'No scores yet.'}`); } }); return true; }
      return false;
    },
  },
  lesson: {
    help: 'Say practice this topic, tutor me, repeat, or back.',
    async intro(alive, topic){ const L = LESSONS[topic]; if (!L) return; await Speech.say(`Lesson: ${L.name}. What it is: ${L.what.join(' ')} Why it matters: ${L.why} Example: ${L.example.join(' ')} The rule: ${L.idea} Worked example: ${L.worked.join(' ')}`); if (alive()) await Speech.say('Say practice this topic, or tutor me.'); },
    async handle(t, all, raw, topic){ const L = LESSONS[topic]; if (!L) return false;
      if (anyOf(t, ['practice this topic', 'practice it']) || isGo(t) || t === 'practice'){ startSession(L.section, 5, { topic, hf:true }); return true; }
      if (anyOf(t, ['tutor me', 'tutor'])){ const pool = sectionPool(L.section).filter(q => q.topic === topic); if (pool.length) startBankTutor(pick(pool)); return true; }
      return false; },
  },
  settings: {
    help: 'Say slower, faster, read along on or off, dark mode on or off, auto start on or off, wake word on or off, or home.',
    async intro(){ await Speech.say(`Settings. Reading speed ${settings.rate}. Auto start is ${settings.hfAuto ? 'on' : 'off'}. Wake word is ${settings.hfWake ? 'on. Start each command with the word coach' : 'off'}. ` + VCTX.settings.help); },
    async handle(t){
      const onoff = t.match(/\b(on|off)\b/); if (!onoff) return false; const v = onoff[1] === 'on';
      const set = async (k, name) => { settings[k] = v; saveSettings(); await HF.say(`${name} ${v ? 'on' : 'off'}.`); go('settings'); return true; };
      if (/read ?along|highlight/.test(t)) return set('readAlong', 'Read along');
      if (/dark/.test(t)) return set('dark', 'Dark mode');
      if (/auto ?start|start by itself|remember/.test(t)) return set('hfAuto', 'Auto start');
      if (/wake/.test(t)) return set('hfWake', 'Wake word');
      if (/timer/.test(t)) return set('timerOn', 'Practice timer');
      return false;
    },
  },
  meps: {
    help: 'Say start the test to begin. Say home to leave.',
    async intro(){ await Speech.say(`MEPS practice test. Six parts in the real order. 85 questions. 144 minutes. No hints and no going back. If time runs out, the rest count as random guesses. So answer every question. Say start the test, or home.`); },
    async handle(t){ if (isGo(t, ['start meps', 'start meps mode'])){ $('#mStart').click(); return true; } return false; },
  },
  mepspart: {
    help: 'Say begin to start this part now. Say quit to end the test.',
    async intro(){ if (!M) return; const k = MEPS_ORDER[M.part]; const [n, min] = CAT[k]; await Speech.say(`Part ${M.part + 1} of ${MEPS_ORDER.length}: ${SECTIONS[k]}. ${n} questions. ${min} minutes. Say begin. Or it starts by itself.`); },
    async handle(t){
      if (isGo(t)){ const b = $('#mBegin'); if (b) b.click(); return true; }
      if (anyOf(t, ['quit', 'quit meps', 'end the test', 'stop the test', 'exit'])){ if (await HF.leaveMeps()) go('home'); return true; }
      return false;
    },
  },
  mepsq: {
    choices: () => M && M.q ? M.q.choices : null, pick: i => mepsAnswer(i),
    help: 'Say A, B, C, or D, or the answer words. Say repeat, read the passage, read the choices, or time left. There are no hints in MEPS mode.',
    async intro(alive){ if (!M || !M.q) return; await readQuestionAloud(M.q); if (alive()) await Speech.say('Your answer?'); },
    async handle(t, all){
      if (!M || !M.q) return false;
      if (/\btime\b/.test(t)){ await HF.say(`Time left: ${spokenTime((M.end - Date.now()) / 1000)}. Questions left: ${M.n - M.done}.`); return true; }
      if (/\b(hint|clue|explain|tutor)\b/.test(t)){ await HF.say('No hints in MEPS mode. Just like the real test. Give it your best answer.'); return true; }
      if (anyOf(t, ['read the passage', 'passage'])){ HF.run(async () => { await (M.q.passage ? sayEl('.passage-text', 'Passage.') : Speech.say('No passage.')); }); return true; }
      if (anyOf(t, ['read the choices', 'choices', 'options'])){ HF.run(async alive => { const chs = $$('.choice'); for (let i = 0; i < chs.length && alive(); i++) await sayEl(chs[i].querySelector('span[id]'), LET[i] + '.'); }); return true; }
      if (anyOf(t, ['quit', 'quit meps', 'end the test', 'stop the test', 'exit'])){ if (await HF.leaveMeps()) go('home'); return true; }
      if (/\b(skip|next|pass)\b/.test(t)){ await HF.say('No skipping on the real test. Pick your best answer. A guess is better than nothing.'); return true; }
      const p = parseVoice(all, M.q.choices); if (p && p.type === 'answer'){ mepsAnswer(p.index); return true; }
      return false;
    },
  },
  mepsreport: {
    help: 'Say review misses, progress, or home.',
    async intro(alive){ await sayEl('#mepsSum'); if (!alive()) return;
      const panel = $('#itPanel'); if (panel) for (const el of $$('h3, p', panel)){ if (!alive()) return; if (el.closest('.notice')) continue; await Speech.say(textOf(el)); }
      if (alive()) await Speech.say('Estimate only. Confirm with a recruiter. Say review misses, progress, or home.'); },
  },
  ladder: {
    help: 'Say start to do a set of 10. Say lesson to hear the lesson. Say placement test to find your level. Say go to fractions, or level 6, to move. Say what level am I.',
    async intro(alive, arg){ const st = ladState(); const view = Math.min(15, Math.max(1, +arg || st.level));
      await Speech.say(ladderStatusText() + (view !== st.level ? ` You are looking at level ${view}: ${ladLevel(view).title}.` : '')); if (!alive()) return;
      await Speech.say(st.placed ? 'Say start, lesson, go to a level, or help.' : 'New here? Say placement test. Or say start, lesson, or help.'); },
    async handle(t, all, raw, arg){
      const view = Math.min(15, Math.max(1, +arg || ladState().level));
      if (anyOf(t, ['placement test', 'placement', 'placement check', 'find my level'])){ ladStart(0); return true; }
      const n = ladderFind(t); if (n && n !== view){ go('ladder', String(n)); return true; }
      if (/\blesson\b/.test(t)){ go('ladlesson', String(view)); return true; }
      if (isGo(t) || t === 'practice'){ ladStart(view); return true; }
      if (n){ go('ladder', String(n)); return true; }
      return false;
    },
  },
  ladlesson: {
    help: 'Say start to do a set. Say repeat to hear the lesson again. Say back to the ladder.',
    async intro(alive, arg){ const n = +arg || ladState().level; await Speech.say(`Level ${n} lesson: ${ladLevel(n).title}.`); if (!alive()) return; await sayEl('#ladLessonBody'); if (alive()) await Speech.say('Say start to do a set of 10.'); },
    async handle(t, all, raw, arg){ if (isGo(t) || t === 'practice'){ ladStart(+arg || ladState().level); return true; } return false; },
  },
  ladq: {
    choices: () => LR && !LR.answered ? LR.qs[LR.i].choices : null, pick: i => ladAnswer(i),
    help: 'Say A, B, C, or D, or the answer. Say repeat, hint, or end.',
    async intro(alive){ if (!LR) return; await readQuestionAloud(LR.qs[LR.i]); if (alive()) await Speech.say('Your answer?'); },
    async handle(t, all){
      if (!LR) return false; const q = LR.qs[LR.i];
      if (/\b(hint|clue|help me)\b/.test(t)){ await HF.say(ladHint()); return true; }
      if (anyOf(t, ['read the choices', 'choices'])){ HF.run(async alive => { const chs = $$('.choice'); for (let i = 0; i < chs.length && alive(); i++) await sayEl(chs[i].querySelector('span[id]'), LET[i] + '.'); }); return true; }
      if (anyOf(t, ['end', 'quit', 'stop the set', 'end set'])){ const y = await HF.ask('End this set? Say yes or no.'); if (y) go('ladder'); else HF.enter('ladq'); return true; }
      const p = parseVoice(all, q.choices); if (p && p.type === 'answer'){ ladAnswer(p.index); return true; }
      return false;
    },
  },
  ladfb: {
    help: 'Say next. Or say repeat to hear why again.',
    async intro(alive, whyId){ await sayEl('#' + whyId); if (alive()) await Speech.say(LR && LR.i + 1 < LR.qs.length ? 'Say next.' : 'Say next to see your score.'); },
    async handle(t){ if (/\b(next|continue|go on|ready|score)\b/.test(t)){ ladNext(); return true; } return false; },
  },
  laddone: {
    help: 'Say start to do the next set. Say lesson, math ladder, or home.',
    async intro(alive, info){ await Speech.say(info.msg); if (alive()) await Speech.say(`Say start for level ${info.level}, lesson, or home.`); },
    async handle(t, all, raw, info){
      if (/\blesson\b/.test(t)){ go('ladlesson', String(info.level)); return true; }
      if (isGo(t, ['next level', 'next set', 'try again']) || t === 'again'){ ladStart(info.level); return true; }
      return false; },
  },
};
function spokenTime(s){ s = Math.max(0, Math.ceil(s)); const m = Math.floor(s / 60), r = s % 60; return (m ? `${m} minute${m === 1 ? '' : 's'}` : '') + (m && r ? ' and ' : '') + (r || !m ? `${r} second${r === 1 ? '' : 's'}` : ''); }
async function readMiss(st, alive){
  const e = st.errs[st.k]; if (!e) return;
  await Speech.say(`Miss ${st.k + 1} of ${st.errs.length}. ${SECTIONS[e.section] || ''}. ${e.stem} The right answer is: ${dot(e.answerText)} ${firstSentence(e.explanation)}`);
  if (alive()) await Speech.say(st.k + 1 < st.errs.length ? 'Say next miss, or skip review.' : 'That was the last one. Say start.');
}
function reviewList(f){ const errs = Store.get('errors', []); return errs.filter(e => !SECTIONS[f] || e.section === f).slice(0, 100); }
async function readReviewItem(alive){
  const list = reviewList(HF.arg); const e = list[HF.revK]; if (!e) return;
  await Speech.say(`Miss ${HF.revK + 1} of ${list.length}. ${SECTIONS[e.section] || ''}. ${e.stem} You said: ${dot(e.guessText)} The right answer is: ${dot(e.answerText)} ${e.explanation}`);
  if (alive()) await Speech.say('Say next, tutor me, or remove this one.');
}

boot();

</script>
</body>
</html>
